id: upstream_drift
title: UpstreamDrift Wizard Knowledge Pack
chunk_chars: 1800
sources:
  - repo: UpstreamDrift
    authority: product
    include:
      - "docs/user_guide/**/*.md"
      - "docs/help/**/*.md"
      - "docs/sidekick/**/*.md"
      - "docs/tutorials/**/*.md"
      - "README.md"
    exclude:
      - "docs/development/**"
      - "docs/assessments/**"
      - "docs/plans/**"
      - "docs/handoffs/**"
      - "docs/generated/**"
  - repo: UpstreamDrift
    authority: reference
    include:
      - "SPEC.md"
      - "docs/adr/**/*.md"
      - "docs/api/**/*.md"
      - "docs/codemap/**/*.md"
      - "docs/conventions/**/*.md"
      - "docs/engines/**/*.md"
      - "docs/simulation_backends/**/*.md"
      - "docs/physics/**/*.md"
    exclude:
      - "docs/development/**"
      - "docs/assessments/**"
      - "docs/plans/**"
      - "docs/handoffs/**"
      - "docs/generated/**"
