# ---------------------------------------------------------------------------
# Hands (rigid attachment points for the club)
# ---------------------------------------------------------------------------

LeftHand:
  mass_kg: 0.453
  com_offset_m: [0.0, 0.0, 0.0127]
  inertia_kgm2:
    - [2.55375833333333e-06, 0.0, 0.0]
    - [0.0, 2.55375833333333e-06, 0.0]
    - [0.0, 0.0, 8.0645e-07]
  source: "SegmentInertiaLogs.LH{COM,Inertia} at t=0"
  notes: >
    Left hand rigid body. The grip-anchor frame attaches the club to a 6-DOF
    locked joint at the COM offset from the wrist.

RightHand:
  mass_kg: 0.453
  com_offset_m: [-0.00351963996945186, 0.0, 0.0]
  inertia_kgm2:
    - [0.0011443635214626, 0.0, 0.0]
    - [0.0, 0.0313182884447391, 0.0]
    - [0.0, 0.0, 0.0313182884447391]
  source: "SegmentInertiaLogs.RH{COM,Inertia} at t=0"
  notes: >
    Right hand. Asymmetric COM relative to the left hand because the right
    hand carries the bulk of the club mass below the grip in the Simscape
    model (the club inertia is rolled into RH in the lower-frame logs).

# ---------------------------------------------------------------------------
# Club (rigidly attached at the grip via a 6-DOF locked joint)
# ---------------------------------------------------------------------------

Club:
  mass_kg: 1.48519517069452
  shaft:
    length_m: 1.0
    outer_radius_m: 0.010
    wall_thickness_m: 0.0015
    density_kg_m3: 500.0
    youngs_modulus_GPa_param: ShaftStiffness
  clubhead:
    mass_kg: 0.25
    radius_m: 0.0635
  source: "ClubLogs.ClubMass at t=0; shaft geometry from GolfSwing3D_Kinetic.mdl"
  notes: >
    Total club mass (1.485 kg) is shaft-beam + clubhead sphere. The shaft
    Young's modulus is parameterised so flexible-shaft variants can be
    swept; the rigid-shaft variant locks ShaftStiffness to a high value.
