# Golf Humanoid — Per-Segment Mass, COM, and Inertia
#
# Single source of truth for inertial parameters. See
# src/engines/CROSS_ENGINE_PARITY_SPEC.md §2.6.
#
# Units: SI throughout — kg, metres, kg·m².
#
# Coordinate convention: all COM offsets and inertia tensors are expressed in
# the SEGMENT-LOCAL frame, with the origin at the proximal joint of the
# segment and axes aligned with the Simscape body element's local frame
# (z aligned with the long axis of the segment for limb segments; z up for
# torso segments).
#
# Provenance: per-segment inertias are taken from the Simscape
# `SegmentInertiaLogs.*` bus signals captured at simulation t=0 in
# `trial_001_20251030_202704.csv`. The Simscape body elements compute these
# from `BasedOnType=Mass`/`Density` plus geometry, so the logged values are
# the SI ground truth for every downstream engine. Total golfer mass at t=0
# was 77.61 kg.
#
# Mass cross-check: the model-workspace `*Mass` scalars (e.g.
# `UpperTorsoMass=20`, `LowerTorsoMass=25`) are authored in **pounds** and
# converted internally by the Simscape body-element MassUnits setting. Only
# the SI segment masses listed below are the canonical per-segment values
# (back-computed from the logged inertias and segment geometry).
#
# Last updated: 2026-05-06 (issue #4093)

schema_version: 1
units_system: SI

golfer:
  total_mass_kg: 77.6058178357468
  com_offset_m: [0.0158853243836743, -0.228508760996917, 0.414626897289436]
  source: "SegmentInertiaLogs.GolferMass / .GolferCOM at t=0 (trial_001_20251030_202704.csv)"
  notes: >
    Whole-body mass and COM in world coordinates at t=0 (address pose). The
    COM y-offset reflects the spine column being slightly behind the world
    origin in the address frame.

# ---------------------------------------------------------------------------
# Trunk segments
# ---------------------------------------------------------------------------

UpperTorso:
  mass_kg: 9.072
  com_offset_m: [0.0, 0.0, 0.03048]
  inertia_kgm2:
    - [0.0281805888, 0.0, 0.0]
    - [0.0, 0.0281805888, 0.0]
    - [0.0, 0.0, 0.04645152]
  source: "SegmentInertiaLogs.UpperTorso{COM,Inertia} at t=0; mass = 20 lb × 0.453592"
  notes: >
    Modelled as a solid cylinder, radius 6 in (0.1524 m), height 12 in
    (0.3048 m), with the principal-z axis aligned with the spine. Mass
    sourced from model-workspace UpperTorsoMass = 20 lb.

LowerTorso:
  mass_kg: 11.34
  com_offset_m: [0.0, 0.0, 0.1524]
  inertia_kgm2:
    - [0.7354824, 0.0, 0.0]
    - [0.0, 0.7354824, 0.0]
    - [0.0, 0.0, 0.2322576]
  source: "SegmentInertiaLogs.LowerTorso{COM,Inertia} at t=0; mass = 25 lb × 0.453592"
  notes: >
    Modelled as a solid cylinder, radius and height from the Simscape body
    element. Mass sourced from model-workspace LowerTorsoMass = 25 lb.

