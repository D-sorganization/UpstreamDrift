# UpstreamDrift Rust Workspace
# Phase 2: Physics kernels consuming tools-core from the Tools hub.
# See: https://github.com/D-sorganization/UpstreamDrift/issues/1639

[workspace]
resolver = "2"
members = ["rust_core/upstream-physics"]
exclude = ["ui/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["D-sorganization"]
repository = "https://github.com/D-sorganization/UpstreamDrift"

[workspace.dependencies]
# Shared kernel from D-sorganization/Tools repository.
# Requires Tools checked out as a sibling directory (../Tools).
# CI overrides this path via .cargo/config.toml [patch] table — see that file
# for setup instructions and the rationale for this layout.
# To set up locally: git clone git@github.com:D-sorganization/Tools.git ../Tools
tools-core = { path = "../Tools/rust_core/tools-core" }
pyo3 = { version = "0.24", features = ["extension-module"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nalgebra = "0.33"
