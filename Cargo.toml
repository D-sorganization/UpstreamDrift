# UpstreamDrift Rust Workspace
# Phase 2: Physics kernels consuming tools-core from the Tools hub.
# See: https://github.com/D-sorganization/UpstreamDrift/issues/1639

[workspace]
resolver = "2"
members = ["rust_core/upstream-physics", "rust_core/ai_backend"]
exclude = ["ui/src-tauri"]

[workspace.package]
version = "2.1.0"
edition = "2021"
license = "MIT"
authors = ["D-sorganization"]
repository = "https://github.com/D-sorganization/UpstreamDrift"

[workspace.dependencies]
# Shared kernel from D-sorganization/Tools repository.
# Pin the git revision so a clean UpstreamDrift clone can build Rust crates
# without requiring a sibling Tools checkout or ad hoc CI symlinks.
tools-core = { git = "https://github.com/D-sorganization/Tools.git", rev = "ea2690362481379b94135894f9dfac2b70d1bc65" }
pyo3 = { version = "0.24", features = ["extension-module"] }
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nalgebra = "0.33"
