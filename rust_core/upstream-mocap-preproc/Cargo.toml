[package]
name = "upstream-mocap-preproc"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Mocap preprocessing kernels for UpstreamDrift: Butterworth/SavGol/Kalman/median/Gaussian filters, gap fill, FPS resample"

[lib]
name = "upstream_mocap_preproc"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3", "dep:numpy"]

[dependencies]
pyo3 = { workspace = true, optional = true }
numpy = { version = "0.24", optional = true }
ndarray = "0.16"
nalgebra = { workspace = true }
rayon = "1.10"

[dev-dependencies]
approx = "0.5"
