[package]
name = "upstream-muscle"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Hill-type muscle model kernels for UpstreamDrift biomechanics. Slice 1: scalar force-length / force-velocity / tendon curves with PyO3 bindings (UD#5216)."

[lib]
name = "upstream_muscle"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# PyO3 bindings (extension-module). Off by default so `cargo test` runs without
# linking libpython, mirroring the upstream-physics / ai_backend pattern.
python = ["dep:pyo3"]

[dependencies]
nalgebra = { workspace = true }
pyo3 = { workspace = true, optional = true }

[dev-dependencies]
approx = "0.5"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "hill"
harness = false
