[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "upstream-muscle"
version = "2.1.0"
description = "Rust-compiled Hill-type muscle kernels: force-length / force-velocity / tendon curves, activation dynamics, multi-muscle moment summation, batched RL inner-loop APIs."
requires-python = ">=3.10"
license = {text = "MIT"}

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "numpy>=1.24",
]

[tool.maturin]
features = ["python"]
module-name = "upstream_muscle"
manifest-path = "Cargo.toml"
