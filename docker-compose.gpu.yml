# docker-compose.gpu.yml — GPU overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up
services:
  backend:
    environment:
      - MUJOCO_GL=egl
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${NVIDIA_GPU_COUNT:-all}
              capabilities: [gpu, compute, utility]
    healthcheck:
      test: ["CMD-SHELL", "nvidia-smi > /dev/null 2>&1 && curl -f http://localhost:8001/health"]

  training:
    environment:
      - MUJOCO_GL=egl
      - NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-all}
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,graphics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: ${NVIDIA_GPU_COUNT:-all}
              capabilities: [gpu, compute, utility]
