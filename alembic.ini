# Alembic configuration for UpstreamDrift database migrations.
# Issue #2078: Add database migration tooling.

[alembic]
# Path to migration scripts
script_location = src/api/migrations

# Template used to generate migration filenames.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# Path separator for prepend_sys_path and version_locations (os = use os.pathsep)
path_separator = os

# Timezone to use when rendering the date within the migration file
# as well as the filename.
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command,
# regardless of autogenerate
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file to be
# detected as revisions in the versions/ directory.
sourceless = false

# Version location specification; This defaults
# to src/api/migrations/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
version_locations = %(here)s/src/api/migrations/versions

# The output encoding used when revision files are written from
# script.py.mako; can be utf-8 or utf-8-bom
output_encoding = utf-8

# Database URL — override via environment variable DATABASE_URL
# (SQLite default for local development; use PostgreSQL in production)
sqlalchemy.url = sqlite:///./golf_modeling_suite.db


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner
# entry point, install it first with "pip install black"
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 88 REVISION_SCRIPT_FILENAME


# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
