version: 1
divergences:
  - id: soft-vs-hard-contact-smoke
    check: differential_cross_engine_reference
    metric: position
    engines: [mock-soft-contact, mock-reference]
    tolerance: 0.01
    rationale: >
      Stub fixture for the CC-7 registry contract. Real entries must name the
      contact model or solver difference and the tolerance accepted by review.

  - id: contact-solver-evaluation-timing
    check: contact_law_conformance
    metric: force_n
    engines: [mujoco, pinocchio]
    tolerance: 0.0001
    rationale: >
      MuJoCo applies external contact force via qfrc_applied before passive forces,
      Drake evaluates external forces within CalcOutput before continuous state derivatives,
      and Pinocchio evaluates constraint dynamics via Delassus matrix. Substep and mid-step
      evaluation differences cause small force discrepancies under high velocity transients.

  - id: dual-grip-closure-formulation
    check: grip_closure_conformance
    metric: closure_rank
    engines: [pinocchio, mujoco]
    tolerance: 0.000001
    rationale: >
      Pinocchio and Drake enforce spatial 6-DOF weld constraints (rank 6), while MuJoCo uses
      weld equality constraints with finite solref/solimp compliance and MJX approximates via
      spring-damper elements.

  - id: hunt-crossley-dissipation-clipping
    check: contact_dissipation_conformance
    metric: normal_force_n
    engines: [shared_law, hunt_crossley]
    tolerance: 0.000001
    rationale: >
      Hunt-Crossley normal force magnitude is explicitly clipped at zero (f_n = max(0, f_n))
      to prevent tensile contact forces during high rebound velocities.

  - id: mujoco-stock-soft-weld-vs-hard-kkt
    check: closed_loop_snapshot_conformance
    metric: closure_acceleration_residual_ratio
    engines: [mujoco-stock-step, mujoco-hard-kkt]
    tolerance: 10.0
    rationale: >
      Stock mj_step / mj_forward keeps the grip weld as a compliant equality
      (solref 0.02 1, solimp 0.9 0.95 0.001) and solves it with the contact
      solver, so the loop is not rigid.  The NSX closed-loop snapshot (NSX-51,
      #12579) therefore never reads stock stepping: it assembles M (mj_fullM),
      h (qfrc_bias) and the weld site Jacobians and solves the exact KKT system
      with zero regularisation, so J a + Jdot v closes to round-off.  The metric
      is |J qacc_stock + Jdot v| / |J a_free + Jdot v| at contact-free,
      limit-free closure-consistent states.  Measured ratios (zero effort,
      unit-normal effort) per ground_support dynamics-record frame: 100:
      0.778, 0.022; 250: 2.612, 0.023; 400: 1.858, 0.028; 500: 2.906, 0.055.
      The tolerance of 10 is an order-of-magnitude sanity envelope, not a fit
      to these values and not a convergence tolerance: this entry documents
      that stock stepping differs from the rigid solve (the test asserts the
      ratio exceeds 1e-3), it does not certify agreement.  Stock stepping is
      not a 1e-10 reference.  The hard-KKT side is held to the tolerances of
      the Pinocchio cross-engine snapshot test.

  # NSX-56 (#12584): Track N numerical equality of the canonical closed-loop
  # snapshot, scaled error max|x - ref| / max(1, max|ref|), Pinocchio reference.
  # Measured on ground_support frames 0 and 400: M, h <= 1e-15, J_c <= 3e-15,
  # Jdot_v 1.8e-12 (Drake, OpenSim) and 1.2e-10 (MuJoCo finite difference).
  - id: nsx56-pinocchio-mujoco-m
    check: closed_loop_snapshot_conformance
    metric: M
    engines: [pinocchio, mujoco]
    tolerance: 1e-11
    rationale: >
      Same specification, same state, MuJoCo via composite-rigid-body
      mj_fullM and mj_rne against Pinocchio CRBA/RNEA; the grip closure is
      the canonical weld6 after the NSX-02 conversion (WORLD frame at the
      site, relative sign -1 in MuJoCo; LOCAL at the weld frame in
      Pinocchio).

  - id: nsx56-pinocchio-mujoco-h
    check: closed_loop_snapshot_conformance
    metric: h
    engines: [pinocchio, mujoco]
    tolerance: 1e-11
    rationale: >
      Same specification, same state, MuJoCo via composite-rigid-body
      mj_fullM and mj_rne against Pinocchio CRBA/RNEA; the grip closure is
      the canonical weld6 after the NSX-02 conversion (WORLD frame at the
      site, relative sign -1 in MuJoCo; LOCAL at the weld frame in
      Pinocchio).

  - id: nsx56-pinocchio-mujoco-j_c
    check: closed_loop_snapshot_conformance
    metric: J_c
    engines: [pinocchio, mujoco]
    tolerance: 1e-12
    rationale: >
      Same specification, same state, MuJoCo via composite-rigid-body
      mj_fullM and mj_rne against Pinocchio CRBA/RNEA; the grip closure is
      the canonical weld6 after the NSX-02 conversion (WORLD frame at the
      site, relative sign -1 in MuJoCo; LOCAL at the weld frame in
      Pinocchio).

  - id: nsx56-pinocchio-mujoco-jdot_v
    check: closed_loop_snapshot_conformance
    metric: Jdot_v
    engines: [pinocchio, mujoco]
    tolerance: 1e-08
    rationale: >
      Same specification, same state, MuJoCo via composite-rigid-body
      mj_fullM and mj_rne against Pinocchio CRBA/RNEA; the grip closure is
      the canonical weld6 after the NSX-02 conversion (WORLD frame at the
      site, relative sign -1 in MuJoCo; LOCAL at the weld frame in
      Pinocchio). Jdot v is a second-order central finite difference (step
      1e-6) of the weld Jacobian because MuJoCo has no analytic
      derivative; the registered 1e-8 is the limit the NSX-51 unit tests
      already carried, not a fit.

  - id: nsx56-pinocchio-drake-m
    check: closed_loop_snapshot_conformance
    metric: M
    engines: [pinocchio, drake]
    tolerance: 1e-11
    rationale: >
      Same specification, same state, Drake MultibodyPlant
      CalcMassMatrix/CalcInverseDynamics against Pinocchio CRBA/RNEA;
      Drake exposes a different native coordinate order, permuted by name
      before comparison; closure rows canonical after the NSX-02
      conversion.

  - id: nsx56-pinocchio-drake-h
    check: closed_loop_snapshot_conformance
    metric: h
    engines: [pinocchio, drake]
    tolerance: 1e-11
    rationale: >
      Same specification, same state, Drake MultibodyPlant
      CalcMassMatrix/CalcInverseDynamics against Pinocchio CRBA/RNEA;
      Drake exposes a different native coordinate order, permuted by name
      before comparison; closure rows canonical after the NSX-02
      conversion.

  - id: nsx56-pinocchio-drake-j_c
    check: closed_loop_snapshot_conformance
    metric: J_c
    engines: [pinocchio, drake]
    tolerance: 1e-12
    rationale: >
      Same specification, same state, Drake MultibodyPlant
      CalcMassMatrix/CalcInverseDynamics against Pinocchio CRBA/RNEA;
      Drake exposes a different native coordinate order, permuted by name
      before comparison; closure rows canonical after the NSX-02
      conversion.

  - id: nsx56-pinocchio-drake-jdot_v
    check: closed_loop_snapshot_conformance
    metric: Jdot_v
    engines: [pinocchio, drake]
    tolerance: 1e-10
    rationale: >
      Same specification, same state, Drake MultibodyPlant
      CalcMassMatrix/CalcInverseDynamics against Pinocchio CRBA/RNEA;
      Drake exposes a different native coordinate order, permuted by name
      before comparison; closure rows canonical after the NSX-02
      conversion.

  - id: nsx56-pinocchio-opensim-m
    check: closed_loop_snapshot_conformance
    metric: M
    engines: [pinocchio, opensim]
    tolerance: 1e-11
    rationale: >
      Same specification, same state, Simbody (OpenSim) mass matrix and
      inverse dynamics against Pinocchio CRBA/RNEA; native coordinate
      order differs and is permuted by name; closure rows canonical after
      the NSX-02 conversion.

  - id: nsx56-pinocchio-opensim-h
    check: closed_loop_snapshot_conformance
    metric: h
    engines: [pinocchio, opensim]
    tolerance: 1e-11
    rationale: >
      Same specification, same state, Simbody (OpenSim) mass matrix and
      inverse dynamics against Pinocchio CRBA/RNEA; native coordinate
      order differs and is permuted by name; closure rows canonical after
      the NSX-02 conversion.

  - id: nsx56-pinocchio-opensim-j_c
    check: closed_loop_snapshot_conformance
    metric: J_c
    engines: [pinocchio, opensim]
    tolerance: 1e-12
    rationale: >
      Same specification, same state, Simbody (OpenSim) mass matrix and
      inverse dynamics against Pinocchio CRBA/RNEA; native coordinate
      order differs and is permuted by name; closure rows canonical after
      the NSX-02 conversion.

  - id: nsx56-pinocchio-opensim-jdot_v
    check: closed_loop_snapshot_conformance
    metric: Jdot_v
    engines: [pinocchio, opensim]
    tolerance: 1e-10
    rationale: >
      Same specification, same state, Simbody (OpenSim) mass matrix and
      inverse dynamics against Pinocchio CRBA/RNEA; native coordinate
      order differs and is permuted by name; closure rows canonical after
      the NSX-02 conversion.



  - id: nsx56-pinocchio-myosuite-m
    check: closed_loop_snapshot_conformance
    metric: M
    engines: [pinocchio, myosuite]
    tolerance: 1e-11
    rationale: >
      Same specification, same state, the MyoSuite-held MuJoCo model
      (MyoSuiteForceAdapter reuses the MuJoCo hard-KKT snapshot code)
      against Pinocchio CRBA/RNEA; closure rows canonical after the NSX-02
      conversion.

  - id: nsx56-pinocchio-myosuite-h
    check: closed_loop_snapshot_conformance
    metric: h
    engines: [pinocchio, myosuite]
    tolerance: 1e-11
    rationale: >
      Same specification, same state, the MyoSuite-held MuJoCo model
      (MyoSuiteForceAdapter reuses the MuJoCo hard-KKT snapshot code)
      against Pinocchio CRBA/RNEA; closure rows canonical after the NSX-02
      conversion.

  - id: nsx56-pinocchio-myosuite-j_c
    check: closed_loop_snapshot_conformance
    metric: J_c
    engines: [pinocchio, myosuite]
    tolerance: 1e-12
    rationale: >
      Same specification, same state, the MyoSuite-held MuJoCo model
      (MyoSuiteForceAdapter reuses the MuJoCo hard-KKT snapshot code)
      against Pinocchio CRBA/RNEA; closure rows canonical after the NSX-02
      conversion.

  - id: nsx56-pinocchio-myosuite-jdot_v
    check: closed_loop_snapshot_conformance
    metric: Jdot_v
    engines: [pinocchio, myosuite]
    tolerance: 1e-08
    rationale: >
      Same specification, same state, the MyoSuite-held MuJoCo model
      (MyoSuiteForceAdapter reuses the MuJoCo hard-KKT snapshot code)
      against Pinocchio CRBA/RNEA; closure rows canonical after the NSX-02
      conversion. Jdot v is the MuJoCo second-order central finite
      difference (step 1e-6); the registered 1e-8 is the NSX-51 limit.
