  - id: nsx98-pinocchio-drake-d-acc-d-tau
    check: closed_loop_derivative_conformance
    metric: d_acc_d_tau
    engines: [pinocchio, drake]
    tolerance: 7.7e-10
    rationale: >
      Drake AutoDiffXd exact derivatives (NSX-86) against Pinocchio ANALYTIC
      (NSX-85). Same specification, projected state (frames 0 and 400 of the
      ground-support dynamics record), seeded actuated load and one closure
      tangent space; operators compared in the Pinocchio coordinate order as D P^T
      (state blocks) or the plain matrix (load blocks); scaled error
      max|x-ref|/max(1,max|ref|). Bound: load blocks use kkt_bound with a zero
      right-hand side times sqrt(nv); state blocks are held to the spread of the
      engine-free NSX-84 finite-difference reference under step x0.5 and x2 (step
      1e-3), the smallest difference between two exact routes it can resolve
      (NSX-86). Measured 2e-11 (max over the two frames); registered value is the
      derived bound rounded up to two significant digits. Agreement is software
      conformance, not physical validation.

