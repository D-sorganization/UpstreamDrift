version: 1
divergences:
  - id: soft-vs-hard-contact-smoke
    check: differential_cross_engine_reference
    metric: position
    engines: [mock-soft-contact, mock-reference]
    tolerance: 0.01
    rationale: >
      Stub fixture for the CC-7 registry contract. Real entries must name the
      contact model or solver difference and the tolerance accepted by review.

  - id: contact-solver-evaluation-timing
    check: contact_law_conformance
    metric: force_n
    engines: [mujoco, pinocchio]
    tolerance: 0.0001
    rationale: >
      MuJoCo applies external contact force via qfrc_applied before passive forces,
      Drake evaluates external forces within CalcOutput before continuous state derivatives,
      and Pinocchio evaluates constraint dynamics via Delassus matrix. Substep and mid-step
      evaluation differences cause small force discrepancies under high velocity transients.

  - id: dual-grip-closure-formulation
    check: grip_closure_conformance
    metric: closure_rank
    engines: [pinocchio, mujoco]
    tolerance: 0.000001
    rationale: >
      Pinocchio, Drake, OpenSim, and hard-KKT MuJoCo share a rank-6 canonical
      closure Jacobian in the grip frame ([fx, fy, fz, tx, ty, tz] with +J_c^T lambda
      on the tree via NSX-02 to_canonical_closure), whereas stock MuJoCo mj_step
      uses weld equality constraints with finite solref/solimp compliance and MJX
      approximates via spring-damper elements.

  - id: hunt-crossley-dissipation-clipping
    check: contact_dissipation_conformance
    metric: normal_force_n
    engines: [shared_law, hunt_crossley]
    tolerance: 0.000001
    rationale: >
      Hunt-Crossley normal force magnitude is explicitly clipped at zero (f_n = max(0, f_n))
      to prevent tensile contact forces during high rebound velocities.

  - id: nsx-closed-loop-snapshot-track-n
    check: loop_nullspace_track_n_conformance
    metric: canonical_snapshot_relative_delta
    engines: [pinocchio, mujoco, myosuite, drake, opensim, simscape]
    tolerance: 0.000001
    rationale: >
      On states projected onto the closure manifold via project_to_closure and converted
      through to_canonical_closure (NSX-02), canonical (M, h, J_c, Jdot_v) across Pinocchio,
      MuJoCo hard-KKT, MyoSuite (kkt_regularization == 0), Drake, OpenSim, and Simscape R2025b
      agree within 1e-6 scaled relative norm (#12584).

  - id: nsx-mujoco-soft-equality-vs-hard-kkt
    check: loop_nullspace_constraint_enforcement
    metric: closure_acceleration_residual
    engines: [mujoco_soft_step, mujoco_hard_kkt]
    tolerance: 0.01
    rationale: >
      Stock MuJoCo mj_step enforces weld equality constraints via soft solref/solimp impedance
      (CapabilityLevel.PARTIAL), whereas MuJoCoClosedLoopSnapshotAdapter evaluates the exact
      unregularized hard-KKT closure system (kkt_regularization == 0, CapabilityLevel.FULL)
      for NSX-51/NSX-56 conformance (#12579, #12584).
