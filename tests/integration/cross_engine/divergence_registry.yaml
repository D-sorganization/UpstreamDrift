  - id: nsx98-pinocchio-mujoco-d-acc-d-tau
    check: closed_loop_derivative_conformance
    metric: d_acc_d_tau
    engines: [pinocchio, mujoco]
    tolerance: 8.6e-10
    rationale: >
      MuJoCo hard-KKT central finite differences (step 1e-5) against Pinocchio
      ANALYTIC (NSX-85). Same specification, projected state (frames 0 and 400 of
      the ground-support dynamics record), seeded actuated load and one closure
      tangent space; operators compared in the Pinocchio coordinate order as D P^T
      (state blocks) or the plain matrix (load blocks); scaled error
      max|x-ref|/max(1,max|ref|). Bound: Track N snapshot differences propagated
      with kkt_bound, divided by the step and multiplied by sqrt(k) per state
      column (NSX-88 derivation); load blocks use kkt_bound with a zero right-hand
      side times sqrt(nv). Measured 1.7e-11 (max over the two frames); registered
      value is the derived bound rounded up to two significant digits. Agreement
      is software conformance, not physical validation.

