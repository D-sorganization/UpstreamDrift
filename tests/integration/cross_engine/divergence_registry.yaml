version: 1
divergences:
  - id: soft-vs-hard-contact-smoke
    check: differential_cross_engine_reference
    metric: position
    engines: [mock-soft-contact, mock-reference]
    tolerance: 0.01
    rationale: >
      Stub fixture for the CC-7 registry contract. Real entries must name the
      contact model or solver difference and the tolerance accepted by review.

  - id: contact-solver-evaluation-timing
    check: contact_law_conformance
    metric: force_n
    engines: [mujoco, pinocchio]
    tolerance: 0.0001
    rationale: >
      MuJoCo applies external contact force via qfrc_applied before passive forces,
      Drake evaluates external forces within CalcOutput before continuous state derivatives,
      and Pinocchio evaluates constraint dynamics via Delassus matrix. Substep and mid-step
      evaluation differences cause small force discrepancies under high velocity transients.

  - id: dual-grip-closure-formulation
    check: grip_closure_conformance
    metric: closure_rank
    engines: [pinocchio, mujoco]
    tolerance: 0.000001
    rationale: >
      Pinocchio and Drake enforce spatial 6-DOF weld constraints (rank 6), while MuJoCo uses
      weld equality constraints with finite solref/solimp compliance and MJX approximates via
      spring-damper elements.

  - id: hunt-crossley-dissipation-clipping
    check: contact_dissipation_conformance
    metric: normal_force_n
    engines: [shared_law, hunt_crossley]
    tolerance: 0.000001
    rationale: >
      Hunt-Crossley normal force magnitude is explicitly clipped at zero (f_n = max(0, f_n))
      to prevent tensile contact forces during high rebound velocities.

  - id: mujoco-stock-soft-weld-vs-hard-kkt
    check: closed_loop_snapshot_conformance
    metric: closure_acceleration_residual_ratio
    engines: [mujoco-stock-step, mujoco-hard-kkt]
    tolerance: 10.0
    rationale: >
      Stock mj_step / mj_forward keeps the grip weld as a compliant equality
      (solref 0.02 1, solimp 0.9 0.95 0.001) and solves it with the contact
      solver, so the loop is not rigid.  The NSX closed-loop snapshot (NSX-51,
      #12579) therefore never reads stock stepping: it assembles M (mj_fullM),
      h (qfrc_bias) and the weld site Jacobians and solves the exact KKT system
      with zero regularisation, so J a + Jdot v closes to round-off.  The metric
      is |J qacc_stock + Jdot v| / |J a_free + Jdot v| at contact-free,
      limit-free closure-consistent states.  Measured ratios (zero effort,
      unit-normal effort) per ground_support dynamics-record frame: 100:
      0.778, 0.022; 250: 2.612, 0.023; 400: 1.858, 0.028; 500: 2.906, 0.055.
      The tolerance of 10 is an order-of-magnitude sanity envelope, not a fit
      to these values and not a convergence tolerance: this entry documents
      that stock stepping differs from the rigid solve (the test asserts the
      ratio exceeds 1e-3), it does not certify agreement.  Stock stepping is
      not a 1e-10 reference.  The hard-KKT side is held to the tolerances of
      the Pinocchio cross-engine snapshot test.
