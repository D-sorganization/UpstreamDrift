# Golden target — UpstreamDrift (RM#2196)
version: 2

multi-ecosystem-groups:
  weekly-deps:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: chore(deps)

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - automated
    ignore:
      - dependency-name: casadi

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci/cd
      - automated

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
      - automated
    ignore:
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major
