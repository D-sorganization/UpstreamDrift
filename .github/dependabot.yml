# Golden target — UpstreamDrift (RM#2196)
version: 2

multi-ecosystem-groups:
  weekly-deps:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Los_Angeles
    commit-message:
      prefix: chore(deps)
    # GitHub: open-pull-requests-limit only on MEG (not on grouped updates).
    # max(10 pip, 5 github-actions, 5 npm) from fleet golden.
    open-pull-requests-limit: 10

updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    labels:
      - dependencies
      - automated
    ignore:
      - dependency-name: casadi

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    labels:
      - dependencies
      - ci/cd
      - automated

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: weekly-deps
    labels:
      - dependencies
      - frontend
      - automated
    ignore:
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - version-update:semver-major
