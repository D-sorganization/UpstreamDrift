name: Fetch pinned Tools packages
description: >-
  Populate vendor/ud-tools at the superproject's pinned gitlink revision.
  build_hooks.py refuses editable/CI installs unless the pinned Tools package
  roots (src/shared, src/sidekick, src/chat, src/python/src/utils,
  src/contracts.py) are present and match the gitlink, so every job that runs
  `pip install -e .` needs this. CI checkouts skip submodules (the other
  submodules are large model repositories), and relying on leftover submodule
  content from other workflows in a reused runner workspace breaks whenever a
  workspace is recreated from scratch.
inputs:
  emit-source-provenance:
    description: Compute the required package-root digest for isolated builds
    required: false
    default: "false"
outputs:
  gitlink-sha:
    description: Exact Tools revision declared by the superproject gitlink
    value: ${{ steps.pin.outputs.sha }}
  source-sha256:
    description: Path-and-content digest of the required Tools package roots
    value: ${{ steps.provenance.outputs.sha256 }}
runs:
  using: composite
  steps:
    - name: Resolve pinned Tools revision
      id: pin
      shell: bash
      run: |
        tools_sha=$(git ls-tree HEAD -- vendor/ud-tools | awk '{print $3}')
        test -n "$tools_sha"
        echo "sha=$tools_sha" >> "$GITHUB_OUTPUT"
    # No sparse-checkout: it would not reduce the fetch (the packfile is the
    # same either way at fetch-depth 1) but it WOULD leave a sparse worktree
    # behind in the reused runner workspace, which poisons later jobs that
    # materialize vendor/ud-tools via `submodules: recursive` (git adopts the
    # existing clone and its sparse config, yielding a partial Tools tree).
    # A full worktree also lets checkout heal previously-sparsed clones,
    # since it disables sparse-checkout on reuse when none is requested.
    - name: Checkout pinned Tools source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        repository: ${{ format('{0}/Tools', github.repository_owner) }}
        ref: ${{ steps.pin.outputs.sha }}
        path: vendor/ud-tools
        fetch-depth: 1
        persist-credentials: false
    - name: Verify pinned Tools checkout
      shell: bash
      run: |
        actual_tools_sha=$(git -C vendor/ud-tools rev-parse HEAD)
        test "$actual_tools_sha" = "${{ steps.pin.outputs.sha }}"
    - name: Digest pinned Tools sources
      id: provenance
      if: inputs.emit-source-provenance == 'true'
      shell: bash
      run: |
        tools_digest=$(python3 scripts/packaging/pinned_tools_provenance.py \
          --root vendor/ud-tools)
        echo "sha256=$tools_digest" >> "$GITHUB_OUTPUT"
