name: Jules Review Responder

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  pull_request_review:
    types: [submitted]

jobs:
  check-kill-switch:
    timeout-minutes: 30
    runs-on: d-sorg-fleet
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check Jules Kill Switch
        id: check
        run: |
          if [ "${{ vars.JULES_ENABLED }}" = "false" ]; then
            echo "Jules is DISABLED via kill switch."
            echo "enabled=false" >> $GITHUB_OUTPUT
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

  pick-runner:
    needs: check-kill-switch
    if: needs.check-kill-switch.outputs.enabled == 'true'
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet"

  review-fix:
    timeout-minutes: 30
    needs: [check-kill-switch, pick-runner]
    if: needs.check-kill-switch.outputs.enabled == 'true'
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        if: steps.auth.outputs.authorized == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        if: steps.auth.outputs.authorized == 'true'
        with: { node-version: "24" }
      - run: npm install -g @google/jules
        if: steps.auth.outputs.authorized == 'true'

      - name: Compile Feedback
        if: steps.auth.outputs.authorized == 'true'
        id: feedback
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW_ID: ${{ github.event.review.id }}
          REVIEWER_LOGIN: ${{ github.event.review.user.login }}
          REVIEW_BODY: ${{ github.event.review.body }}
          REVIEW_STATE: ${{ github.event.review.state }}
          REPO: ${{ github.repository }}
        run: |
          # SECURITY: Use environment variables instead of direct interpolation
          echo "Reviewer: $REVIEWER_LOGIN" > feedback.txt
          echo "Summary: $REVIEW_BODY" >> feedback.txt

          echo -e "\nDetailed Inline Comments:" >> feedback.txt
          gh api "repos/$REPO/pulls/$PR_NUMBER/reviews/$REVIEW_ID/comments" \
            --jq '.[] | "- File: " + .path + "\n  Line: " + (.line | tostring) + "\n  Comment: " + .body + "\n"' >> feedback.txt

          if grep -iq "lgtm\|looks good" feedback.txt && [ "$REVIEW_STATE" == "APPROVED" ]; then
             echo "run_repair=false" >> $GITHUB_OUTPUT
          else
             echo "run_repair=true" >> $GITHUB_OUTPUT
          fi

      - name: Execute Repairs
        if: steps.feedback.outputs.run_repair == 'true'
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          # SECURITY: Use environment variables and read feedback from file
          FEEDBACK_CONTENT=$(cat feedback.txt)
          jules remote new \
            --repo "$REPO" \
            --session "Address code review feedback on PR #$PR_NUMBER: $FEEDBACK_CONTENT" \
            --pr "$PR_NUMBER"
