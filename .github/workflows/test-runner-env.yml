name: Test Runner Env

on:
  push:
    branches: [ fix/toolcache-shared-race ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: d-sorg-fleet-docker
    steps:
      - name: Inspect Tool Caches
        run: |
          echo "=== Hostname ==="
          hostname
          echo "=== Find fractions.py in all caches ==="
          find /home/dieterolson/actions-runners-nvme/.shared-tool-cache/ -name "fractions.py" || true
          find /home/dieterolson/actions-runners/.shared-tool-cache/ -name "fractions.py" || true
          echo "=== Find fractions.py in current Python cache ==="
          find /home/dieterolson/actions-runners-nvme/.shared-tool-cache/Python/3.11.15/ -name "fractions.py" || true
