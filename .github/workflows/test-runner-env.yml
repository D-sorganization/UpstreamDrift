name: Test Runner Env

on:
  push:
    branches: [ fix/toolcache-shared-race ]
  workflow_dispatch:

jobs:
  inspect:
    runs-on: d-sorg-fleet-docker
    steps:
      - name: Search Python Tarballs
        run: |
          echo "=== Search Python Archives ==="
          find /home/dieterolson/ -maxdepth 4 -name "*3.11.15*" 2>/dev/null | grep -E '\.(tar\.gz|tgz|zip|tar\.xz)$' || true
          echo "=== List dieterolson home files ==="
          ls -la /home/dieterolson/ || true
          ls -la /home/dieterolson/actions-runners-nvme/ || true
          ls -la /home/dieterolson/actions-runners/ || true
