name: Agent Metrics Dashboard

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # schedule: DISABLED to reduce CI cost (see #1751)
  # Every Monday at 10am UTC (after CI failure digest)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write
  actions: read
  pull-requests: read

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Force HTTP/1.1 and increase postBuffer to fix checkout timeouts
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 1048576000
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"