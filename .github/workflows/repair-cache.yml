name: Repair Runner Cache

on:
  push:
    branches: [ fix/toolcache-shared-race ]
  workflow_dispatch:

jobs:
  repair:
    strategy:
      fail-fast: false
      matrix:
        runner: [d-sorg-local-ControlTower-nvme-1, d-sorg-local-ControlTower-nvme-2, d-sorg-local-ControlTower-nvme-3, d-sorg-local-ControlTower-nvme-4, d-sorg-local-ControlTower-nvme-5, d-sorg-local-ControlTower-nvme-6, d-sorg-local-ControlTower-nvme-7, d-sorg-local-ControlTower-nvme-8]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Clean Cache Directories
        run: |
          echo "=== Cleaning caches on $(hostname) ==="
          sudo rm -rf /home/dieterolson/actions-runners-nvme/.shared-tool-cache/Python
          sudo rm -rf /home/dieterolson/actions-runners-nvme/.shared-tool-cache/Python_stale_*
          
      - name: Setup Python 3.10
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.10"
          
      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          
      - name: Setup Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify Cache Files
        run: |
          echo "=== List Python versions ==="
          ls -la /home/dieterolson/actions-runners-nvme/.shared-tool-cache/Python/ || true
          echo "=== List files for 3.10 ==="
          ls -la /home/dieterolson/actions-runners-nvme/.shared-tool-cache/Python/3.10.*/ || true
          echo "=== List files for 3.11 ==="
          ls -la /home/dieterolson/actions-runners-nvme/.shared-tool-cache/Python/3.11.*/ || true
          echo "=== List files for 3.12 ==="
          ls -la /home/dieterolson/actions-runners-nvme/.shared-tool-cache/Python/3.12.*/ || true
