name: Jules Tech Debt Assessor (Worker)

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      create_issues:
        description: "Create GitHub issues for critical debt"
        required: false
        default: true
        type: boolean
      threshold_critical:
        description: "Threshold for critical debt items"
        required: false
        default: "10"
        type: string
  # schedule: DISABLED to reduce CI cost (see #1751)

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: jules-tech-debt-assessor-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          ONLINE=$(gh api -H "Accept: application/vnd.github+json" /orgs/${{ github.repository_owner }}/actions/runners --paginate \
            --jq 'if .runners then [.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length else 0 end' \
            2>/dev/null || echo "0")
          if ! [[ "$ONLINE" =~ ^[0-9]+$ ]]; then ONLINE=0; fi
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online - routing locally"
          else
            echo "::error::No local self-hosted runner available; failing closed"
            exit 1
          fi
