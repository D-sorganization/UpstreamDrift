name: Critical Files Guard

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "AGENTS.md"
      - "README.md"
      - "CHANGELOG.md"
      - "LICENSE"
      - "pyproject.toml"
      - "conftest.py"
      - "launch_golf_suite.py"
      - "scripts/ci/start_api_server.py"

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"
  verify-critical-files:
    timeout-minutes: 30
    needs: pick-runner
    name: Verify Critical Files Exist
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Check Critical Files
        run: |
          echo "- Verifying critical files exist at repository root..."

          CRITICAL_FILES=(
            "AGENTS.md"
            "README.md"
            "CHANGELOG.md"
            "LICENSE"
            "pyproject.toml"
            "conftest.py"
            "launch_golf_suite.py"
          )

          MISSING_FILES=()

          for file in "${CRITICAL_FILES[@]}"; do
            if [ ! -f "$file" ]; then
              echo "- MISSING: $file"
              MISSING_FILES+=("$file")
            else
              echo "- Found: $file"
            fi
          done

          # Check for start_api_server.py in scripts/ci/ (reorganized in #3070)
          if [ ! -f "scripts/ci/start_api_server.py" ]; then
            echo "- MISSING: scripts/ci/start_api_server.py"
            MISSING_FILES+=("scripts/ci/start_api_server.py")
          else
            echo "- Found: scripts/ci/start_api_server.py"
          fi

          if [ ${#MISSING_FILES[@]} -ne 0 ]; then
            echo ""
            echo "- ERROR: Critical files are missing!"
            echo "The following files MUST exist at the repository root:"
            printf '  - %s\n' "${MISSING_FILES[@]}"
            echo ""
            echo "These files are protected per AGENTS.md Section 2 (Critical Files)."
            echo "If this was accidental, please restore the file(s)."
            echo "If intentional removal is needed, discuss with repository maintainers first."
            exit 1
          fi

          echo ""
          echo "- All critical files verified!"

      - name: Check for Deletion Attempts
        run: |
          echo "- Checking for deletion attempts in this PR..."

          # Get list of deleted files in this PR
          git fetch origin ${{ github.base_ref }} --depth=1
          DELETED=$(git diff --name-status origin/${{ github.base_ref }}...HEAD | grep "^D" | awk '{print $2}')

          CRITICAL_FILES="AGENTS.md README.md CHANGELOG.md LICENSE pyproject.toml conftest.py launch_golf_suite.py start_api_server.py"

          BLOCKED=false

          for deleted in $DELETED; do
            for critical in $CRITICAL_FILES; do
              if [ "$deleted" = "$critical" ]; then
                echo "- BLOCKED: Attempt to delete protected file: $critical"
                BLOCKED=true
              fi
            done
          done

          if [ "$BLOCKED" = true ]; then
            echo ""
            echo "- This PR attempts to delete one or more critical files."
            echo "This is not allowed without explicit maintainer approval."
            exit 1
          fi

          echo "- No critical file deletions detected."
