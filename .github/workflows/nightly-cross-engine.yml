# Nightly Cross-Engine Validation
#
# Assessment C Recommendation - Automated Cross-Engine CI
# Roadmap Phase 2 (Week 2, Days 11-12)
#
# Purpose:
# Run comprehensive cross-engine validation tests nightly to detect
# drift/divergence between physics engines (MuJoCo, Drake, Pinocchio, Pendulum).
#
# Alerts team if deviation exceeds 2× tolerance (WARNING threshold from C-003).
#
# This catches integration regressions, numerical drift accumulation, and
# engine update side-effects before they reach production.

name: Nightly Cross-Engine Validation

on:
  schedule:
    # Run at 2 AM UTC daily
    - cron: "0 0 * * 0,4"

  workflow_dispatch: # Allow manual trigger
    inputs:
      engines:
        description: "Engines to validate (comma-separated)"
        required: false
        default: "mujoco,drake,pinocchio,pendulum"

concurrency:
  group: nightly-cross-engine-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  cross-engine-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Initialize artifact directories
        run: |
          mkdir -p test-results coverage
          echo '{"status": "setup_failed"}' > test-results/setup-status.json

      - name: Install dependencies
        id: install_deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,drake,pinocchio,opensim,myosuite]"
          pip install "mujoco>=3.3.0,<4.0.0"
          echo '{"status": "dependencies_installed"}' > test-results/setup-status.json

      - name: Summarize dependency failure
        if: failure() && steps.install_deps.outcome == 'failure'
        run: |
          echo "## Dependency Installation Failed" >> $GITHUB_STEP_SUMMARY
          echo "Cross-engine validation aborted due to environment setup failure." >> $GITHUB_STEP_SUMMARY
          echo '{"status": "dependency_failure"}' > test-results/setup-status.json

      - name: Verify native engine imports
        env:
          UPSTREAM_DRIFT_STRICT_ENGINE_PROBES: "true"
        run: |
          python scripts/check_native_engine_imports.py \
            --json-output test-results/native-engine-imports.json \
            --markdown-output test-results/native-engine-imports.md

      - name: Run cross-engine validation tests
        id: validation
        env:
          UPSTREAM_DRIFT_STRICT_ENGINE_PROBES: "true"
        run: |
          pytest tests/heavy_integration/test_cross_engine_integration.py \
            -v \
            --tb=short \
            --junitxml=test-results/cross-engine-junit.xml \
            --cov=shared/python/cross_engine_validator \
            --cov-report=xml:coverage/cross-engine-coverage.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cross-engine-test-results
          path: test-results/

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cross-engine-coverage
          path: coverage/

      - name: Summarize validation results
        id: summarize
        if: always()
        run: |
          python - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          from pathlib import Path

          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          xml_path = Path("test-results/cross-engine-junit.xml")

          if not xml_path.exists():
              status_path = Path("test-results/setup-status.json")
              status_msg = "- No test results found."
              if status_path.exists() and "dependency" in status_path.read_text():
                  status_msg = "- Cross-engine validation aborted early due to dependency installation failure."

              summary_path.write_text(
                  f"## Cross-Engine Validation Summary\n\n{status_msg}\n",
                  encoding="utf-8",
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("has_failures=true\n")
              raise SystemExit(0)

          tree = ET.parse(xml_path)
          root = tree.getroot()
          suite = root.find("testsuite") if root.tag == "testsuites" else root
          if suite is None:
              summary_path.write_text(
                  "## Cross-Engine Validation Summary\n\n- No test suite found in results.\n",
                  encoding="utf-8",
              )
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
                  fh.write("has_failures=true\n")
              raise SystemExit(0)

          tests = int(suite.attrib.get("tests", "0"))
          failures = int(suite.attrib.get("failures", "0"))
          errors = int(suite.attrib.get("errors", "0"))
          skipped = int(suite.attrib.get("skipped", "0"))
          has_failures = failures > 0 or errors > 0

          lines = [
              "## Cross-Engine Validation Summary",
              "",
              f"- Tests run: {tests}",
              f"- Failures: {failures}",
              f"- Errors: {errors}",
              f"- Skipped: {skipped}",
          ]

          imports_path = Path("test-results/native-engine-imports.md")
          if imports_path.exists():
              lines.extend(["", imports_path.read_text(encoding="utf-8").strip()])

          summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"has_failures={'true' if has_failures else 'false'}\n")
          PY

      - name: Send notification on ERROR
        if: steps.summarize.outputs.has_failures == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '🚨 Nightly Cross-Engine Validation FAILED',
              body: `## Critical Cross-Engine Deviation Detected

              The nightly cross-engine validation failed or reported errors.

              **Action Required:**
              1. Review test results in [workflow run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
              2. Investigate which engine import or cross-engine assertion failed
              3. Check for recent engine updates or integration changes
              4. Run local validation: \`pytest tests/heavy_integration/test_cross_engine_integration.py -v\`

              **Possible Causes:**
              - Engine library version upgrade
              - Native dependency failed to import on runner
              - Integration timestep changes
              - Model definition drift
              - Constraint handling differences

              This issue will auto-close if next nightly run passes.

              Guideline P3 Compliance: **VIOLATION**`,
              labels: ['bug', 'cross-engine', 'ci-failure', 'priority-high']
            })

  publish-dashboard:
    needs: cross-engine-validation
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download test results
        uses: actions/download-artifact@v4
        continue-on-error: true
        id: download_tests
        with:
          name: cross-engine-test-results
          path: test-results/

      - name: Generate validation dashboard
        run: |
          if [ -f "test-results/cross-engine-junit.xml" ]; then
            # TODO: Generate HTML dashboard showing:
            # - Historical deviation trends (last 30 days)
            # - Per-engine comparison matrix
            # - Worst-case deviations by metric type
            # - Pass/fail rate over time
            echo "Dashboard generation placeholder"
            # Future: Upload to GitHub Pages or artifact storage
          else
            echo "Skipping dashboard generation (no valid test results downloaded)."
          fi
