name: Codex Review Request

# Thin caller: requests one Codex review only for risky or large PRs.
# Logic lives in D-sorganization/fleet-workflows (pinned to a reviewed SHA).
on:
  pull_request:
    types: [opened, ready_for_review, labeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

# Distinct from the reusable workflow's own group, so the two never deadlock.
concurrency:
  group: codex-review-caller-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request:
    # Fork guard: fork PR code never reaches the self-hosted fleet.
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      !github.event.pull_request.draft
    uses: D-sorganization/fleet-workflows/.github/workflows/reusable-codex-review-request.yml@9ec883c13db26501d54c7eeeaa7bf1cbd1cfde8e # main 2026-10-23
    with:
      timeout-minutes: 5
    secrets:
      CODEX_REVIEW_REQUEST_TOKEN: ${{ secrets.CODEX_REVIEW_REQUEST_TOKEN }}
