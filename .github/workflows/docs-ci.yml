# docs-ci.yml  -  Lightweight CI for markdown/docs-only PRs
#
# PURPOSE: Ensures docs-only PRs receive the required "quality-gate" and
#          "Verify SPEC.md freshness" checks so branch protection is satisfied.
#          Closes issue #2806.
#
# TRIGGER: Runs only when a PR changes exclusively docs/markdown files
#          that are excluded from ci-standard.yml via paths-ignore.
#
# NOTE: If a PR includes BOTH source changes AND doc changes, ci-standard.yml
#       handles the substantive checks. This workflow exits successfully after
#       detecting source changes so its duplicate branch-protection check does
#       not block mixed PRs that correctly update SPEC.md.

name: Docs CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        shell: bash
        run: |
          ONLINE=$(gh api -H "Accept: application/vnd.github+json" /orgs/${{ github.repository_owner }}/actions/runners --paginate \
            --jq 'if .runners then [.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length else 0 end' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" =~ ^[0-9]+$ ]] && [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online - routing locally"
          else
            echo "::error::No local self-hosted runner available; failing closed"
            exit 1
          fi
  quality-gate:
    name: quality-gate
    needs: pick-runner
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Verify no source files changed
        shell: bash
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # Confirm this PR truly only touches docs/markdown
          SOURCE_CHANGED=false
          while IFS= read -r file; do
            if [[ "$file" == src/* ]] || \
               [[ "$file" == tests/* ]] || \
               [[ "$file" == scripts/* ]] || \
               [[ "$file" == rust/* ]] || \
               [[ "$file" == pyproject.toml ]] || \
               [[ "$file" == requirements*.txt ]] || \
               [[ "$file" == requirements*.lock ]] || \
               [[ "$file" == Dockerfile* ]] || \
               [[ "$file" == docker-compose* ]]; then
              SOURCE_CHANGED=true
              echo "::warning::Source file changed: $file"
            fi
          done <<< "$CHANGED"

          if [[ "$SOURCE_CHANGED" == "true" ]]; then
            echo "::notice::Source files changed; ci-standard.yml is responsible for substantive checks."
            exit 0
          fi

          echo "Docs-only PR confirmed  -  quality gate passes."
