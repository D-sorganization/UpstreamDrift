# docs-ci.yml  -  Lightweight CI for markdown/docs-only PRs
#
# PURPOSE: Validates docs-only PRs. This workflow no longer satisfies branch
#          protection on their behalf.
#
#          It used to: its gate job was named "quality-gate", the same as the
#          CI Standard aggregate, so that docs-only PRs - which ci-standard.yml
#          skipped via paths-ignore - still produced the required context
#          (issue #2806). The cost was that both workflows published check runs
#          under one required name, and branch protection accepted whichever
#          reported. On PR #8728 the CI Standard aggregate reported `failure`
#          while this workflow reported `success`, and the PR merged.
#
#          ci-standard.yml now runs on every PR and skips its heavy jobs on
#          docs-only changes, so the required `quality-gate` always comes from
#          the real aggregate. This job is `docs-quality-gate` and is NOT a
#          required context - it only runs on docs-touching PRs, so requiring
#          it would block every code-only PR indefinitely.
#
# TRIGGER: Runs when a PR changes docs/markdown files. The `paths:` filter here
#          is the exact complement of the classification in ci-standard.yml's
#          `changed-paths` job; keep the two in sync.
#
# NOTE: If a PR includes BOTH source changes AND doc changes, ci-standard.yml
#       handles the substantive checks. This workflow exits successfully after
#       detecting source changes.

name: Docs CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || 'd-sorg-fleet-docker' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || 'd-sorg-fleet-docker' }}" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"
  docs-quality-gate:
    name: docs-quality-gate
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify no source files changed
        shell: bash
        run: |
          CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$CHANGED"

          # Confirm this PR truly only touches docs/markdown
          SOURCE_CHANGED=false
          while IFS= read -r file; do
            if [[ "$file" == src/* ]] || \
               [[ "$file" == tests/* ]] || \
               [[ "$file" == scripts/* ]] || \
               [[ "$file" == rust/* ]] || \
               [[ "$file" == pyproject.toml ]] || \
               [[ "$file" == requirements*.txt ]] || \
               [[ "$file" == requirements*.lock ]] || \
               [[ "$file" == Dockerfile* ]] || \
               [[ "$file" == docker-compose* ]]; then
              SOURCE_CHANGED=true
              echo "::warning::Source file changed: $file"
            fi
          done <<< "$CHANGED"

          if [[ "$SOURCE_CHANGED" == "true" ]]; then
            echo "::notice::Source files changed; ci-standard.yml is responsible for substantive checks."
            exit 0
          fi

          echo "Docs-only PR confirmed  -  quality gate passes."

      - name: Docs governance
        run: python3 scripts/check_docs_governance.py

      - name: ADR numbering uniqueness
        run: python3 scripts/ci/check_adr_numbering.py
