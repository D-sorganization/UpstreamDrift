name: Release and Companion Publication

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    # Dispatcher placement only. This repo is public, so a hosted runner is
    # free and unmetered; pinning the dispatcher meant every run waited for a
    # self-hosted slot just to decide where to run. The runner it SELECTS is
    # unchanged, so no workload moves off the fleet.
    runs-on:
      ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' &&
      'ubuntu-latest' || 'd-sorg-fleet-docker' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"

  # Companion publication hardening (Repository_Management #1507, #9416):
  # PYTHONPATH pins module resolution to the checkout so
  # `python3 -m scripts.companion_publication` works regardless of runner cwd
  # quirks, and the builder itself no longer imports `src.*` (numpy). The
  # pip pins match ci-standard.yml's companion-workflows job.
  companion-protected-main:
    name: Publish exact-commit companion artifact
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 20
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install companion publication dependencies
        run: python3 -m pip install jsonschema==4.26.0 pyyaml==6.0.3
      - name: Build companion publication bundle
        run: >-
          python3 -m scripts.companion_publication build
          --authority protected-main --output-dir dist/companion
      - name: Verify companion publication bundle
        run: >-
          python3 -m scripts.companion_publication verify-bundle
          --bundle-dir dist/companion
      - name: Attest companion publication payloads
        id: companion-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "dist/companion/*"
      - name: Upload exact-commit companion artifact
        id: companion-upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: upstreamdrift-companion-${{ github.sha }}
          path: dist/companion/
          if-no-files-found: error
          retention-days: 30
      - name: Record ephemeral Actions acquisition
        run: >-
          python3 -m scripts.companion_publication record-actions
          --bundle-dir dist/companion
          --artifact-name upstreamdrift-companion-${{ github.sha }}
          --artifact-id ${{ steps.companion-upload.outputs.artifact-id }}
          --artifact-url '${{ steps.companion-upload.outputs.artifact-url }}'
          --artifact-digest '${{ steps.companion-upload.outputs.artifact-digest }}'
          --retention-days 30
          --attestation-id '${{ steps.companion-attestation.outputs.attestation-id }}'
          --attestation-url '${{ steps.companion-attestation.outputs.attestation-url }}'
          --output dist/companion-evidence/upstreamdrift-companion-acquisition.v1.json
      - name: Attest Actions acquisition evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "dist/companion-evidence/*"
      - name: Upload Actions acquisition evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: upstreamdrift-companion-evidence-${{ github.sha }}
          path: dist/companion-evidence/
          if-no-files-found: error
          retention-days: 30

  build:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      wheel_filename: ${{ steps.build-wheel.outputs.wheel_filename }}
      companion_attestation_id: ${{ steps.companion-attestation.outputs.attestation-id }}
      companion_attestation_url: ${{ steps.companion-attestation.outputs.attestation-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Verify version consistency
        run: python3 scripts/check_version_consistency.py
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          actual="$(
            python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${actual}"
            exit 1
          fi
      - name: Install build tools
        run: |
          python -m ensurepip --upgrade || true
          python3 -m pip install build twine pip-audit jsonschema pyyaml
      # build_hooks.py refuses to package without ui/dist once CI is set, so the
      # UI bundle must be compiled here before `python -m build` (#9449).
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json
      - name: Install UI dependencies
        working-directory: ui
        run: npm ci
      - name: Build UI bundle
        working-directory: ui
        run: npm run build
      - name: Verify UI bundle exists before packaging
        shell: bash
        run: |
          set -euo pipefail
          test -f ui/dist/index.html
          echo "UI bundle present at ui/dist"
      - name: Build package
        id: build-wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          python3 -m build --wheel
          shopt -s nullglob
          wheels=(dist/upstream_drift-*.whl)
          test "${#wheels[@]}" -eq 1
          echo "wheel_filename=$(basename "${wheels[0]}")" >> "$GITHUB_OUTPUT"
      - name: Generate SBOM
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          pip-audit \
            --requirement requirements.lock \
            --format cyclonedx-json \
            --output "dist/upstream-drift-${version}.cdx.json"
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      # Step-level (not job-level) PYTHONPATH here on purpose: this job also
      # builds the wheel and SBOM, which must not see the checkout on
      # sys.path (Repository_Management #1507, #9416).
      - name: Build companion publication bundle
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python3 -m scripts.companion_publication build
          --authority tag --output-dir dist/companion
      - name: Verify companion publication bundle
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: >-
          python3 -m scripts.companion_publication verify-bundle
          --bundle-dir dist/companion
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            dist/*.whl
            dist/*.json
            dist/SHA256SUMS.txt
      - name: Attest companion publication payloads
        id: companion-attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "dist/companion/*"
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/

  smoke-python-wheel:
    timeout-minutes: 30
    needs: [pick-runner, build]
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with `requires-python` in pyproject.toml (3.11–3.12).
        include:
          - { runner: d-sorg-fleet-docker, python: "3.11" }
          - { runner: d-sorg-fleet-docker, python: "3.12" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Purge pip cache
        run: python -m pip cache purge || true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/
      - name: Install smoke dependencies
        run: |
          python -m ensurepip --upgrade || true
          python -m pip install pytest
      - name: Run Python wheel smoke tests
        env:
          UPSTREAM_DRIFT_WHEEL: dist/${{ needs.build.outputs.wheel_filename }}
        run: python -m pytest tests/smoke/python_wheel

  publish-pypi:
    timeout-minutes: 30
    needs: [pick-runner, build, smoke-python-wheel]
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/upstream-drift
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: true
          skip-existing: true

  create-release:
    timeout-minutes: 30
    needs: [pick-runner, build, smoke-python-wheel]
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    outputs:
      release_id: ${{ steps.github-release.outputs.id }}
      release_url: ${{ steps.github-release.outputs.url }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        id: github-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          draft: true
          generate_release_notes: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/*.whl
            dist/*.json
            dist/SHA256SUMS.txt
            dist/companion/*

  record-companion-release:
    name: Verify and publish immutable release acquisition
    needs: [pick-runner, build, create-release]
    timeout-minutes: 20
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    defaults:
      run:
        working-directory: ${{ github.workspace }}
    env:
      PYTHONPATH: ${{ github.workspace }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Install companion publication dependencies
        run: python3 -m pip install jsonschema==4.26.0 pyyaml==6.0.3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/
      - name: Read exact draft release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: >-
          gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          > "${RUNNER_TEMP}/companion-release.json"
      - name: Record immutable release acquisition
        run: >-
          python3 -m scripts.companion_publication record-release
          --bundle-dir dist/companion
          --release-metadata "${RUNNER_TEMP}/companion-release.json"
          --attestation-id '${{ needs.build.outputs.companion_attestation_id }}'
          --attestation-url '${{ needs.build.outputs.companion_attestation_url }}'
          --output dist/companion-release/upstreamdrift-companion-acquisition.v1.json
      - name: Acquire and verify numeric release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 -m scripts.companion_publication verify-release-download
          --acquisition dist/companion-release/upstreamdrift-companion-acquisition.v1.json
          --output-dir "${RUNNER_TEMP}/companion-release-download"
      - name: Attest release acquisition record
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: "dist/companion-release/*"
      - name: Upload release acquisition record
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          draft: true
          overwrite_files: false
          fail_on_unmatched_files: true
          files: |
            dist/companion-release/upstreamdrift-companion-acquisition.v1.json
            dist/companion-release/upstreamdrift-companion-acquisition.v1.json.sha256
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        run: >-
          gh api --method PATCH
          "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}"
          -F draft=false
