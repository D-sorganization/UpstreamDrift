name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"

  build:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.11"
      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Verify version consistency
        run: python3 scripts/check_version_consistency.py
      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          expected="${GITHUB_REF_NAME#v}"
          actual="$(
            python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])'
          )"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match pyproject version ${actual}"
            exit 1
          fi
      - name: Install build tools
        run: |
          python -m ensurepip --upgrade || true
          python3 -m pip install build twine pip-audit
      - name: Build package
        run: python3 -m build
      - name: Generate SBOM
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          pip-audit \
            --requirement requirements.lock \
            --format cyclonedx-json \
            --output "dist/upstream-drift-${version}.cdx.json"
      - name: Generate checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373
        with:
          subject-path: "dist/*"
      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: dist
          path: dist/

  smoke-python-wheel:
    timeout-minutes: 30
    needs: [pick-runner, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: d-sorg-fleet-docker, python: "3.10" }
          - { runner: d-sorg-fleet-docker, python: "3.11" }
          - { runner: d-sorg-fleet-docker, python: "3.12" }
          - { runner: d-sorg-fleet-docker, python: "3.13" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - name: Purge pip cache
        run: python -m pip cache purge || true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/
      - name: Install smoke dependencies
        run: |
          python -m ensurepip --upgrade || true
          python -m pip install pytest
      - name: Run Python wheel smoke tests
        run: python -m pytest tests/smoke/python_wheel

  publish-pypi:
    timeout-minutes: 30
    needs: [pick-runner, build, smoke-python-wheel]
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment:
      name: pypi
      url: https://pypi.org/p/upstream-drift
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          attestations: true
          skip-existing: true

  create-release:
    timeout-minutes: 30
    needs: [pick-runner, build, smoke-python-wheel]
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: dist
          path: dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          generate_release_notes: true
          files: |
            dist/*
