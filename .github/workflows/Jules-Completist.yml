name: Jules Completist (Incomplete Implementation Auditor)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:
  workflow_dispatch:
  # Schedule removed: Control Tower (Jules-Control-Tower.yml) handles all scheduling.
  # This workflow runs via workflow_call from Control Tower at 09:00 UTC Sun+Thu.

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  check-kill-switch:
    env:
      AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
    timeout-minutes: 20
    runs-on: d-sorg-fleet-docker
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check Jules Kill Switch
        id: check
        run: |
          if [ "${{ vars.JULES_ENABLED }}" = "false" ]; then
            echo "Jules is DISABLED via kill switch."
            echo "enabled=false" >> $GITHUB_OUTPUT
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

  pick-runner:
    env:
      AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
    needs: check-kill-switch
    if: needs.check-kill-switch.outputs.enabled == 'true'
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"

  completist:
    env:
      AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
    timeout-minutes: 20
    needs: [check-kill-switch, pick-runner]
    if: needs.check-kill-switch.outputs.enabled == 'true'
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - name: Force-clean stale Python tool cache (NVMe runners)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for cache_root in /opt/runner-tool-cache /home/dieterolson/actions-runners/.shared-tool-cache /home/dieterolson/actions-runners-nvme/.shared-tool-cache; do
            if [ -d "$cache_root/Python" ]; then
              echo "Cleaning $cache_root/Python (pre-setup-python)"
              sudo mv "$cache_root/Python" "$cache_root/Python_stale_$RANDOM" || true
              sudo rm -rf "$cache_root/Python_stale_$RANDOM" || true
            fi
          done
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install Dependencies
        run: |
          python -m ensurepip --upgrade || true
          pip install -r requirements.txt
          npm install -g @google/jules

      - name: Scan for Incomplete Patterns
        id: scan
        run: |
          mkdir -p .jules/completist_data

          # Find TODO/FIXME/XXX comments
          grep -rn "TODO\|FIXME\|XXX\|HACK\|TEMP" --include="*.py" --include="*.ts" --include="*.js" . \
            --exclude-dir=".git" --exclude-dir="venv" --exclude-dir="node_modules" \
            > .jules/completist_data/todo_markers.txt 2>/dev/null || true

          # Find NotImplementedError
          grep -rn "NotImplementedError\|raise NotImplemented\|pass  #" --include="*.py" . \
            --exclude-dir=".git" --exclude-dir="venv" \
            > .jules/completist_data/not_implemented.txt 2>/dev/null || true

          # Find stub functions (empty or just pass/...)
          grep -rn "def .*:$" -A 2 --include="*.py" . \
            --exclude-dir=".git" --exclude-dir="venv" \
            | grep -B 1 "pass$\|\.\.\.$ " \
            > .jules/completist_data/stub_functions.txt 2>/dev/null || true

          # Find incomplete docstrings
          grep -rn '""".*TODO\|""".*WIP\|# TODO:' --include="*.py" . \
            --exclude-dir=".git" --exclude-dir="venv" \
            > .jules/completist_data/incomplete_docs.txt 2>/dev/null || true

          # Find abstract methods without implementations
          grep -rn "@abstractmethod" -A 5 --include="*.py" . \
            --exclude-dir=".git" --exclude-dir="venv" \
            > .jules/completist_data/abstract_methods.txt 2>/dev/null || true

          # Count findings
          TODO_COUNT=$(wc -l < .jules/completist_data/todo_markers.txt || echo "0")
          NOT_IMPL_COUNT=$(wc -l < .jules/completist_data/not_implemented.txt || echo "0")
          echo "todo_count=$TODO_COUNT" >> $GITHUB_OUTPUT
          echo "not_impl_count=$NOT_IMPL_COUNT" >> $GITHUB_OUTPUT

      - name: Collect verification-failed issue numbers (skip-list)
        # Build a list of issue numbers linked to PRs flagged
        # jules-verification-failed. The Completist must NOT recreate / reopen
        # these issues — doing so produces the close-and-reopen notification spam
        # loop the user explicitly asked us to break.
        id: skip_list
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          set -euo pipefail
          SKIP_LIST=""
          PRS=$(gh pr list --state all --label jules-verification-failed \
            --json number,title,body --limit 200 2>/dev/null || echo "[]")
          while IFS= read -r pr_json; do
            [ -z "$pr_json" ] && continue
            BODY=$(echo "$pr_json" | jq -r '.body // ""')
            TITLE=$(echo "$pr_json" | jq -r '.title // ""')
            ISSUES=$(printf '%s\n%s\n' "$TITLE" "$BODY" \
              | grep -oiE '(fixes|closes|resolves)[[:space:]]*#[0-9]+' \
              | grep -oE '[0-9]+' || true)
            for issue_num in $ISSUES; do
              SKIP_LIST="$SKIP_LIST $issue_num"
            done
          done < <(echo "$PRS" | jq -c '.[]')
          SKIP_LIST=$(echo "$SKIP_LIST" | tr ' ' '\n' | sort -u | tr '\n' ',' | sed 's/,$//')
          echo "skip_list=$SKIP_LIST" >> "$GITHUB_OUTPUT"
          echo "Completist will skip these issues: ${SKIP_LIST:-<none>}"
          mkdir -p .jules/completist_data
          echo "$SKIP_LIST" > .jules/completist_data/skip_list.txt

      - name: Jules Completist Analysis
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -e
          DATE=$(date +%Y-%m-%d)
          REPO="${{ github.repository }}"
          API_BASE="https://jules.googleapis.com/v1alpha"

          # Check if API key is configured
          if [ -z "$JULES_API_KEY" ]; then
            echo "::warning::JULES_API_KEY not configured. Skipping Jules task."
            exit 0
          fi

          echo "Looking up repository source..."
          SOURCES=$(curl -sf -H "X-Goog-Api-Key: $JULES_API_KEY" "$API_BASE/sources" || echo '{"sources":[]}')

          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)

          SOURCE_ID=$(echo "$SOURCES" | jq -r ".sources[] | select(.githubRepo.owner == \"$OWNER\" and .githubRepo.repo == \"$REPO_NAME\") | .name" | head -1)

          if [ -z "$SOURCE_ID" ] || [ "$SOURCE_ID" = "null" ]; then
            echo "::warning::Repository $REPO not found in Jules sources."
            exit 0
          fi

          echo "Found source: $SOURCE_ID"

          # Create session prompt
          PROMPT=$(cat << PROMPT_EOF
          '
          You are the COMPLETIST agent - an auditor for incomplete implementations.

          ## Your Mission
          Identify and catalog all incomplete, partial, or placeholder implementations in the codebase.

          ## Input Data
          Review these files in .jules/completist_data/:
          - todo_markers.txt - TODO/FIXME/XXX comments
          - not_implemented.txt - NotImplementedError and pass statements
          - stub_functions.txt - Empty or stub functions
          - incomplete_docs.txt - Incomplete documentation
          - abstract_methods.txt - Abstract methods needing implementation

          ## Analysis Categories

          ### 1. Critical Incomplete (Blocking Features)
          Functions that:
          - Raise NotImplementedError in core paths
          - Have pass statements in non-test code
          - Are called but don't return meaningful results

          ### 2. Feature Gaps
          - TODO comments indicating missing features
          - Partial implementations (e.g., only handles some cases)
          - Mock data instead of real calculations

          ### 3. Technical Debt
          - FIXME comments
          - HACK/TEMP markers
          - Workarounds that should be proper implementations

          ### 4. Documentation Gaps
          - Functions without docstrings
          - Incomplete parameter documentation
          - Missing return type annotations

          ## Output Files

          1. Create docs/assessments/completist/Completist_Report_$DATE.md with:
             - Executive Summary (counts by category)
             - Critical Incomplete (priority list)
             - Feature Gap Matrix (module -> missing features)
             - Technical Debt Register
             - Recommended Implementation Order

          2. Update docs/assessments/completist/COMPLETIST_LATEST.md (overwrite)

          3. For CRITICAL incomplete items blocking core functionality:
             - Create GitHub Issue with label 'incomplete-implementation,critical'

          ## Prioritization Criteria
          Rate each finding by:
          - User Impact (1-5): Does this affect users?
          - Test Coverage (1-5): Is this tested elsewhere?
          - Complexity (1-5): How hard to complete?

          DO NOT MAKE CODE CHANGES. This is an AUDIT workflow.
          Your job is to identify and document, not fix.

          ## Anti-Loop Skip List
          The following issue numbers are flagged jules-verification-failed and
          must NOT be recreated or reopened: ${{ steps.skip_list.outputs.skip_list }}.
          If you find work matching one of those issues, post a single summary
          comment on the linked PR instead of creating a new issue. This breaks
          the close-and-reopen notification spam loop.
          PROMPT_EOF
          )

          echo "Creating Jules session..."
          REQUEST_JSON=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg source "$SOURCE_ID" \
            '{
              prompt: $prompt,
              sourceContext: {
                source: $source,
                githubRepoContext: {
                  startingBranch: "main"
                }
              },
              automationMode: "AUTO_CREATE_PR"
            }')

          echo "Request: $REQUEST_JSON"

          HTTP_CODE=$(curl -s -o /tmp/session_response.json -w "%{http_code}" -X POST \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_JSON" \
            "$API_BASE/sessions")

          SESSION_RESPONSE=$(cat /tmp/session_response.json)
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Jules API returned HTTP $HTTP_CODE"
            exit 1
          fi

          SESSION_ID=$(echo "$SESSION_RESPONSE" | jq -r '.name')
          echo "Created session: $SESSION_ID"

          # Poll for completion
          MAX_WAIT=1800
          POLL_INTERVAL=30
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            SESSION_STATUS=$(curl -sf -H "X-Goog-Api-Key: $JULES_API_KEY" "$API_BASE/$SESSION_ID")
            STATE=$(echo "$SESSION_STATUS" | jq -r '.state')
            echo "Session state: $STATE (elapsed: ${ELAPSED}s)"

            case "$STATE" in
              "COMPLETED"|"SUBMITTED")
                echo "Session completed successfully!"
                break
                ;;
              "FAILED"|"CANCELLED")
                echo "::error::Session $STATE"
                exit 1
                ;;
            esac
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

      - name: Commit Report
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9
        with:
          commit_message: "docs(completist): daily incomplete implementation audit"
          file_pattern: |
            docs/assessments/completist/*.md
            .jules/completist.md
