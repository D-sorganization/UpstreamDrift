name: agent-api-conformance

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "src/sim_run/**"
      - "config/fleet_agent_api_conformance/**"
      - "scripts/run_agent_api_conformance.py"
      - ".github/workflows/agent-api-conformance.yml"
      - ".mcp.json"
      - "pyproject.toml"
      - "llms.txt"
      - "tests/unit/sim_run/test_mcp_*"
      - "tests/unit/sim_run/test_fleet_agent_api_mapping.py"
      - "tests/unit/sim_run/fixtures/**"
  push:
    branches: [main]
    paths:
      - "src/sim_run/**"
      - "config/fleet_agent_api_conformance/**"
      - "scripts/run_agent_api_conformance.py"
      - ".github/workflows/agent-api-conformance.yml"
      - ".mcp.json"
      - "pyproject.toml"
      - "llms.txt"
  merge_group:

permissions:
  contents: read

jobs:
  conformance:
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package with sim-mcp extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[sim-mcp,dev]"

      - name: Run Fleet Agent API conformance
        env:
          UPSTREAMDRIFT_GIT_SHA: ${{ github.sha }}
        run: python3 scripts/run_agent_api_conformance.py
