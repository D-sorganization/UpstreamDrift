name: Conflict Disarm

# UD #12634 excluded until Dieter decides (issue #2195).

on:
  push:
    branches: [main]
  schedule:
    - cron: "15 */4 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log actions only; do not mutate pull requests"
        required: false
        default: "true"
        type: choice
        options: ["true", "false"]
      exclude_prs:
        description: "Comma-separated PR numbers to skip"
        required: false
        default: "12634"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: conflict-disarm-${{ github.repository }}
  cancel-in-progress: false

jobs:
  # One implementation: the public fleet-workflows reusable workflow, pinned to
  # a reviewed commit (fleet-workflows#1). It checks out its own source at that
  # SHA and scopes the optional App token to this repository with contents,
  # pull-requests and issues write. Bump the pin with a reviewed PR.
  disarm:
    name: Conflict disarm sweep
    uses: D-sorganization/fleet-workflows/.github/workflows/reusable-conflict-disarm.yml@367b182c24ae3b01488fc1266130969e775023de
    with:
      dry_run: ${{ inputs.dry_run || 'true' }}
      exclude_prs: ${{ inputs.exclude_prs || '12634' }}
      runner: ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || 'd-sorg-fleet-docker' }}
    secrets:
      JULES_APP_ID: ${{ secrets.JULES_APP_ID }}
      JULES_APP_PRIVATE_KEY: ${{ secrets.JULES_APP_PRIVATE_KEY }}
