  # =============================================================================
  # RUST QUALITY GATE
  # =============================================================================
  # Runs when Rust source files, Cargo manifests, or Rust-backed Python physics
  # facades/callers/tests change.
  # Enforces: format (rustfmt), lint (clippy), tests (cargo test).
  # =============================================================================
  rust-quality-gate:
    needs: [pick-runner, changed-paths]
    if: needs.changed-paths.outputs.code == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    # The matrix already declares `ubuntu-latest` and several steps gate on
    # `matrix.os == 'ubuntu-latest'`, so the fleet pin was a straight
    # contradiction: hosted-shaped work queued behind a self-hosted slot.
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 25
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      CARGO_NET_GIT_FETCH_WITH_CLI: true
    defaults:
      run:
        # Git Bash is preinstalled on `windows-latest`, so a single `bash`
        # default keeps the existing heredoc / `source` / POSIX idioms working
        # uniformly across all three OSes.
        shell: bash
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check for Rust changes
        id: rust-changes
        run: |
          rust_gate_paths=(
            '*.rs'
            'Cargo.toml'
            '*/Cargo.toml'
            'rust-toolchain.toml'
            'src/shared/python/physics/**'
            'src/tools/ball_flight_gui/**'
            'src/tools/golf_simulation_suite/**'
            'tests/unit/test_ball_flight_physics.py'
            'tests/unit/shared_python/test_ball_flight_physics.py'
            'tests/rust_bindings/**'
          )

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD || true)
            if [ -z "$BASE_SHA" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            fi
            RUST_GATE_FILES=$(git diff --name-only "$BASE_SHA" HEAD -- "${rust_gate_paths[@]}" || true)
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RUST_GATE_FILES=$(git diff --name-only "${{ github.event.before }}" HEAD -- "${rust_gate_paths[@]}" || true)
          else
            RUST_GATE_FILES=$(git diff --name-only HEAD~1 HEAD -- "${rust_gate_paths[@]}" || echo "")
          fi

          if [ -n "$RUST_GATE_FILES" ]; then
            # Only enable the gate if a Cargo workspace actually exists
            if [ -f "Cargo.toml" ]; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "Changed Rust/Python kernel gate files:"
              echo "$RUST_GATE_FILES"
            else
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "Rust/Python kernel gate files changed but no Cargo.toml found  -  skipping quality gate."
            fi
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No Rust/Python kernel gate changes detected  -  skipping Rust quality gate."
          fi

      - name: Rust Quality Gate Skipped
        if: steps.rust-changes.outputs.has_changes != 'true'
        run: echo "No Rust/Python kernel gate changes detected; Rust quality gate is not required."

      # Enable Windows long-path support before cargo clones the `tools-core`
      # git dep. The Tools repo contains a >260-char PDF filename
      # (`.../psa_package/References/H16-1061 PSA upgrading proposal G4 rev 06
      # with Perez notes from 2019 01 17 9am call with Xebec - Internal Use
      # Only.pdf`) which fails cargo's git checkout on Windows without this.
      - name: Enable Git long paths (Windows)
        if: steps.rust-changes.outputs.has_changes == 'true' && matrix.os == 'windows-latest'
        shell: bash
        run: git config --system core.longpaths true

      # Pin Python BEFORE installing Rust so PyO3-backed crates build cleanly
      # on hosted macos-latest / windows-latest, which default to Python 3.14.
      # `pyo3 0.24` (workspace pin) supports up to Python 3.13 only, so 3.14
      # makes `pyo3-ffi` fail its build script with:
      #   "the configured Python interpreter version (3.14) is newer than
      #    PyO3's maximum supported version (3.13)"
      # 3.12 is the safe middle of pyo3 0.24's supported range (3.7-3.13).
      # Tracked: issue #5221.

      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - name: Set up Python (for PyO3 builds)
        if: steps.rust-changes.outputs.has_changes == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Configure Cargo Git dependency fetches
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          mkdir -p "$CARGO_HOME"
          git config --global --unset-all url.git@github.com:.insteadOf || true
          git config --global --unset-all url.ssh://git@github.com/.insteadOf || true
          git config --global --unset-all url.https://github.com/.insteadOf || true
          git config --global --add url.https://github.com/.insteadOf git@github.com:
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
      - name: Enable long Cargo git dependency paths on Windows
        if: steps.rust-changes.outputs.has_changes == 'true' && matrix.os == 'windows-latest'
        run: |
          git config --global core.longpaths true

      - name: Install Rust toolchain
        if: steps.rust-changes.outputs.has_changes == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy
          # WASM target is only exercised on Linux (see WASM step below); we
          # still install it everywhere so `rust-toolchain.toml` stays
          # consistent across the matrix and `rustup target add` is a no-op.
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry and build
        if: steps.rust-changes.outputs.has_changes == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format Check (rustfmt)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: cargo fmt --all -- --check

      - name: Lint (Clippy)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust Tests
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          # Features `python` and `wasm` use mutually-exclusive FFI systems.
          # `cargo test` enumerates all workspace members via the resolver, so
          # new crates joining `[workspace] members = [...]` are auto-covered.
          cargo test

      - name: Check Rust Python Features
        # The workspace pyo3 dependency enables `extension-module`, so Python
        # feature crates are built as importable extension modules whose Python
        # symbols are resolved by the interpreter loader. A `cargo test`
        # executable links those symbols directly and fails on Linux too. Use
        # `cargo check` for all Python-feature targets here, then let the
        # maturin wheel build + binding smoke tests below cover integration.
        if: steps.rust-changes.outputs.has_changes == 'true' && matrix.os == 'ubuntu-latest'
        run: cargo check --workspace --all-targets --features python

      # ----------------------------------------------------------------------
      # The remaining steps (Maturin wheel build, Python-binding/source tests,
      # WASM target build) are slow and largely platform-independent. We keep
      # them on Linux only so the cross-platform matrix stays focused on the
      # acceptance-criteria checks (fmt / clippy / test / python-feature check)
      # without burning Windows + macOS minutes on redundant work.
      # ----------------------------------------------------------------------
      - name: Build PyO3 Wheel (Maturin)
        if: steps.rust-changes.outputs.has_changes == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          python3 -m venv "$RUNNER_TEMP/rust-venv"
          source "$RUNNER_TEMP/rust-venv/bin/activate"
          python -m ensurepip --upgrade || true
          python -m pip install --upgrade pip maturin
          for crate in rust_core/upstream-physics rust_core/upstream-mocap-preproc rust_core/upstream-mocap-io rust_core/upstream-muscle rust_core/upstream-motion-matching rust_core/ai_backend rust_core/upstream-urdf rust_core/upstream-realtime rust_core/upstream-mesh rust_core/upstream-pinocchio-id; do
            (cd "$crate" && python -m maturin build --interpreter python --features python --release)
          done
          echo "Wheels built successfully"
          ls target/wheels/

      - name: Fetch pinned Tools packages
        if: steps.rust-changes.outputs.has_changes == 'true' && matrix.os == 'ubuntu-latest'
        uses: ./.github/actions/fetch-pinned-tools
      - name: Verify Python Bindings
        if: steps.rust-changes.outputs.has_changes == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          source "$RUNNER_TEMP/rust-venv/bin/activate"
          python -m ensurepip --upgrade || true
          python -m pip install --no-cache-dir --ignore-installed -r requirements-dev.lock
          python -m pip install --no-cache-dir --no-deps -e ".[dev]"
          python -m pip install --force-reinstall target/wheels/*.whl
          python scripts/ci/import_built_rust_wheels.py \
            upstream_physics \
            upstream_mocap_preproc \
            upstream_mocap_io \
            upstream_muscle \
            upstream_motion_matching \
            ai_backend \
            upstream_urdf \
            upstream_realtime \
            upstream_mesh \
            upstream_pinocchio_id
          CI_RUST_WHEELS_EXPECTED=1 python -m pytest \
            tests/unit/test_ball_flight_physics.py \
            tests/unit/shared_python/test_ball_flight_physics.py \
            tests/rust_bindings \
            -q -o addopts="" --tb=short
          python -m pytest tests/unit/motion_pipeline/sources -q -o addopts="" --tb=short
          python -c "
          import upstream_physics
          # Verify key types are importable
          cfg = upstream_physics.IntegratorConfig()
          cp = upstream_physics.ContactParameters()
          print('IntegratorConfig:', cfg)
          print('ContactParameters:', cp)
          print('SwingPlaneResult available:', hasattr(upstream_physics, 'SwingPlaneResult'))
          print('All Python bindings verified!')
          "
          # ai_backend wheel: smoke-test that the #[pymodule] is importable
          # and exposes the four pyclasses + version. See issue #5220.
          python -c "
          import ai_backend
          assert hasattr(ai_backend, 'AIConfig'), 'AIConfig missing'
          assert hasattr(ai_backend, 'AIEngine'), 'AIEngine missing'
          assert hasattr(ai_backend, 'MemoryManager'), 'MemoryManager missing'
          assert hasattr(ai_backend, 'RagPipeline'), 'RagPipeline missing'
          cfg = ai_backend.AIConfig('k', 'https://api.example/v1', 'm', ':memory:')
          assert cfg.chat_url() == 'https://api.example/v1/chat/completions', cfg.chat_url()
          assert cfg.embed_url() == 'https://api.example/v1/embeddings', cfg.embed_url()
          print('ai_backend bindings verified, version:', ai_backend.__version__)
          "

      - name: Build WASM Module (wasm-pack)
        if: steps.rust-changes.outputs.has_changes == 'true' && matrix.os == 'ubuntu-latest'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --target wasm32-unknown-unknown --features wasm -p upstream-physics
          echo "WASM target build successful"

      - name: Rust Quality Gate Summary
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          echo "## Rust Quality Gate (${{ matrix.os }})" >> $GITHUB_STEP_SUMMARY
          echo "- rustfmt: formatted" >> $GITHUB_STEP_SUMMARY
          echo "- clippy: no warnings" >> $GITHUB_STEP_SUMMARY
          echo "- cargo test: all tests pass" >> $GITHUB_STEP_SUMMARY
          if [ "${{ matrix.os }}" = "ubuntu-latest" ]; then
            echo "- cargo check --features python: all targets typecheck" >> $GITHUB_STEP_SUMMARY
            echo "- maturin: wheel built" >> $GITHUB_STEP_SUMMARY
            echo "- Python bindings and source adapters: verified" >> $GITHUB_STEP_SUMMARY
            echo "- WASM: target compiled and verified" >> $GITHUB_STEP_SUMMARY
          fi

  rust-quickstart:
    name: Rust Quickstart
    needs: changed-paths
    if: needs.changed-paths.outputs.code == 'true'
    # No `needs: pick-runner` on this job, so it routes directly rather than
    # gaining a dependency edge just to learn where to run.
    runs-on:
      ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' ||
      'd-sorg-fleet-docker' }}
    timeout-minutes: 15
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check for Rust changes
        id: rust-changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD || true)
            if [ -z "$BASE_SHA" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            fi
            RUST_FILES=$(git diff --name-only "$BASE_SHA" HEAD -- '*.rs' 'Cargo.toml' '*/Cargo.toml' 'rust-toolchain.toml' || true)
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RUST_FILES=$(git diff --name-only "${{ github.event.before }}" HEAD -- '*.rs' 'Cargo.toml' '*/Cargo.toml' 'rust-toolchain.toml' || true)
          else
            RUST_FILES=$(git diff --name-only HEAD~1 HEAD -- '*.rs' 'Cargo.toml' '*/Cargo.toml' 'rust-toolchain.toml' || echo "")
          fi

          if [ -n "$RUST_FILES" ] && [ -f "Cargo.toml" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "$RUST_FILES"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No Rust changes detected  -  skipping Rust quickstart."
          fi

      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - name: Setup Python
        if: steps.rust-changes.outputs.has_changes == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Install Rust toolchain
        if: steps.rust-changes.outputs.has_changes == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8

      - name: Cache Cargo registry
        if: steps.rust-changes.outputs.has_changes == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-quickstart-${{ runner.os }}-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            rust-quickstart-${{ runner.os }}-

      - name: Cargo build from clean clone
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: cargo build

      - name: Maturin develop from clean clone
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          python -m venv "$RUNNER_TEMP/rust-quickstart-venv"
          source "$RUNNER_TEMP/rust-quickstart-venv/bin/activate"
          python -m ensurepip --upgrade || true
          python -m pip install --upgrade pip maturin
          cd rust_core/upstream-physics
          python -m maturin develop --features python
          python -c "
          import upstream_physics
          print(upstream_physics.IntegratorConfig())
          "

  # ----------------------------------------------------------------------
  # rust-wheel-parity (issue #7601)
  #
  # The path-gated `rust-quality-gate` job builds the six PyO3 wheels into a
  # throwaway venv but the main `tests:` job never installs them, so the
  # parity / Rust-binding suites SKIP via `skipif(not is_rust_available())`
  # and `importorskip("upstream_...")`. A parity regression could therefore
  # land unnoticed.
  #
  # This REQUIRED job (wired into `quality-gate.needs`) runs for Rust wheel,
  # parity-test, and Python facade changes on PRs and pushes, and always runs on
  # schedule and manual dispatch events. It builds + installs all PyO3 wheels
  # (mirroring the exact maturin invocation in `rust-quality-gate`) and runs
  # the parity suite with
  # `CI_RUST_WHEELS_EXPECTED=1`, which the test layer (tests/conftest.py +
  # tests/rust_bindings/test_ci_rust_wheels_available.py) turns into a hard
  # failure if any wheel is missing. Non-Rust PRs get an explicit successful
  # skip summary instead of burning a parity lane on unrelated changes. It does
  # NOT touch the Python facades, which keep their pure-Python fallback for
  # clean checkouts.
  # ----------------------------------------------------------------------
  rust-wheel-parity:
    name: rust-wheel-parity
    needs: [pick-runner, changed-paths]
    if: needs.changed-paths.outputs.code == 'true'
    # In the required `quality-gate` aggregate's `needs`, so a fleet pin here
    # blocked every merge a second time. Pure `cargo`/`maturin` work with no
    # fleet-local state, so it follows the dispatcher like its siblings.
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 30
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-home
      CARGO_NET_GIT_FETCH_WITH_CLI: true
      CI_RUST_WHEELS_EXPECTED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check for Rust wheel parity changes
        id: rust-wheel-parity-changes
        run: |
          EVENT_NAME="${{ github.event_name }}"
          BASE_SHA=""

          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "schedule" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Rust wheel parity runs for $EVENT_NAME events."
            exit 0
          fi

          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD || true)
            if [ -z "$BASE_SHA" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            fi
          elif [ "$EVENT_NAME" = "push" ]; then
            BEFORE_SHA="${{ github.event.before }}"
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              BASE_SHA="$BEFORE_SHA"
              if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
                git fetch --no-tags --depth=1 origin "$BASE_SHA" || true
              fi
            else
              BASE_SHA=$(git rev-parse HEAD^ 2>/dev/null || true)
            fi

            if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "Unable to resolve push base for Rust wheel parity diff; running fail-closed."
              exit 0
            fi
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Rust wheel parity runs fail-closed for unsupported event: $EVENT_NAME"
            exit 0
          fi

          PARITY_FILES=$(git diff --name-only "$BASE_SHA" HEAD -- \
            'rust_core/**' \
            'Cargo.toml' \
            'Cargo.lock' \
            '*/Cargo.toml' \
            'rust-toolchain.toml' \
            'src/shared/python/ai/adapters/rust_adapter.py' \
            'src/shared/python/biomechanics/rust_muscle.py' \
            'src/shared/python/humanoid_character_builder/mesh/**' \
            'src/shared/python/model_generation/converters/*rust_facade.py' \
            'src/shared/python/motion_pipeline/**' \
            'src/shared/python/physics/**' \
            'src/shared/python/pose_interchange/adapters/pinocchio_reference.py' \
            'src/shared/python/realtime/**' \
            'tests/rust_bindings/**' \
            'tests/parity/**' \
            'tests/ai/test_rust_rag_pipeline.py' \
            'tests/integration/codemap/test_rust_cli_parity.py' \
            'tests/unit/biomechanics/test_rust_muscle.py' \
            'tests/unit/motion_matching/test_cmc_rust_parity.py' \
            'tests/unit/motion_matching/test_pinocchio_id_rust_parity.py' \
            'tests/unit/motion_pipeline/preprocessing/test_rust_parity.py' \
            'tests/unit/motion_pipeline/sources/test_mocap_io_rust_parity.py' \
            'tests/unit/motion_pipeline/test_rust_finite_diff_parity.py' \
            'tests/unit/realtime/test_rust_parity.py' \
            'tests/unit/urdf/test_mjcf_rust_facade.py' \
            'tests/unit/urdf/test_rust_facade_parity.py' \
            'tests/unit/test_ball_flight_physics.py' \
            'tests/unit/shared_python/test_ball_flight_physics.py' \
            'scripts/ci/import_built_rust_wheels.py' \
            'scripts/ci/check_rust_parity_wheel_gates.py' \
            || true)

          if [ -n "$PARITY_FILES" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Rust wheel parity relevant changes detected:"
            echo "$PARITY_FILES"
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No Rust wheel parity changes detected; skipping mandatory wheel parity suite for this $EVENT_NAME change."
          fi

      - name: Install System Dependencies
        if: steps.rust-wheel-parity-changes.outputs.has_changes == 'true'
        run: |
          apt_retry() {
            for attempt in {1..12}; do
              if sudo apt-get -o DPkg::Lock::Timeout=300 -o APT::Get::Lock-Timeout=300 "$@"; then
                return 0
              fi
              echo "apt-get $* failed on attempt $attempt; retrying after lock backoff"
              sleep 10
            done
            sudo apt-get -o DPkg::Lock::Timeout=300 -o APT::Get::Lock-Timeout=300 "$@"
          }
          apt_retry update
          apt_retry install -y \
            libegl1 libgl1 xvfb \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows' && steps.rust-wheel-parity-changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi

      # Pin Python 3.12 (pyo3 0.24 supports up to 3.13; 3.12 is the safe
      # middle of its range, matching rust-quality-gate). See issue #5221.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        if: steps.rust-wheel-parity-changes.outputs.has_changes == 'true'
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.lock

      - name: Purge pip cache
        if: steps.rust-wheel-parity-changes.outputs.has_changes == 'true'
        run: python -m pip cache purge || true

      - name: Install Rust toolchain
        if: steps.rust-wheel-parity-changes.outputs.has_changes == 'true'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy

      - name: Verify Rust toolchain
        if: steps.rust-wheel-parity-changes.outputs.has_changes == 'true'
        shell: bash
        run: |
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          command -v rustup
          command -v rustc
          command -v cargo
          rustup --version
          rustc --version
          cargo --version

      - name: Cache Cargo registry and build
        if: steps.rust-wheel-parity-changes.outputs.has_changes == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ${{ env.CARGO_HOME }}/registry
            ${{ env.CARGO_HOME }}/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Create stub ui/dist for editable install
        if: steps.rust-wheel-parity-changes.outputs.has_changes == 'true'
        run: mkdir -p ui/dist

      # Mirror the exact maturin build invocation used in `rust-quality-gate`
      # so the two lanes stay in lock-step.
      - name: Build PyO3 Wheels (Maturin)
        if: steps.rust-wheel-parity-changes.outputs.has_changes == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/rust-venv"
          source "$RUNNER_TEMP/rust-venv/bin/activate"
          python -m ensurepip --upgrade || true
          python -m pip install --upgrade pip maturin
          for crate in rust_core/upstream-physics rust_core/upstream-mocap-preproc rust_core/upstream-mocap-io rust_core/upstream-muscle rust_core/upstream-motion-matching rust_core/ai_backend rust_core/upstream-urdf rust_core/upstream-realtime rust_core/upstream-mesh rust_core/upstream-pinocchio-id; do
            (cd "$crate" && python -m maturin build --interpreter python --features python --release)
          done
          echo "Wheels built successfully"
          ls target/wheels/

      # Build the upstream-codemap CLI binary so the Python-vs-Rust codemap
      # parity test runs instead of self-skipping (issue #7603). The binary is
      # a [[bin]] target (no pymodule), so it ships via cargo, not maturin.
      - name: Build codemap CLI binary
        if: steps.rust-wheel-parity-changes.outputs.has_changes == 'true'
        run: |
          cargo build --release -p upstream-codemap --bin upstream-codemap
          ls -l target/release/upstream-codemap

      - name: Fetch pinned Tools packages
        if: steps.rust-wheel-parity-changes.outputs.has_changes == 'true'
        uses: ./.github/actions/fetch-pinned-tools
      - name: Install project + built wheels
        if: steps.rust-wheel-parity-changes.outputs.has_changes == 'true'
        run: |
          source "$RUNNER_TEMP/rust-venv/bin/activate"
          python -m ensurepip --upgrade || true
          python -m pip install --no-cache-dir --ignore-installed -r requirements-dev.lock
          python -m pip install --no-cache-dir --no-deps -e ".[gui-test]"
          python -m pip install --force-reinstall target/wheels/*.whl
          # tree-sitter grammars for the Python codemap side so the Python-vs-Rust
          # codemap parity test can index the same languages the Rust binary does
          # (rust + markdown), instead of degrading to Python-only (issue #7603).
          python -m pip install --no-cache-dir \
            "tree-sitter==0.25.2" \
            "tree-sitter-python==0.25.0" \
            "tree-sitter-rust==0.24.2" \
            "tree-sitter-markdown==0.5.1"
          # Fail-closed probe: every wheel must import + expose its bindings.
          python scripts/ci/import_built_rust_wheels.py \
            upstream_physics \
            upstream_mocap_preproc \
            upstream_mocap_io \
            upstream_muscle \
            upstream_motion_matching \
            ai_backend \
            upstream_urdf \
            upstream_realtime \
            upstream_mesh \
            upstream_pinocchio_id

      - name: Run parity suite (wheels mandatory)
        if: steps.rust-wheel-parity-changes.outputs.has_changes == 'true'
        # CI_RUST_WHEELS_EXPECTED=1 (job env) makes a skipped Rust-parity test
        # a hard failure (tests/conftest.py), so parity actually executes.
        env:
          PYTHONPATH: .:src:src/engines/physics_engines/mujoco/python:src/engines/physics_engines/mujoco/python/mujoco_humanoid_golf
          QT_QPA_PLATFORM: offscreen
          QT_API: pyqt6
        run: |
          source "$RUNNER_TEMP/rust-venv/bin/activate"
          xvfb-run --auto-servernum python -m pytest \
            tests/rust_bindings \
            tests/parity \
            tests/unit/motion_pipeline/preprocessing/test_rust_parity.py \
            tests/unit/motion_pipeline/sources/test_mocap_io_rust_parity.py \
            tests/unit/motion_pipeline/test_rust_finite_diff_parity.py \
            tests/unit/motion_matching/test_cmc_rust_parity.py \
            tests/unit/realtime/test_rust_parity.py \
            tests/unit/urdf/test_rust_facade_parity.py \
            tests/integration/codemap/test_rust_cli_parity.py \
            tests/unit/test_ball_flight_physics.py \
            tests/unit/shared_python/test_ball_flight_physics.py \
            -p no:xvfb \
            -n 0 \
            --timeout=120 \
            --timeout-method=thread \
            -o addopts="" \
            -m "not slow and not benchmark and not perf and not requires_gl and not requires_network and not requires_gpu and not requires_mocap_fixtures" \
            --no-cov \
            --tb=short \
            -v

      - name: Rust Wheel Parity Summary
        if: always()
        run: |
          {
            echo "## Rust Wheel Parity (issue #7601)"
            if [ "${{ steps.rust-wheel-parity-changes.outputs.has_changes }}" = "true" ]; then
              echo "- PyO3 wheels built via maturin and installed into the test venv"
              echo "- CI_RUST_WHEELS_EXPECTED=1 makes a skipped parity test a hard failure"
              echo "- parity suite executed for Rust wheel/parity relevant changes"
            else
              echo "- no Rust wheel/parity/facade changes detected"
              echo "- skipped mandatory wheel parity suite for this non-Rust change"
              echo "- scheduled runs and manual dispatches still execute parity"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
