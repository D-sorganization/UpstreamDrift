name: CI Standard
# Workflow ownership, overlap decisions, and growth guardrails live in
# .github/WORKFLOWS.md and are enforced by scripts/check_workflow_inventory.py.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:
  schedule:
    # Weekly run every Monday at 06:00 UTC  -  catches test drift and
    # coverage regression independent of code changes (issue #1789)
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  local-only-workflows:
    name: Reject hosted runner routing
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install workflow parser dependency
        shell: bash
        run: |
          python3 -m venv .ci-local-only-venv
          .ci-local-only-venv/bin/python -m pip install --disable-pip-version-check pyyaml==6.0.2
      - name: Run local-only workflow guard
        shell: bash
        run: .ci-local-only-venv/bin/python scripts/check_local_only_workflows.py

  pinned-actions:
    name: Enforce action SHA pinning
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 15
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Run GitHub Actions pinning guard
        shell: bash
        run: python3 scripts/check_github_actions_pinned.py

  workflow-inventory:
    name: Enforce workflow inventory
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 15
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Run workflow inventory guard
        shell: bash
        run: python3 scripts/check_workflow_inventory.py

  urdf-layering:
    name: Enforce URDF subsystem layering (ADR 0007)
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 15
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Run URDF layering guard
        shell: bash
        run: python3 scripts/ci/check_urdf_layering.py

  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"
  # ---------------------------------------------------------------------------
  # Quality gates are split into independent, parallel jobs (issue #7064) so a
  # single flaky step no longer masks unrelated failures. The required branch-
  # protection check is the `quality-gate` summary job at the bottom, which
  # aggregates the results of these jobs. The name `quality-gate` is preserved
  # exactly so existing branch protection and bot workflows keep resolving it.
  #
  #   code-quality        — lint/format + mypy + install-dependent gates
  #   security-scans       — Semgrep / Bandit / detect-secrets / Trivy
  #   repo-structure-gates — pure-stdlib structural / SPEC / budget checks
  # ---------------------------------------------------------------------------
  code-quality:
    name: code-quality
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 45
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.lock
      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Create Quality Virtual Environment
        run: |
          python -m venv "$RUNNER_TEMP/quality-ci-venv"
          echo "$RUNNER_TEMP/quality-ci-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/quality-ci-venv" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
      - name: Clear pip cache
        run: python -m pip cache purge || true
      - name: Install Quality Tools
        run: |
          # Shared self-hosted runners can retain broken tool packages without
          # RECORD metadata. Ignore ambient installs so pip lays down clean
          # copies instead of trying to uninstall corrupted cache entries.
          python -m ensurepip --upgrade || true
          python -m pip install --no-cache-dir --ignore-installed ruff==0.15.17 "mypy==1.20.1" bandit==1.7.7 pydocstyle==6.3.0 semgrep

      - name: Lint
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            mapfile -d '' py_files < <(
              git diff --name-only --diff-filter=ACMRT -z "origin/${{ github.base_ref }}" HEAD -- '*.py'
            )
            if [ "${#py_files[@]}" -eq 0 ]; then
              echo "No changed Python files; skipping Ruff lint check."
              exit 0
            fi
            ruff check "${py_files[@]}"
          else
            ruff check .
          fi

      # Use ruff format (consistent with pre-commit hooks) - ruff format is
      # a strict superset of black's style; running both causes conflicts.
      # On PRs, only check changed Python files so baseline formatting drift
      # does not block workflow-only or narrowly scoped changes.
      - name: Check Formatting (ruff)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            mapfile -d '' py_files < <(
              git diff --name-only --diff-filter=ACMRT -z "origin/${{ github.base_ref }}" HEAD -- '*.py'
            )
            if [ "${#py_files[@]}" -eq 0 ]; then
              echo "No changed Python files; skipping Ruff format check."
              exit 0
            fi
            ruff format --check "${py_files[@]}"
          else
            ruff format --check .
          fi

      - run: |
          python -m ensurepip --upgrade || true
          python -m pip install --ignore-installed "mypy==1.20.1" types-PyYAML types-requests
      - name: Create stub ui/dist for editable install (quality checks only)
        run: mkdir -p ui/dist
      - run: |
          python -m ensurepip --upgrade || true
          python -m pip install --no-cache-dir --ignore-installed -r requirements-dev.lock
          python -m pip install --no-cache-dir --no-deps -e ".[dev]"

      - name: Pin Type Toolchain
        run: |
          python -m ensurepip --upgrade || true
          python -m pip install --ignore-installed --no-cache-dir "mypy==1.20.1" "numpy==2.2.6"
          mypy --version
          python - << 'PY'
          from importlib import metadata

          for package_name in ("numpy", "mypy", "types-numpy"):
              try:
                  version = metadata.version(package_name)
              except metadata.PackageNotFoundError:
                  version = "not installed"
              print(f"{package_name}: {version}")
          PY

      - name: MyPy Exclusion Budget
        run: python3 scripts/check_mypy_exclusion_budget.py

      # Baseline mypy check across all of src/. On PRs, only check changed
      # source files so unrelated repository-wide type debt does not block
      # narrowly scoped quality and documentation work.
      - name: MyPy Baseline
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            mapfile -d '' src_py_files < <(
              git diff --name-only --diff-filter=ACMRT -z "origin/${{ github.base_ref }}" HEAD -- 'src/**/*.py' 'src/*.py'
            )
            if [ "${#src_py_files[@]}" -eq 0 ]; then
              echo "No changed source Python files; skipping baseline mypy check."
              exit 0
            fi
            python3 scripts/ci/run_mypy.py "${src_py_files[@]}" --config-file pyproject.toml
          else
            python3 scripts/ci/run_full_mypy_baseline.py
          fi
      # Strict mypy for the fully-annotated API layer (issue #2105).
      # --follow-imports=silent applies strict rules only to src/api/ files,
      # not to their transitive dependencies (which have pre-existing issues).
      - name: MyPy Strict (src/api)
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            mapfile -d '' api_py_files < <(
              git diff --name-only --diff-filter=ACMRT -z "origin/${{ github.base_ref }}" HEAD -- 'src/api/**/*.py' 'src/api/*.py'
            )
            if [ "${#api_py_files[@]}" -eq 0 ]; then
              echo "No changed API Python files; skipping strict API mypy check."
              exit 0
            fi
            mypy "${api_py_files[@]}" --strict --follow-imports=silent --config-file pyproject.toml
          else
            mypy src/api --strict --follow-imports=silent --config-file pyproject.toml
          fi

      - name: Alembic Drift Check
        shell: bash
        run: |
          set -euo pipefail
          rm -f "$RUNNER_TEMP/alembic-drift.db"
          export DATABASE_URL="sqlite:///$RUNNER_TEMP/alembic-drift.db"
          python3 scripts/db_migrate.py upgrade head
          python3 scripts/check_alembic_drift.py

      - name: Check for UI changes
        id: ui_changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --quiet "${{ github.event.pull_request.base.sha }}" HEAD -- ui; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # UI Security and Quality Checks (only when ui/ files change)
      - name: Setup Node for UI audit
        if: steps.ui_changes.outputs.changed == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: UI Install (audit prerequisite)
        if: steps.ui_changes.outputs.changed == 'true'
        working-directory: ui
        run: npm ci

      - name: UI Security Audit
        if: steps.ui_changes.outputs.changed == 'true'
        working-directory: ui
        run: npm audit --audit-level=high

      # SECURITY FIX: Make security audit blocking (fail on vulnerabilities)
      - name: Security Audit
        shell: bash
        run: |
          set -euo pipefail
          run_with_heartbeat() {
            label="$1"
            shift
            "$@" &
            cmd_pid=$!
            (
              while kill -0 "$cmd_pid" 2>/dev/null; do
                sleep 60
                echo "::notice::$label still running at $(date -u +%H:%M:%SZ)"
              done
            ) &
            heartbeat_pid=$!
            wait "$cmd_pid"
            rc=$?
            kill "$heartbeat_pid" 2>/dev/null || true
            wait "$heartbeat_pid" 2>/dev/null || true
            return "$rc"
          }

          audit_venv="$RUNNER_TEMP/pip-audit-venv"
          python3 -m venv "$audit_venv"
          audit_python="$audit_venv/bin/python"
          python -m ensurepip --upgrade || true
          "$audit_python" -m pip install --upgrade pip
          python -m ensurepip --upgrade || true
          "$audit_python" -m pip install "pip-audit==2.10.0"

          set +e
          run_with_heartbeat "pip-audit JSON report" "$audit_python" -m pip_audit -r requirements-dev.lock --format json --output pip-audit-report.json
          audit_status=$?
          set -e

          if [ "$audit_status" -ne 0 ] && [ ! -s pip-audit-report.json ]; then
            echo "::error::pip-audit failed before producing a JSON report"
            exit "$audit_status"
          fi

          mapfile -t pip_audit_waiver_flags < <(
            "$audit_python" scripts/ci/check_pip_audit_waivers.py \
              --waiver-file scripts/config/pip_audit_waivers.json \
              --audit-report pip-audit-report.json
          )
          run_with_heartbeat "pip-audit waiver-enforced scan" "$audit_python" -m pip_audit -r requirements-dev.lock "${pip_audit_waiver_flags[@]}"

      # Code Quality Check (Issue #781) - checks for placeholders, magic numbers, etc.
      - name: Code Quality Check
        run: |
          PYTHONPATH=. python src/tools/code_quality_check.py || echo "::warning::Code quality issues found - see output above"

      - name: MATLAB Quality Check
        continue-on-error: true
        run: |
          PYTHONPATH=. python src/tools/matlab_utilities/scripts/matlab_quality_check.py > matlab_quality_report.txt || touch matlab_quality_report.txt
          cat matlab_quality_report.txt

      - name: Upload MATLAB Report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: matlab-quality-report
          path: matlab_quality_report.txt

  # Security scanners run static analysis on the checkout only — no editable
  # install required — so they parallelise cleanly and a flaky scanner no
  # longer blocks lint/type/structural gates.
  security-scans:
    name: security-scans
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 30
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0
      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.lock
      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Create Security Virtual Environment
        run: |
          python -m venv "$RUNNER_TEMP/security-ci-venv"
          echo "$RUNNER_TEMP/security-ci-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/security-ci-venv" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
      - name: Install Security Tools
        run: |
          python -m ensurepip --upgrade || true
          python -m pip install --no-cache-dir --ignore-installed bandit==1.7.7 semgrep

      - name: Semgrep SAST Scan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            mapfile -d '' semgrep_targets < <(
              git diff --name-only --diff-filter=ACMRT -z "origin/${{ github.base_ref }}" HEAD -- \
                'src/**/*.py' \
                'scripts/**/*.py' \
                'tests/**/*.py' \
                'ui/**/*.js' \
                'ui/**/*.jsx' \
                'ui/**/*.ts' \
                'ui/**/*.tsx' \
                'src/**/*.json' \
                'src/**/*.xml' \
                'scripts/**/*.sh'
            )
            if [ "${#semgrep_targets[@]}" -eq 0 ]; then
              echo "No changed source/application files supported by Semgrep; skipping PR SAST delta scan."
              exit 0
            fi
            semgrep --config p/python --config p/security-audit --config p/owasp-top-ten --error "${semgrep_targets[@]}"
          else
            semgrep --config p/python --config p/security-audit --config p/owasp-top-ten --error
          fi

      # SECURITY: Bandit static security analysis (Issue #782)
      # Blocking on medium+ severity, medium+ confidence findings (Issue #2067)
      - name: Bandit Security Scan
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            mapfile -d '' bandit_targets < <(
              git diff --name-only --diff-filter=ACMRT -z "origin/${{ github.base_ref }}" HEAD -- \
                'src/**/*.py' \
                'scripts/**/*.py'
            )
            if [ "${#bandit_targets[@]}" -eq 0 ]; then
              echo "No changed source/application Python files supported by Bandit; skipping PR Bandit delta scan."
              exit 0
            fi
            set +e
            bandit_output="$(bandit "${bandit_targets[@]}" -ll -ii --format txt 2>&1)"
            exit_code=$?
            set -e
          else
            set +e
            bandit_output="$(bandit -r . -x ./tests,./archive,./legacy,./.git -ll -ii --format txt 2>&1)"
            exit_code=$?
            set -e
          fi
          echo "$bandit_output"
          echo "## Security Scan Results" >> "$GITHUB_STEP_SUMMARY"
          echo "$bandit_output" >> "$GITHUB_STEP_SUMMARY"
          exit $exit_code

      # Secret scanning (issue #5915): detect-secrets runs on every PR and
      # on pushes to main, catching committed credentials before they ship.
      - name: Secret Scanning (detect-secrets)
        shell: bash
        run: |
          set -euo pipefail
          python -m ensurepip --upgrade || true
          python -m pip install --ignore-installed detect-secrets==1.5.0 -q

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            mapfile -d '' changed_files < <(
              git diff --name-only --diff-filter=ACMRT -z "origin/${{ github.base_ref }}" HEAD
            )
            if [ "${#changed_files[@]}" -eq 0 ]; then
              echo "No changed files; skipping detect-secrets PR scan."
              exit 0
            fi
            detect-secrets scan --only-allowlisted --baseline /dev/null "${changed_files[@]}" \
              > /tmp/secrets-baseline.json || true
          else
            detect-secrets scan --only-allowlisted --baseline /dev/null \
              > /tmp/secrets-baseline.json || true
          fi

          # Fail if high-confidence secrets found
          secret_count=$(python -c "
          import json, sys
          data = json.load(open('/tmp/secrets-baseline.json'))
          total = sum(len(v) for v in data.get('results', {}).values())
          print(total)
          " 2>/dev/null || echo "0")

          echo "detect-secrets: $secret_count potential secret(s) found"
          echo "## Secret Scan Results" >> "$GITHUB_STEP_SUMMARY"
          echo "- Potential secrets detected: $secret_count" >> "$GITHUB_STEP_SUMMARY"

          if [ "$secret_count" -gt 0 ]; then
            cat /tmp/secrets-baseline.json
            echo "::error::detect-secrets found $secret_count potential secret(s). Review and remediate before merging."
            exit 1
          fi

      - name: Select Trivy PR scan target
        id: trivy-pr-target
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          mapfile -d '' trivy_targets < <(
            git diff --name-only --diff-filter=ACMRT -z "origin/${{ github.base_ref }}" HEAD -- \
              'Dockerfile' \
              'Dockerfile.*' \
              '**/Dockerfile' \
              '**/Dockerfile.*' \
              '**/Cargo.lock' \
              '**/package-lock.json' \
              '**/pnpm-lock.yaml' \
              '**/yarn.lock' \
              '**/environment.yml' \
              '**/requirements*.txt'
          )
          if [ "${#trivy_targets[@]}" -eq 0 ]; then
            echo "has_target=false" >> "$GITHUB_OUTPUT"
            echo "No changed dependency/container/config files supported by Trivy; skipping PR Trivy delta scan."
            exit 0
          fi
          echo "has_target=true" >> "$GITHUB_OUTPUT"
          echo "scan_ref=${trivy_targets[0]}" >> "$GITHUB_OUTPUT"

      - name: Trivy Filesystem Security Scan
        if: github.event_name != 'pull_request'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Trivy Filesystem Security Scan (PR Delta)
        if: github.event_name == 'pull_request' && steps.trivy-pr-target.outputs.has_target == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: ${{ steps.trivy-pr-target.outputs.scan_ref }}
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: "1"

  # Structural / SPEC / size-budget gates. These run on pure-stdlib Python so
  # they need only a checkout and the interpreter — no editable install — which
  # keeps this job fast and fully independent of the heavier code-quality job.
  repo-structure-gates:
    name: repo-structure-gates
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

        with:
          fetch-depth: 0
      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Dependency Direction Fitness Check
        run: python3 scripts/check_dependency_direction.py

      - name: Engine Tier Metadata Check
        run: python3 scripts/check_engine_tiers.py

      - name: Changed-File Size Budget Check
        run: python3 scripts/ci/check_file_size_budget.py

      - name: Changed-File Architecture Budget Check
        run: python3 scripts/ci/check_architecture_budget.py

      - name: DRY Duplication Ratchet (issue #7315)
        run: python3 scripts/ci/check_dry_duplication_gate.py

      - name: Error-Handling Ratchet (issue #5911)
        run: python3 scripts/ci/check_error_handling_ratchet.py

      - name: Suppression Discipline Ratchet (issue #5916)
        run: python3 scripts/ci/check_suppression_ratchet.py

      - name: Repo Root Clutter Check
        run: python3 scripts/check_root_clutter.py

      - name: SPEC Drift Check
        run: python3 scripts/check_spec_paths.py

      - name: Agent Docs Consistency Check
        run: python3 scripts/check_agent_docs_consistency.py

      - name: Security Workflow Silent-Failure Guard
        run: python3 scripts/check_workflows_no_silent_failures.py

      - name: Workflow Run Trust Boundary Guard
        run: python3 scripts/check_workflow_run_trust_boundary.py

      - name: Workflow Pytest Path Guard
        run: python3 scripts/ci/check_workflow_pytest_paths.py

      - name: Suite Marker Ratchet
        run: python3 scripts/ci/check_suite_marker_ratchet.py

      - name: Rust Parity / Wheel Import Gate Ratchet
        run: python3 scripts/ci/check_rust_parity_wheel_gates.py

      - name: Docker Build Contract Guard
        run: python3 scripts/ci/check_dockerfile_contracts.py

      - name: Tauri IPC Capabilities Guard
        run: python3 scripts/ci/check_tauri_capabilities.py

      - name: Version Consistency Check
        run: python3 scripts/check_version_consistency.py

      - name: VERSION / pyproject / SPEC.md Consistency Check
        run: python3 scripts/ci/check_version_consistency.py

      - name: Python Version Coherence Check
        run: python3 scripts/ci/check_python_version_coherence.py

      - name: Test Layout Guard
        run: python3 scripts/check_test_layout.py

      - name: In-Tree Pytest Collection Guard
        run: python3 scripts/check_pytest_intree_testpaths.py

      - name: Tutorial Import Check
        run: python3 scripts/ci/check_tutorial_imports.py

      - name: SPEC.md Path Check
        run: python3 scripts/check_spec_paths.py

      - name: Module Size Budget Check
        run: python3 scripts/check_module_size_budget.py --max-lines 1500 --include src

      - name: Heavy Test Dependency Parity Check
        run: python3 scripts/check_heavy_dep_parity.py

      - name: Prevent Net-New print() Calls
        run: python3 scripts/check_no_print_calls.py

      # Placeholder detection is blocking. Issue-linked TODO markers are allowed
      # because they already have a tracked owner and follow-up path.
      - name: Verify No Placeholders
        shell: bash
        run: |
          violations=$(
            find . \( -path "./.git" -o -path "./.mypy_cache" -o -path "./.ruff_cache" -o -path "./__pycache__" -o -path "./archive" -o -path "./check_code_quality" -o -path "./scripts" -o -path "./tests/tools" -o -path "./vendor" \) -prune -o -type f -name "*.py" -print0 \
              | xargs -0 grep -nE "TODO|FIXME" \
              | grep -vE "TODO(\(#?[0-9]+|:.*#[0-9]+)" || true
          )
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::Placeholders found. Remove TODOs/FIXMEs or create tracked GitHub issues."
            exit 1
          fi

  # Green-suite unit gate (issue #7042). Runs the full collection of
  # dependency-light `unit` tests and FAILS the build on ANY non-skip failure.
  # Before this gate, ~36 red unit tests slipped onto `main` because no job
  # enforced a collection-wide pass. There is intentionally NO `|| true` /
  # `continue-on-error` here: pytest's exit code is the gate. Dependency-gated
  # markers (optional native engines, GL, slow, live) are excluded so the gate
  # stays green on the standard runner without the heavy extras installed; those
  # stacks are covered by their own provisioned lanes.
  unit-test-gate:
    name: unit-test-gate
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 25
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install System Dependencies
        run: |
          apt_retry() {
            for attempt in {1..12}; do
              if sudo apt-get -o DPkg::Lock::Timeout=300 -o APT::Get::Lock-Timeout=300 "$@"; then
                return 0
              fi
              echo "apt-get $* failed on attempt $attempt; retrying after lock backoff"
              sleep 10
            done
            sudo apt-get -o DPkg::Lock::Timeout=300 -o APT::Get::Lock-Timeout=300 "$@"
          }
          apt_retry update
          apt_retry install -y \
            libegl1 libgl1 xvfb \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1
      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.lock
      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Create stub ui/dist for editable install
        run: mkdir -p ui/dist
      - name: Install Unit Test Dependencies
        # Mirror the `tests` lane install: force-reinstall hypothesis +
        # sortedcontainers (the shared toolcache can carry half-installed
        # versions), then pin numpy/scipy to a consistent ABI.
        run: |
          python -m venv "$RUNNER_TEMP/unit-gate-venv"
          echo "$RUNNER_TEMP/unit-gate-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/unit-gate-venv" >> "$GITHUB_ENV"
          python -m ensurepip --upgrade || true
          "$RUNNER_TEMP/unit-gate-venv/bin/python" -m pip install --upgrade pip
          python="$RUNNER_TEMP/unit-gate-venv/bin/python"
          python -m ensurepip --upgrade || true
          "$python" -m pip install --force-reinstall --no-deps "sortedcontainers>=2.4.0" "hypothesis>=6.0.0"
          "$python" -m pip install --no-cache-dir --ignore-installed -r requirements-dev.lock
          "$python" -m pip install --no-cache-dir --no-deps -e ".[gui-test]"
          # Prevent environment pollution conflict between pytest-recording and pytest-vcr
          "$python" -m pip uninstall -y pytest-vcr pytest-recording || true
          python -m ensurepip --upgrade || true
          "$python" -m pip install --force-reinstall --no-cache-dir "numpy==2.2.6" "scipy==1.15.3"
          "$python" -c "import numpy, scipy; from scipy import signal; print(f'numpy={numpy.__version__} scipy={scipy.__version__} signal=ok')"
      - name: Run Green-Suite Unit Gate
        # No `|| true` / `continue-on-error`: any non-skip unit failure must
        # red this job and, via the `quality-gate` aggregate below, block merge.
        env:
          PYTHONPATH: .:src:src/engines/physics_engines/mujoco/python:src/engines/physics_engines/mujoco/python/mujoco_humanoid_golf
          QT_QPA_PLATFORM: offscreen
          QT_API: pyqt6
        run: |
          set +e
          xvfb-run --auto-servernum python -m pytest \
            -p no:xvfb \
            -m "unit and not slow and not live_simulation and not requires_gl and not requires_drake and not requires_opensim and not requires_mujoco and not requires_pinocchio and not requires_myosuite and not requires_jaxsim and not requires_nimble and not requires_network and not requires_gpu and not requires_mocap_fixtures" \
            -n 4 \
            --timeout=60 \
            --timeout-method=thread \
            -p no:cacheprovider \
            --no-cov \
            --tb=short
          pytest_exit_code=$?
          set -e
          if [ "$pytest_exit_code" -eq 0 ]; then
            exit 0
          elif [ "$pytest_exit_code" -eq 5 ]; then
            echo "No runnable green-suite unit tests were available after optional dependency skips."
            exit 0
          fi
          exit "$pytest_exit_code"

  # Required branch-protection check (issue #7064). The name `quality-gate` is
  # preserved exactly so existing branch protection rules and the bot workflows
  # (Jules-Auto-Repair, Jules-PR-AutoFix, Bot-CI-Trigger) keep resolving it.
  # This job carries no gate logic of its own; it simply fails if any of the
  # split quality jobs failed, giving a single aggregate status while letting
  # each underlying job report independently.
  quality-gate:
    name: quality-gate
    needs:
      [
        code-quality,
        security-scans,
        repo-structure-gates,
        tests,
        unit-test-gate,
      ]
    if: always()
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 5
    steps:
      - name: Aggregate quality gate results
        shell: bash
        run: |
          echo "code-quality:        ${{ needs.code-quality.result }}"
          echo "security-scans:      ${{ needs.security-scans.result }}"
          echo "repo-structure-gates:${{ needs.repo-structure-gates.result }}"
          echo "tests:              ${{ needs.tests.result }}"
          echo "unit-test-gate:      ${{ needs.unit-test-gate.result }}"
          {
            echo "## Quality Gate Summary"
            echo "| Job | Result |"
            echo "| --- | ------ |"
            echo "| code-quality | ${{ needs.code-quality.result }} |"
            echo "| security-scans | ${{ needs.security-scans.result }} |"
            echo "| repo-structure-gates | ${{ needs.repo-structure-gates.result }} |"
            echo "| tests | ${{ needs.tests.result }} |"
            echo "| unit-test-gate | ${{ needs.unit-test-gate.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.code-quality.result }}" != "success" ] \
            || [ "${{ needs.security-scans.result }}" != "success" ] \
            || [ "${{ needs.repo-structure-gates.result }}" != "success" ] \
            || [ "${{ needs.tests.result }}" != "success" ] \
            || [ "${{ needs.unit-test-gate.result }}" != "success" ]; then
            echo "::error::One or more quality-gate jobs failed."
            exit 1
          fi
          echo "All quality-gate jobs succeeded."

  core-only-install:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 15
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.lock
      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Create isolated core install
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv .venv-core-only
          . .venv-core-only/bin/activate
          python -m ensurepip --upgrade || true
          python3 -m pip install --upgrade pip
          mkdir -p ui/dist
          python -m ensurepip --upgrade || true
          python3 -m pip install --no-cache-dir --ignore-installed -r requirements.lock
          python3 -m pip install --no-cache-dir --no-deps -e .
      - name: Verify optional engines are absent from core install
        shell: bash
        run: |
          set -euo pipefail
          . .venv-core-only/bin/activate
          python3 scripts/check_core_install_isolation.py
      - name: Run core-only test slice
        shell: bash
        run: |
          set -euo pipefail
          . .venv-core-only/bin/activate
          python -m ensurepip --upgrade || true
          python3 -m pip install pytest pytest-timeout
          python3 -m pytest \
            tests/architecture/test_core_public_api.py \
            tests/unit/test_core_install_isolation.py \
            -m core_only \
            --timeout=60

  dependency-consistency:
    name: dependency-consistency
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 15
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.lock
      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Create Dependency Virtual Environment
        run: |
          python -m venv "$RUNNER_TEMP/dep-ci-venv"
          echo "$RUNNER_TEMP/dep-ci-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/dep-ci-venv" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
      - name: Regenerate dependency artifacts
        shell: bash
        run: |
          set -euo pipefail
          make sync-deps
          git diff --exit-code -- pyproject.toml requirements.lock requirements-dev.lock environment.yml
      - name: Audit runtime install without extras
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/runtime-audit-venv"
          source "$RUNNER_TEMP/runtime-audit-venv/bin/activate"
          python -m ensurepip --upgrade || true
          python -m pip install --upgrade pip
          python -m ensurepip --upgrade || true
          python -m pip install "pip-audit==2.10.0"
          python -m pip_audit -r requirements.lock

  tests:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 35 # Prevent runaway tests while allowing bounded core-suite completion
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Check for core test relevant changes
        id: core-test-changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          mapfile -d '' core_test_targets < <(
            git diff --name-only --diff-filter=ACMRT -z "origin/${{ github.base_ref }}" HEAD -- \
              'src/**/*.py' \
              'tests/**/*.py' \
              'pyproject.toml' \
              'requirements*.txt' \
              'environment.yml' \
              ':(exclude)src/engines/Simscape_Multibody_Models/3D_Golf_Model/matlab/**'
          )
          if [ "${#core_test_targets[@]}" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No core Python/test/dependency changes detected; skipping test matrix for this PR."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install System Dependencies
        if: steps.core-test-changes.outputs.skip != 'true'
        run: |
          apt_retry() {
            for attempt in {1..12}; do
              if sudo apt-get -o DPkg::Lock::Timeout=300 -o APT::Get::Lock-Timeout=300 "$@"; then
                return 0
              fi
              echo "apt-get $* failed on attempt $attempt; retrying after lock backoff"
              sleep 10
            done
            sudo apt-get -o DPkg::Lock::Timeout=300 -o APT::Get::Lock-Timeout=300 "$@"
          }
          apt_retry update
          apt_retry install -y \
            libegl1 libgl1 xvfb \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1
      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        if: steps.core-test-changes.outputs.skip != 'true'
        with:
          python-version: ${{ matrix.python }}
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.lock

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Create stub ui/dist for editable install
        if: steps.core-test-changes.outputs.skip != 'true'
        run: mkdir -p ui/dist
      - name: Install Core Test Dependencies
        if: steps.core-test-changes.outputs.skip != 'true'
        # Force-reinstall hypothesis + sortedcontainers: the shared self-
        # hosted toolcache occasionally carries half-installed versions
        # where the pip metadata says 2.4.0 but the package namespace is
        # missing exports (e.g. `SortedSet`). A plain `pip install -e` sees
        # "Requirement already satisfied" and doesn't repair the cache,
        # which causes hypothesis to fail its terminal-summary import.
        run: |
          python -m venv "$RUNNER_TEMP/core-ci-venv"
          echo "$RUNNER_TEMP/core-ci-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/core-ci-venv" >> "$GITHUB_ENV"
          python -m ensurepip --upgrade || true
          "$RUNNER_TEMP/core-ci-venv/bin/python" -m pip install --upgrade pip
          python="$RUNNER_TEMP/core-ci-venv/bin/python"
          python -m ensurepip --upgrade || true
          "$python" -m pip install --force-reinstall --no-deps "sortedcontainers>=2.4.0" "hypothesis>=6.0.0"
          "$python" -m pip install --no-cache-dir --ignore-installed -r requirements-dev.lock
          "$python" -m pip install --no-cache-dir --no-deps -e ".[gui-test]"
          # Prevent environment pollution conflict between pytest-recording and pytest-vcr
          "$python" -m pip uninstall -y pytest-vcr pytest-recording || true
          python -m ensurepip --upgrade || true
          "$python" -m pip install --force-reinstall --no-cache-dir "numpy==2.2.6" "scipy==1.15.3"
          "$python" -c "import numpy, scipy; from scipy import signal; print(f'numpy={numpy.__version__} scipy={scipy.__version__} signal=ok')"

      - name: Document Native Engine Coverage In Core Lane
        if: steps.core-test-changes.outputs.skip != 'true'
        run: |
          echo "## Core CI Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- This lane installs core project dependencies plus \`[dev,gui-test]\`." >> "$GITHUB_STEP_SUMMARY"
          echo "- MuJoCo coverage may run because MuJoCo is part of the base project dependencies." >> "$GITHUB_STEP_SUMMARY"
          echo "- Drake, Pinocchio, OpenSim, and MyoSuite are optional extras and are not provisioned in this lane." >> "$GITHUB_STEP_SUMMARY"
          echo "- Passing this job does not claim full native-engine integration coverage for those optional stacks." >> "$GITHUB_STEP_SUMMARY"

      - name: Start Xvfb
        if: steps.core-test-changes.outputs.skip != 'true'
        run: |
          for display_num in $(seq 90 129); do
            lockdir="/tmp/upstreamdrift-xvfb-${display_num}.lock"
            if ! mkdir "$lockdir" 2>/dev/null; then
              continue
            fi

            if [ -e "/tmp/.X${display_num}-lock" ] && \
               ! pgrep -f "Xvfb :${display_num}( |$)" >/dev/null; then
              rm -f "/tmp/.X${display_num}-lock"
            fi

            Xvfb ":${display_num}" -screen 0 1280x720x24 -ac +extension GLX +render -noreset >"/tmp/upstreamdrift-xvfb-${display_num}.log" 2>&1 &
            xvfb_pid=$!
            sleep 2

            if kill -0 "$xvfb_pid" 2>/dev/null; then
              echo "DISPLAY=:${display_num}" >> "$GITHUB_ENV"
              echo "UPSTREAMDRIFT_XVFB_PID=${xvfb_pid}" >> "$GITHUB_ENV"
              echo "UPSTREAMDRIFT_XVFB_LOCKDIR=${lockdir}" >> "$GITHUB_ENV"
              echo "Started Xvfb on display :${display_num}"
              exit 0
            fi

            cat "/tmp/upstreamdrift-xvfb-${display_num}.log" || true
            rmdir "$lockdir" || true
          done

          echo "::error::Unable to start Xvfb on displays 90-129"
          exit 1

      - name: Clean Stale Coverage Data
        if: steps.core-test-changes.outputs.skip != 'true'
        # Self-hosted runners reuse workspaces across jobs. A crashed
        # worker from a prior run can leave behind a partially-written
        # .coverage.<host>.<pid>.<rand> sqlite file with no 'file' table,
        # which then causes pytest-cov to abort the next run with
        # "sqlite3.OperationalError: no such table: file". Remove any
        # stale coverage artefacts before collecting fresh data.
        run: |
          rm -f .coverage .coverage.* coverage.xml || true

      - name: Run Core Test Suite
        id: core-tests
        if: steps.core-test-changes.outputs.skip != 'true'
        env:
          PYTHONPATH: .:src:src/engines/physics_engines/mujoco/python:src/engines/physics_engines/mujoco/python/mujoco_humanoid_golf
          QT_QPA_PLATFORM: offscreen
          QT_API: pyqt6
        run: |
          export COVERAGE_FILE="$RUNNER_TEMP/.coverage"
          coverage_args=(--cov=src)
          coverage_report_args=(
            --cov-report=term-missing
            --cov-report=xml:coverage.xml
            --cov-config=pyproject.toml
            --cov-fail-under=75
          )
          dependency_light_targets=()

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Fetch base branch with enough depth for merge-base resolution.
            # When the base branch has advanced, shallow fetches may not have
            # the merge-base, so we fetch with depth=10 to ensure common history.
            git fetch --no-tags --depth=10 origin "${{ github.base_ref }}"
            
            # Try to compute merge-base for accurate diff. If merge-base fails
            # (e.g., due to shallow history), fall back to direct base ref diff.
            merge_base=$(git merge-base "origin/${{ github.base_ref }}" HEAD 2>/dev/null || echo "")
            
            if [ -n "$merge_base" ]; then
              # Use merge-base for accurate three-way diff
              mapfile -t changed_tests < <(
                git diff --name-only --diff-filter=ACMRT "$merge_base" HEAD -- 'tests/**/*.py'
              )
            else
              # Merge-base not available (shallow history), fall back to
              # direct diff against base ref. This may include extra changes
              # but ensures tests run rather than silently skipping.
              echo "NOTE: merge-base unavailable; using direct diff against origin/${{ github.base_ref }}"
              mapfile -t changed_tests < <(
                git diff --name-only --diff-filter=ACMRT "origin/${{ github.base_ref }}" HEAD -- 'tests/**/*.py'
              )
            fi
            diff_base="${merge_base:-origin/${{ github.base_ref }}}"

            mapfile -t deleted_tests < <(
              git diff --name-only --diff-filter=D "$diff_base" HEAD -- 'tests/**/*.py'
            )
            if [ "${#deleted_tests[@]}" -gt 0 ]; then
              echo "::error::Deleted Python test files require review before CI can proceed."
              printf '  %s\n' "${deleted_tests[@]}"
              exit 1
            fi

            mapfile -t changed_core_targets < <(
              git diff --name-only --diff-filter=ACMRT "$diff_base" HEAD -- \
                'src/**/*.py' \
                'tests/**/*.py' \
                'pyproject.toml' \
                'requirements*.txt' \
                'environment.yml' \
                ':(exclude)src/engines/Simscape_Multibody_Models/3D_Golf_Model/matlab/**'
            )

            mapfile -t changed_coverage_targets < <(
              git diff --name-only --diff-filter=ACMRT "$diff_base" HEAD -- \
                'src/**/*.py' \
                'pyproject.toml' \
                'requirements*.txt' \
                'environment.yml' \
                ':(exclude)src/engines/Simscape_Multibody_Models/3D_Golf_Model/matlab/**'
            )

            if [ "${#changed_coverage_targets[@]}" -gt 0 ]; then
              coverage_args=()
              for target in "${changed_coverage_targets[@]}"; do
                if [[ "$target" == src/*.py ]]; then
                  coverage_module="${target%.py}"
                  coverage_args+=(--cov="${coverage_module//\//.}")
                fi
              done
              if [ "${#coverage_args[@]}" -eq 0 ]; then
                coverage_args=(--cov=src)
              fi
            fi

            if [ "${#changed_tests[@]}" -eq 0 ] && [ "${#changed_core_targets[@]}" -eq 0 ]; then
              echo "No core Python/test/dependency changes detected; skipping core tests for this workflow-only PR."
              exit 0
            elif [ "${#changed_coverage_targets[@]}" -gt 0 ]; then
              echo "Source/dependency targets changed; running scoped dependency-light unit targets for this PR."
              printf '%s\n' "${changed_coverage_targets[@]}" > "$RUNNER_TEMP/changed_coverage_targets.txt"
              dependency_light_targets=(
                tests/unit/shared_python
                tests/unit/sidekick
                tests/unit/robotics
                tests/unit/scripts/test_check_mypy_exclusion_budget.py
              )
              coverage_args=(--no-cov)
              coverage_report_args=()
            elif [ "${#changed_tests[@]}" -eq 0 ]; then
              echo "No Python test changes detected for changed core targets."
              echo "Falling through to targeted coverage lane to ensure source/dependency coverage."
            else
              if [ "${#changed_coverage_targets[@]}" -eq 0 ]; then
                echo "Running PR-scoped core tests:"
                coverage_mode=(--no-cov)
              else
                echo "Running PR-scoped core tests with targeted coverage:"
                coverage_mode=(
                  "${coverage_args[@]}"
                  --cov-report=term-missing
                  --cov-report=xml:coverage.xml
                  --cov-config=pyproject.toml
                  --cov-fail-under=75
                )
                echo "coverage_generated=true" >> "$GITHUB_OUTPUT"
              fi
              printf '  %s\n' "${changed_tests[@]}"
              set +e
              xvfb-run --auto-servernum python -m pytest "${changed_tests[@]}" \
                -p no:xvfb \
                -n 0 \
                --timeout=60 \
                --timeout-method=thread \
                -m "not slow and not benchmark and not perf and not requires_gl and not requires_network and not requires_gpu and not requires_mocap_fixtures" \
                -o addopts="" \
                "${coverage_mode[@]}" \
                --tb=short \
                -v
              pytest_exit_code=$?
              set -e

              # Handle pytest exit codes properly:
              # - 0: All tests passed
              # - 5: No tests collected (NOT the same as all skipped)
              # - Other: Tests failed or error
              if [ $pytest_exit_code -eq 0 ]; then
                echo "All PR-scoped tests passed."
              elif [ $pytest_exit_code -eq 5 ]; then
                # Exit code 5 means no tests were collected, not that tests were skipped
                # This can happen if changed files don't contain any test functions
                # Fall back to running the full test suite to ensure coverage
                echo "WARNING: pytest exit code 5 (no tests collected) detected."
                echo "This may indicate the changed files do not contain test functions."
                echo "Falling back to full test suite to ensure proper validation."
              elif [ $pytest_exit_code -eq 1 ]; then
                # Tests failed - propagate the failure
                echo "PR-scoped tests failed with exit code $pytest_exit_code"
                exit $pytest_exit_code
              else
                # Other error codes
                echo "PR-scoped tests encountered unexpected exit code $pytest_exit_code"
                exit $pytest_exit_code
              fi

              echo "Full dependency-light lane will run after PR-scoped tests."
            fi
          fi

          # Run the targeted, dependency-light CI lane:
          # - Serial execution (-n 0) avoids native GUI/MuJoCo xdist worker
          #   termination on self-hosted runners, where worker crashes prevent
          #   pytest-cov from collecting coverage data and fail the matrix before
          #   reporting any test assertion. The PR-scoped path above is also
          #   serial for the same stability reason.
          # - 60 second timeout per test
          # - Skip slow tests in CI for faster feedback
          # - Coverage measurement on src/ (pytest-cov)
          # Optional native-engine extras such as Drake/Pinocchio/OpenSim/MyoSuite
          # are intentionally not provisioned here.
          run_with_heartbeat() {
            label="$1"
            shift
            "$@" &
            cmd_pid=$!
            (
              while kill -0 "$cmd_pid" 2>/dev/null; do
                sleep 60
                echo "::notice::$label still running at $(date -u +%H:%M:%SZ)"
              done
            ) &
            heartbeat_pid=$!
            wait "$cmd_pid"
            rc=$?
            kill "$heartbeat_pid" 2>/dev/null || true
            wait "$heartbeat_pid" 2>/dev/null || true
            return "$rc"
          }

          pytest_parallel_args=(-n 0)
          echo "Core lane: using serial pytest to avoid xdist worker termination."

          if [ "${coverage_args[0]:-}" = "--no-cov" ]; then
            echo "coverage_generated=false" >> "$GITHUB_OUTPUT"
            echo "PR-scoped dependency-light lane is running without coverage to avoid self-hosted runner OOM."
          else
            echo "coverage_generated=true" >> "$GITHUB_OUTPUT"
            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${#changed_coverage_targets[@]}" -gt 0 ]; then
              printf '%s\n' "${changed_coverage_targets[@]}" > "$RUNNER_TEMP/changed_coverage_targets.txt"
              echo "pr_targeted_coverage_generated=true" >> "$GITHUB_OUTPUT"
            else
              echo "full_coverage_generated=true" >> "$GITHUB_OUTPUT"
            fi
          fi
          run_with_heartbeat "core pytest lane" xvfb-run --auto-servernum python -m pytest \
            "${dependency_light_targets[@]}" \
            -p no:xvfb \
            "${pytest_parallel_args[@]}" \
            --timeout=60 \
            --timeout-method=thread \
            --ignore=tests/shared_contracts \
            --ignore=tests/heavy_integration \
            --ignore=tests/benchmarks \
            --ignore=src/engines/Simscape_Multibody_Models/3D_Golf_Model/matlab/motion_matching/option4_python_bridge/tests \
            -m "not slow and not benchmark and not perf and not requires_gl and not requires_network and not requires_gpu and not requires_mocap_fixtures" \
            "${coverage_args[@]}" \
            "${coverage_report_args[@]}" \
            --tb=short \
            --durations=20 \
            -v

      - name: Stop Xvfb
        if: always() && steps.core-test-changes.outputs.skip != 'true'
        run: |
          if [ -n "${UPSTREAMDRIFT_XVFB_PID:-}" ]; then
            kill "${UPSTREAMDRIFT_XVFB_PID}" 2>/dev/null || true
            wait "${UPSTREAMDRIFT_XVFB_PID}" 2>/dev/null || true
          fi
          if [ -n "${UPSTREAMDRIFT_XVFB_LOCKDIR:-}" ]; then
            rmdir "${UPSTREAMDRIFT_XVFB_LOCKDIR}" 2>/dev/null || true
          fi

      - name: Enforce Per-Package Coverage Thresholds
        if: >-
          steps.core-test-changes.outputs.skip != 'true' &&
          (
            steps.core-tests.outputs.full_coverage_generated == 'true' ||
            steps.core-tests.outputs.pr_targeted_coverage_generated == 'true'
          )
        run: |
          if [ "${{ steps.core-tests.outputs.pr_targeted_coverage_generated }}" = "true" ]; then
            python3 scripts/config/coverage_enforcer.py coverage.xml --changed-files "$RUNNER_TEMP/changed_coverage_targets.txt"
          else
            python3 scripts/config/coverage_enforcer.py coverage.xml
          fi
      # Dependency-free validator coverage that supports future native-engine jobs.
      - name: Cross-Engine Validator Core Unit Tests
        if: steps.core-test-changes.outputs.skip != 'true'
        env:
          PYTHONPATH: .:src:src/engines/physics_engines/mujoco/python:src/engines/physics_engines/mujoco/python/mujoco_humanoid_golf
          QT_QPA_PLATFORM: offscreen
          QT_API: pyqt6
        run: |
          set -o pipefail
          echo "## Cross-Engine Validator Core Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- This step exercises the dependency-free validator logic only." >> "$GITHUB_STEP_SUMMARY"
          echo "- It does not install or verify Drake, Pinocchio, OpenSim, or MyoSuite." >> "$GITHUB_STEP_SUMMARY"
          xvfb-run --auto-servernum python -m pytest tests/integration/test_cross_engine_validation.py \
            -p no:xvfb \
            --timeout=60 \
            --timeout-method=thread \
            -v --tb=short 2>&1 | tee cross-engine-results.txt

          # Report to summary
          passed=$(grep -c "PASSED" cross-engine-results.txt || echo "0")
          failed=$(grep -c "FAILED" cross-engine-results.txt || echo "0")
          echo "- Passed: $passed | - Failed: $failed" >> "$GITHUB_STEP_SUMMARY"

      # Performance regression benchmarks (issue #3510)
      # Lightweight, dependency-free benchmarks that compare median wall-
      # clock time of critical hot paths against tests/benchmarks/baseline.json
      # using a generous 5x regression multiplier. Failures here indicate a
      # large performance drop (intentional or otherwise) and should be
      # investigated before merging. To re-baseline, capture new medians and
      # update tests/benchmarks/baseline.json in a follow-up commit.
      - name: Performance Regression Benchmarks
        if: matrix.python == '3.11' && steps.core-test-changes.outputs.skip != 'true'
        env:
          PYTHONPATH: .:src:src/engines/physics_engines/mujoco/python:src/engines/physics_engines/mujoco/python/mujoco_humanoid_golf
          QT_QPA_PLATFORM: offscreen
          QT_API: pyqt6
        run: |
          xvfb-run --auto-servernum python -m pytest \
            tests/benchmarks/test_regression_benchmarks.py \
            -p no:xvfb \
            -m benchmark \
            --timeout=120 \
            --timeout-method=thread \
            --no-cov \
            -v --tb=short

      - name: Upload Benchmark Baseline Artifact
        if: matrix.python == '3.11' && steps.core-test-changes.outputs.skip != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: performance-baseline
          path: tests/benchmarks/baseline.json
          if-no-files-found: warn

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: env.CODECOV_TOKEN != '' && steps.core-test-changes.outputs.skip != 'true'
        with:
          fail_ci_if_error: false # Do not block if token is missing
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  parity-smoke:
    needs: pick-runner
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.lock
      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Create stub ui/dist for editable install
        run: mkdir -p ui/dist
      - name: Install parity smoke dependencies
        run: |
          python -m ensurepip --upgrade || true
          python -m pip install --no-cache-dir --ignore-installed -r requirements-dev.lock
          python -m pip install --no-cache-dir --no-deps -e ".[dev]"
      - name: Run scheduled parity smoke suite
        run: |
          python -m pytest \
            tests/api/test_api_parity.py \
            tests/config/launcher_manifest/test_parity.py \
            tests/parity/test_fitresult_field_parity.py \
            tests/unit/theme/test_sidekick_parity.py \
            -m parity \
            -q \
            --tb=short

  alembic-postgres-round-trip:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: upstreamdrift_migrations
          POSTGRES_USER: upstreamdrift
          POSTGRES_PASSWORD: upstreamdrift
        ports:
          - 5432
        options: >-
          --health-cmd "pg_isready -U upstreamdrift -d upstreamdrift_migrations"
          --health-interval 10s
          --health-start-period 300s
          --health-timeout 5s
          --health-retries 60
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.lock
      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Create Alembic Virtual Environment
        run: |
          python -m venv "$RUNNER_TEMP/alembic-ci-venv"
          echo "$RUNNER_TEMP/alembic-ci-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/alembic-ci-venv" >> "$GITHUB_ENV"
          python -m pip install --upgrade pip
      - name: Create stub ui/dist for editable install
        run: mkdir -p ui/dist
      - name: Install migration test dependencies
        run: |
          python -m ensurepip --upgrade || true
          python -m pip install --upgrade pip
          python -m ensurepip --upgrade || true
          python -m pip install --no-cache-dir --ignore-installed -r requirements-dev.lock
          python -m pip install --no-cache-dir --no-deps -e ".[dev]"
          python -m ensurepip --upgrade || true
          python -m pip install "psycopg[binary]>=3.1"
      - name: Run Alembic PostgreSQL round-trip
        env:
          ALEMBIC_ROUND_TRIP_DATABASE_URL: postgresql+psycopg://upstreamdrift:upstreamdrift@localhost:${{ job.services.postgres.ports[5432] }}/upstreamdrift_migrations
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          python3 - <<'PY'
          import os
          import time

          import psycopg

          sqlalchemy_url = os.environ["ALEMBIC_ROUND_TRIP_DATABASE_URL"]
          psycopg_url = sqlalchemy_url.replace("postgresql+psycopg://", "postgresql://", 1)
          deadline = time.monotonic() + 60
          last_error = None

          while time.monotonic() < deadline:
              try:
                  with psycopg.connect(psycopg_url, connect_timeout=5) as connection:
                      with connection.cursor() as cursor:
                          cursor.execute("SELECT 1")
                          cursor.fetchone()
                  break
              except Exception as exc:  # noqa: BLE001 - surface the last transient startup error.
                  last_error = exc
                  time.sleep(2)
          else:
              raise SystemExit(f"PostgreSQL did not accept SQL connections: {last_error!r}")
          PY
          python3 -m pytest -p pytest_timeout -p asyncio tests/integration/test_alembic_round_trip.py \
            -m "not slow and not benchmark and not perf and not requires_gl and not requires_network and not requires_gpu and not requires_mocap_fixtures" \
            --timeout=180 \
            --timeout-method=thread \
            --durations=10 \
            -vv --tb=short

  shared-tools-consumer-contracts:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 20
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Checkout Tools Hub
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          repository: ${{ vars.TOOLS_REPOSITORY || format('{0}/Tools', github.repository_owner) }}
          path: _tools_dep
      - name: Symlink Tools for Workspace
        run: bash "$GITHUB_WORKSPACE/scripts/setup_tools_workspace.sh"
      - name: Reject Raw Merge Conflict Markers
        run: |
          if grep -rne '<<<<<<< HEAD' . --exclude-dir=.git --exclude-dir=.github; then
            echo "::error::Raw git merge conflict markers found!"
            exit 1
          fi

      - name: Install System Dependencies
        run: |
          apt_retry() {
            for attempt in {1..12}; do
              if sudo apt-get -o DPkg::Lock::Timeout=300 -o APT::Get::Lock-Timeout=300 "$@"; then
                return 0
              fi
              echo "apt-get $* failed on attempt $attempt; retrying after lock backoff"
              sleep 10
            done
            sudo apt-get -o DPkg::Lock::Timeout=300 -o APT::Get::Lock-Timeout=300 "$@"
          }
          apt_retry update
          apt_retry install -y \
            libegl1 libgl1 xvfb \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1
      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.lock
      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Create stub ui/dist for editable install
        run: mkdir -p ui/dist
      - name: Install Core Test Dependencies
        # See tests/Install Core Test Dependencies for the rationale  -
        # the shared toolcache can carry a stale `sortedcontainers` that
        # makes hypothesis fail during pytest_terminal_summary.
        # Force-reinstall numpy/scipy to ensure a consistent binary ABI:
        # the self-hosted toolcache for Python 3.11 carries numpy 2.4.x
        # which is incompatible with cached scipy wheels built against <2.3.
        run: |
          python -m venv "$RUNNER_TEMP/shared-contracts-venv"
          echo "$RUNNER_TEMP/shared-contracts-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/shared-contracts-venv" >> "$GITHUB_ENV"
          python -m ensurepip --upgrade || true
          "$RUNNER_TEMP/shared-contracts-venv/bin/python" -m pip install --upgrade pip
          python="$RUNNER_TEMP/shared-contracts-venv/bin/python"
          python -m ensurepip --upgrade || true
          "$python" -m pip install --force-reinstall --no-deps "sortedcontainers>=2.4.0" "hypothesis>=6.0.0"
          "$python" -m pip install --no-cache-dir --ignore-installed -r requirements-dev.lock
          "$python" -m pip install --no-cache-dir --no-deps -e ".[gui-test]"
          # Prevent environment pollution conflict between pytest-recording and pytest-vcr
          "$python" -m pip uninstall -y pytest-vcr pytest-recording || true
          python -m ensurepip --upgrade || true
          "$python" -m pip install --force-reinstall --no-cache-dir "numpy==2.2.6" "scipy==1.15.3"
          "$python" -c "import numpy, scipy; from scipy import signal; print(f'numpy={numpy.__version__} scipy={scipy.__version__} signal=ok')"
      - name: Run Shared Tools Consumer Contracts
        env:
          QT_QPA_PLATFORM: offscreen
          QT_API: pyqt6
          REQUIRE_REAL_TOOLS_REPO: "1"
        run: |
          xvfb-run --auto-servernum python -m pytest tests/shared_contracts/ \
            -p no:xvfb \
            --tools-mode=vendored \
            --timeout=60 \
            --timeout-method=thread \
            -v --tb=short

  frontend-tests:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./ui
    steps:
      - name: Clean corrupt git objects
        shell: bash
        working-directory: .
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Check for frontend changes
        id: frontend-changes
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
          if git diff --quiet "origin/${{ github.base_ref }}" HEAD -- ui; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No ui/ changes detected; skipping frontend checks for this PR."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        if: steps.frontend-changes.outputs.skip != 'true'
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        if: steps.frontend-changes.outputs.skip != 'true'
        run: npm ci

      - name: Type Check
        if: steps.frontend-changes.outputs.skip != 'true'
        run: npm run type-check

      - name: Lint
        if: steps.frontend-changes.outputs.skip != 'true'
        run: npm run lint

      - name: Run Tests
        if: steps.frontend-changes.outputs.skip != 'true'
        run: npm run test:run -- --testTimeout=15000

      - name: Build Check
        if: steps.frontend-changes.outputs.skip != 'true'
        run: npm run build

  # =============================================================================
  # MATLAB TESTS - DISABLED BY DEFAULT
  # =============================================================================
  # This job requires a MATLAB license which is NOT available in GitHub CI.
  # DO NOT enable (remove 'if: false') unless you have configured MATLAB licensing.
  # To enable: set 'if: true' and configure matlab-actions.
  # Users with local MATLAB can run: matlab/run_all.m for equivalent tests.
  # =============================================================================
  matlab-tests:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 30
    if: false # DISABLED - Requires MATLAB license not available in CI
    continue-on-error: true
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: matlab-actions/setup-matlab@a0180c939fb1a28de13f44f7b778b912384ced1f
      - uses: matlab-actions/run-command@bcd446a219949c24051c1d04a4b4e0274c42f23b
        with:
          command: |
            addpath('matlab');
            run_all

  # =============================================================================
  # ARDUINO BUILD - DISABLED BY DEFAULT
  # =============================================================================
  # No Arduino components in this project - disabled.
  # =============================================================================
  arduino-build:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 15
    if: false # DISABLED - No Arduino components in this project
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi

      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Purge pip cache
        run: python -m pip cache purge || true
      - run: |
          python -m ensurepip --upgrade || true
