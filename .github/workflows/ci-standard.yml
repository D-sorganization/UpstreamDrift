name: CI Standard
# ---------------------------------------------------------------------------
# WORKFLOW INVENTORY (issue #2352 — 58 workflows with overlapping concerns)
# ---------------------------------------------------------------------------
# Core CI (this file and below) are authoritative. Jules-* workflows are
# AI-automation helpers that SHOULD NOT duplicate core-CI checks.
#
# Known overlaps (to consolidate in a future cleanup PR):
#   - auto-remediate-issues.yml   ←→  Jules-Assessment-Remediator.yml
#     Both remediate assessment issues. Remediator is the canonical version;
#     auto-remediate-issues.yml is scheduled for removal.
#
#   - assessment-auto-fix.yml     ←→  Jules-Assessment-AutoFix.yml
#     Both dispatch auto-fixes. Jules-Assessment-AutoFix is the newer version
#     with dry-run support; assessment-auto-fix.yml is legacy.
#
#   - Jules-Code-Quality-Fixer    ←→  Jules-Assessment-AutoFix
#     Both fix code quality issues found in assessments. Fixer runs on a
#     static assessment file; AutoFix generates and fixes in one pass.
#
#   - Jules-Auto-Repair           ←→  Jules-Hotfix-Creator
#     Both respond to CI failures. Auto-Repair pushes to the failing branch;
#     Hotfix-Creator opens a new hotfix branch. Not truly redundant.
#
# Action items:
#   1. Disable/delete auto-remediate-issues.yml (superseded).
#   2. Disable/delete assessment-auto-fix.yml (superseded).
#   3. Review Jules-Code-Quality-Fixer vs Jules-Assessment-AutoFix for merge.
# ---------------------------------------------------------------------------
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
      - ".github/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:
  schedule:
    # Weekly run every Monday at 06:00 UTC — catches test drift and
    # coverage regression independent of code changes (issue #1789)
    - cron: "0 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          ONLINE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
            --jq '[.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online — routing locally"
          else
            echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
            echo "No self-hosted runner — using GitHub-hosted"
          fi
  quality-gate:
    needs: pick-runner
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install ruff==0.14.10 mypy>=1.15.0 bandit==1.7.7 pydocstyle==6.3.0

      # FIX: Less aggressive Ruff (Errors, Warnings, Imports only)
      - name: Lint
        run: ruff check .

      # Use ruff format (consistent with pre-commit hooks) - ruff format is
      # a strict superset of black's style; running both causes conflicts.
      # Runs on full repo (.) to catch formatting issues outside src/scripts/tests.
      - name: Check Formatting (ruff)
        run: ruff format --check .

      - run: pip install mypy types-PyYAML types-requests
      - run: pip install -e .[dev]
      # Baseline mypy check across all of src/
      - run: mypy src --config-file pyproject.toml
      # Strict mypy for the fully-annotated API layer (issue #2105).
      # --follow-imports=silent applies strict rules only to src/api/ files,
      # not to their transitive dependencies (which have pre-existing issues).
      - name: MyPy Strict (src/api)
        run: mypy src/api --strict --follow-imports=silent --config-file pyproject.toml

      - name: Dependency Direction Fitness Check
        run: python3 scripts/check_dependency_direction.py

      - name: Changed-File Size Budget Check
        run: python3 scripts/check_file_size_budget.py

      - name: Module Size Budget Check
        run: python3 scripts/check_module_size_budget.py --max-lines 1500 --include src

      - name: Heavy Test Dependency Parity Check
        run: python3 scripts/check_heavy_dep_parity.py

      - name: Prevent Net-New print() Calls
        run: python3 scripts/check_no_print_calls.py

      # TODO detection now BLOCKING - Jules Auto-Repair will fix
      - name: Verify No Placeholders
        run: |
          violations=$(
            find . \( -path "./.git" -o -path "./.mypy_cache" -o -path "./.ruff_cache" -o -path "./__pycache__" -o -path "./archive" -o -path "./check_code_quality" -o -path "./scripts" -o -path "./tests/tools" -o -path "./vendor" \) -prune -o -type f -name "*.py" -print0 \
              | xargs -0 grep -nE "TODO|FIXME" || true
          )
          if [ -n "$violations" ]; then
            echo "$violations"
            echo "::error::Placeholders found. Remove TODOs/FIXMEs or create tracked GitHub issues."
            exit 1
          fi

      # SECURITY FIX: Make security audit blocking (fail on vulnerabilities)
      - name: Security Audit
        run: |
          pip install --upgrade pip
          # Force-reinstall sortedcontainers before pip-audit: the shared runner toolcache
          # can carry a half-installed sortedcontainers that makes cyclonedx (pip-audit dep) fail.
          pip install --force-reinstall --no-deps "sortedcontainers>=2.4.0"
          pip install pip-audit
          # Audit only the project's declared dependency set (requirements-dev.lock)
          # rather than all ambient packages in the shared runner toolcache.
          # The shared self-hosted runner toolcache accumulates stale packages from
          # multiple projects; auditing the full environment produces false positives.
          # Ignore CVEs with no fix version available:
          # - CVE-2024-23342 (ecdsa): No fix version available
          # - CVE-2026-0994 (protobuf): No fix version available - transitive dep from dm_control
          # - CVE-2026-1703 (pip): pip upgrade may not persist in GHA runner env
          # - CVE-2026-4539 (pygments): No fix version available at time of writing
          # - CVE-2026-40192 (pillow): Transitive dep via opencv/imageio; fix in pillow>=12.2.0
          # Resolved CVEs (issue #2653): black>=26.3.1, bokeh>=3.8.2, flask>=3.1.3, requests>=2.33.0
          # are now pinned in pyproject.toml dev deps and requirements-dev.lock.
          # Resolved CVE (Dependabot remediation 2026-04-14):
          # - CVE-2025-71176 (pytest): now pinned to pytest>=9.0.3 in requirements-dev.lock
          python -m pip_audit -r requirements-dev.lock \
            --ignore-vuln CVE-2024-23342 \
            --ignore-vuln CVE-2026-0994 \
            --ignore-vuln CVE-2026-1703 \
            --ignore-vuln CVE-2026-4539 \
            --ignore-vuln CVE-2026-40192

      # SECURITY: Bandit static security analysis (Issue #782)
      # Blocking on medium+ severity, medium+ confidence findings (Issue #2067)
      - name: Bandit Security Scan
        run: |
          bandit_output="$(bandit -r . -x ./tests,./archive,./legacy,./.git,./vendor -ll -ii --format txt 2>&1)"
          exit_code=$?
          echo "$bandit_output"
          echo "## Security Scan Results" >> "$GITHUB_STEP_SUMMARY"
          echo "$bandit_output" >> "$GITHUB_STEP_SUMMARY"
          exit $exit_code

      # Code Quality Check (Issue #781) - checks for placeholders, magic numbers, etc.
      - name: Code Quality Check
        run: |
          PYTHONPATH=. python src/tools/code_quality_check.py || echo "::warning::Code quality issues found - see output above"

      - name: MATLAB Quality Check
        continue-on-error: true
        run: |
          PYTHONPATH=. python src/tools/matlab_utilities/scripts/matlab_quality_check.py > matlab_quality_report.txt
          cat matlab_quality_report.txt

      - name: Upload MATLAB Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: matlab-quality-report
          path: matlab_quality_report.txt

  tests:
    needs: [pick-runner, quality-gate]
    runs-on: self-hosted
    timeout-minutes: 20 # Prevent runaway tests - hard cutoff
    strategy:
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: Reject Raw Merge Conflict Markers
        run: |
          if grep -rne '<<<<<<< HEAD' . --exclude-dir=.git --exclude-dir=.github; then
            echo "::error::Raw git merge conflict markers found!"
            exit 1
          fi

      - name: Install System Dependencies
        run: |
          apt_retry() {
            for attempt in {1..12}; do
              if sudo apt-get -o DPkg::Lock::Timeout=300 -o APT::Get::Lock-Timeout=300 "$@"; then
                return 0
              fi
              echo "apt-get $* failed on attempt $attempt; retrying after lock backoff"
              sleep 10
            done
            sudo apt-get -o DPkg::Lock::Timeout=300 -o APT::Get::Lock-Timeout=300 "$@"
          }
          apt_retry update
          apt_retry install -y \
            libegl1 libgl1 xvfb \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install Core Test Dependencies
        # Force-reinstall hypothesis + sortedcontainers: the shared self-
        # hosted toolcache occasionally carries half-installed versions
        # where the pip metadata says 2.4.0 but the package namespace is
        # missing exports (e.g. `SortedSet`). A plain `pip install -e` sees
        # "Requirement already satisfied" and doesn't repair the cache,
        # which causes hypothesis to fail its terminal-summary import.
        run: |
          python -m venv "$RUNNER_TEMP/core-ci-venv"
          echo "$RUNNER_TEMP/core-ci-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/core-ci-venv" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/core-ci-venv/bin/python" -m pip install --upgrade pip
          python="$RUNNER_TEMP/core-ci-venv/bin/python"
          "$python" -m pip install --force-reinstall --no-deps "sortedcontainers>=2.4.0" "hypothesis>=6.0.0"
          "$python" -m pip install -e ".[dev,gui-test]"
          "$python" -m pip install --force-reinstall --no-cache-dir "numpy==2.2.6" "scipy==1.15.3"

      - name: Document Native Engine Coverage In Core Lane
        run: |
          echo "## Core CI Coverage" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- This lane installs core project dependencies plus \`[dev,gui-test]\`." >> "$GITHUB_STEP_SUMMARY"
          echo "- MuJoCo coverage may run because MuJoCo is part of the base project dependencies." >> "$GITHUB_STEP_SUMMARY"
          echo "- Drake, Pinocchio, OpenSim, and MyoSuite are optional extras and are not provisioned in this lane." >> "$GITHUB_STEP_SUMMARY"
          echo "- Passing this job does not claim full native-engine integration coverage for those optional stacks." >> "$GITHUB_STEP_SUMMARY"

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset &
          sleep 1
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Clean Stale Coverage Data
        # Self-hosted runners reuse workspaces across jobs. A crashed
        # worker from a prior run can leave behind a partially-written
        # .coverage.<host>.<pid>.<rand> sqlite file with no 'file' table,
        # which then causes pytest-cov to abort the next run with
        # "sqlite3.OperationalError: no such table: file". Remove any
        # stale coverage artefacts before collecting fresh data.
        run: |
          rm -f .coverage .coverage.* coverage.xml || true

      - name: Run Core Test Suite
        env:
          PYTHONPATH: .:src:src/engines/physics_engines/mujoco/python:src/engines/physics_engines/mujoco/python/mujoco_humanoid_golf
          QT_QPA_PLATFORM: offscreen
          QT_API: pyqt6
        run: |
          export COVERAGE_FILE="$RUNNER_TEMP/.coverage"

          # Run the default, dependency-light CI lane:
          # - Serial execution for self-hosted runner and coverage stability
          # - 60 second timeout per test
          # - Skip slow tests in CI for faster feedback
          # - Coverage measurement on src/ (pytest-cov)
          # Optional native-engine extras such as Drake/Pinocchio/OpenSim/MyoSuite
          # are intentionally not provisioned here.
          xvfb-run --auto-servernum python -m pytest \
            -p no:xvfb \
            -n 0 \
            --timeout=60 \
            --timeout-method=thread \
            --ignore=tests/shared_contracts \
            --ignore=tests/heavy_integration \
            --ignore=tests/benchmarks \
            -m "not slow and not benchmark and not requires_gl and not requires_network and not requires_gpu" \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-config=pyproject.toml \
            --cov-fail-under=30 \
            --tb=short \
            -v

      # Dependency-free validator coverage that supports future native-engine jobs.
      - name: Cross-Engine Validator Core Unit Tests
        env:
          PYTHONPATH: .:src:src/engines/physics_engines/mujoco/python:src/engines/physics_engines/mujoco/python/mujoco_humanoid_golf
          QT_QPA_PLATFORM: offscreen
          QT_API: pyqt6
        run: |
          set -o pipefail
          echo "## Cross-Engine Validator Core Unit Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- This step exercises the dependency-free validator logic only." >> "$GITHUB_STEP_SUMMARY"
          echo "- It does not install or verify Drake, Pinocchio, OpenSim, or MyoSuite." >> "$GITHUB_STEP_SUMMARY"
          xvfb-run --auto-servernum python -m pytest tests/integration/test_cross_engine_validation.py \
            -p no:xvfb \
            --timeout=60 \
            --timeout-method=thread \
            -v --tb=short 2>&1 | tee cross-engine-results.txt

          # Report to summary
          passed=$(grep -c "PASSED" cross-engine-results.txt || echo "0")
          failed=$(grep -c "FAILED" cross-engine-results.txt || echo "0")
          echo "✅ Passed: $passed | ❌ Failed: $failed" >> "$GITHUB_STEP_SUMMARY"
      - uses: codecov/codecov-action@v6
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        if: env.CODECOV_TOKEN != ''
        with:
          fail_ci_if_error: false # Do not block if token is missing
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  shared-tools-consumer-contracts:
    needs: [pick-runner, quality-gate]
    runs-on: self-hosted
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Checkout Tools Hub
        uses: actions/checkout@v6
        with:
          repository: D-sorganization/Tools
          path: _tools_dep
      - name: Symlink Tools for Workspace
        run: bash "$GITHUB_WORKSPACE/scripts/setup_tools_workspace.sh"
      - name: Reject Raw Merge Conflict Markers
        run: |
          if grep -rne '<<<<<<< HEAD' . --exclude-dir=.git --exclude-dir=.github; then
            echo "::error::Raw git merge conflict markers found!"
            exit 1
          fi

      - name: Install System Dependencies
        run: |
          apt_retry() {
            for attempt in {1..12}; do
              if sudo apt-get -o DPkg::Lock::Timeout=300 -o APT::Get::Lock-Timeout=300 "$@"; then
                return 0
              fi
              echo "apt-get $* failed on attempt $attempt; retrying after lock backoff"
              sleep 10
            done
            sudo apt-get -o DPkg::Lock::Timeout=300 -o APT::Get::Lock-Timeout=300 "$@"
          }
          apt_retry update
          apt_retry install -y \
            libegl1 libgl1 xvfb \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Core Test Dependencies
        # See tests/Install Core Test Dependencies for the rationale —
        # the shared toolcache can carry a stale `sortedcontainers` that
        # makes hypothesis fail during pytest_terminal_summary.
        # Force-reinstall numpy/scipy to ensure a consistent binary ABI:
        # the self-hosted toolcache for Python 3.11 carries numpy 2.4.x
        # which is incompatible with cached scipy wheels built against <2.3.
        run: |
          python -m venv "$RUNNER_TEMP/shared-contracts-venv"
          echo "$RUNNER_TEMP/shared-contracts-venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$RUNNER_TEMP/shared-contracts-venv" >> "$GITHUB_ENV"
          "$RUNNER_TEMP/shared-contracts-venv/bin/python" -m pip install --upgrade pip
          python="$RUNNER_TEMP/shared-contracts-venv/bin/python"
          "$python" -m pip install --force-reinstall --no-deps "sortedcontainers>=2.4.0" "hypothesis>=6.0.0"
          "$python" -m pip install -e ".[dev,gui-test]"
          "$python" -m pip install --force-reinstall --no-cache-dir "numpy==2.2.6" "scipy==1.15.3"
      - name: Run Shared Tools Consumer Contracts
        env:
          QT_QPA_PLATFORM: offscreen
          QT_API: pyqt6
          REQUIRE_REAL_TOOLS_REPO: "1"
        run: |
          xvfb-run --auto-servernum python -m pytest tests/shared_contracts/ \
            -p no:xvfb \
            --tools-mode=vendored \
            --timeout=60 \
            --timeout-method=thread \
            -v --tb=short

  frontend-tests:
    needs: [pick-runner, quality-gate]
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./ui
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Run Tests
        run: npm run test:run

      - name: Build Check
        run: npm run build

  # =============================================================================
  # MATLAB TESTS - DISABLED BY DEFAULT
  # =============================================================================
  # This job requires a MATLAB license which is NOT available in GitHub CI.
  # DO NOT enable (remove 'if: false') unless you have configured MATLAB licensing.
  # To enable: set 'if: true' and configure matlab-actions.
  # Users with local MATLAB can run: matlab/run_all.m for equivalent tests.
  # =============================================================================
  matlab-tests:
    needs: [pick-runner, quality-gate]
    runs-on: self-hosted
    if: false # DISABLED - Requires MATLAB license not available in CI
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - uses: matlab-actions/setup-matlab@v2
      - uses: matlab-actions/run-command@v3
        with:
          command: |
            addpath('matlab');
            run_all

  # =============================================================================
  # ARDUINO BUILD - DISABLED BY DEFAULT
  # =============================================================================
  # No Arduino components in this project - disabled.
  # =============================================================================
  arduino-build:
    needs: [pick-runner, quality-gate]
    runs-on: self-hosted
    if: false # DISABLED - No Arduino components in this project
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - run: pip install platformio
      - name: Verify Build
        working-directory: ./arduino
        run: pio run -e uno

  # =============================================================================
  # RUST QUALITY GATE
  # =============================================================================
  # Only runs when Rust source files or Cargo manifests change.
  # Enforces: format (rustfmt), lint (clippy), tests (cargo test).
  # =============================================================================
  rust-quality-gate:
    needs: pick-runner
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for Rust changes
        id: rust-changes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "${{ github.base_ref }}"
            BASE_SHA=$(git merge-base "origin/${{ github.base_ref }}" HEAD || true)
            if [ -z "$BASE_SHA" ]; then
              BASE_SHA="${{ github.event.pull_request.base.sha }}"
            fi
            RUST_FILES=$(git diff --name-only "$BASE_SHA" HEAD -- '*.rs' 'Cargo.toml' '*/Cargo.toml' 'rust-toolchain.toml' || true)
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            RUST_FILES=$(git diff --name-only "${{ github.event.before }}" HEAD -- '*.rs' 'Cargo.toml' '*/Cargo.toml' 'rust-toolchain.toml' || true)
          else
            RUST_FILES=$(git diff --name-only HEAD~1 HEAD -- '*.rs' 'Cargo.toml' '*/Cargo.toml' 'rust-toolchain.toml' || echo "")
          fi

          if [ -n "$RUST_FILES" ]; then
            # Only enable the gate if a Cargo workspace actually exists
            if [ -f "Cargo.toml" ]; then
              echo "has_changes=true" >> "$GITHUB_OUTPUT"
              echo "Changed Rust files:"
              echo "$RUST_FILES"
            else
              echo "has_changes=false" >> "$GITHUB_OUTPUT"
              echo "Rust files changed but no Cargo.toml found — skipping quality gate."
            fi
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No Rust changes detected — skipping Rust quality gate."
          fi

      - name: Install Rust toolchain
        if: steps.rust-changes.outputs.has_changes == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown

      # Clone Tools repo for tools-core dependency
      - name: Checkout Tools (tools-core dependency)
        if: steps.rust-changes.outputs.has_changes == 'true'
        uses: actions/checkout@v6
        with:
          repository: D-sorganization/Tools
          path: _tools_dep
          sparse-checkout: |
            rust_core
            Cargo.toml
            rust-toolchain.toml

      - name: Symlink Tools for Cargo path resolution
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: ln -sfn "$GITHUB_WORKSPACE/_tools_dep" "$GITHUB_WORKSPACE/../Tools"

      - name: Cache Cargo registry
        if: steps.rust-changes.outputs.has_changes == 'true'
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format Check (rustfmt)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: cargo fmt --all -- --check

      - name: Lint (Clippy)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: cargo clippy --all-targets -- -D warnings

      - name: Run Rust Tests
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          # Features `python` and `wasm` use mutually-exclusive FFI systems
          cargo test
          cargo test --features python

      - name: Build PyO3 Wheel (Maturin)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          python3 -m venv "$RUNNER_TEMP/rust-venv"
          source "$RUNNER_TEMP/rust-venv/bin/activate"
          python -m pip install --upgrade pip maturin
          cd rust_core/upstream-physics
          python -m maturin build --interpreter python --features python --release
          echo "Wheel built successfully"
          ls ../../target/wheels/

      - name: Verify Python Bindings
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          source "$RUNNER_TEMP/rust-venv/bin/activate"
          python -m pip install target/wheels/upstream_physics-*.whl
          python -c "
          import upstream_physics
          # Verify key types are importable
          cfg = upstream_physics.IntegratorConfig()
          cp = upstream_physics.ContactParameters()
          print('IntegratorConfig:', cfg)
          print('ContactParameters:', cp)
          print('SwingPlaneResult available:', hasattr(upstream_physics, 'SwingPlaneResult'))
          print('All Python bindings verified!')
          "

      - name: Build WASM Module (wasm-pack)
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          rustup target add wasm32-unknown-unknown
          cargo build --target wasm32-unknown-unknown --features wasm -p upstream-physics
          echo "WASM target build successful"

      - name: Rust Quality Gate Summary
        if: steps.rust-changes.outputs.has_changes == 'true'
        run: |
          echo "## Rust Quality Gate" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ rustfmt: formatted" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ clippy: no warnings" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ cargo test: all tests pass" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ maturin: wheel built" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Python bindings: verified" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ WASM: target compiled and verified" >> $GITHUB_STEP_SUMMARY
