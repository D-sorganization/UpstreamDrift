name: Heavy Integration Suite
on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:
jobs:
  heavy-tests:
    runs-on: d-sorg-fleet-4core
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          if [ -f "pyproject.toml" ]; then pip install -e ".[dev,test]" || pip install -e .; fi
      - name: Run heavy integration tests
        run: pytest -v -m "live_simulation" --cov=src --cov-report=xml:heavy_coverage.xml --tb=short
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: heavy-test-results-${{ github.run_id }}
          path: heavy_coverage.xml
          retention-days: 30
