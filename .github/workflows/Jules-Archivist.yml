name: Jules Archivist

on:
  workflow_call:

# ✅ PERMISSION FIX: Grants access to delete remote branches
permissions:
  contents: write
  pull-requests: read

jobs:

  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          ONLINE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
            --jq '[.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online — routing locally"
          else
            echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
            echo "No self-hosted runner — using GitHub-hosted"
          fi
  archive-tasks:
    needs: pick-runner
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cleanup Merged Branches
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          # Fetch list of merged PR branches starting with 'jules/'
          # Note: We filter by the branch prefix used by your agent
          BRANCHES=$(gh pr list --state merged --limit 100 --json headRefName --jq '.[] | select(.headRefName | startswith("jules/")) | .headRefName')

          if [ -z "$BRANCHES" ]; then
            echo "No branches to cleanup."
            exit 0
          fi

          for BRANCH in $BRANCHES; do
            echo "Deleting merged branch: $BRANCH"
            # Delete remote branch
            git push origin --delete "$BRANCH" || true
          done
