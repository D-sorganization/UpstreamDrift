name: Jules Archivist

on:
  workflow_call:

# - PERMISSION FIX: Grants access to delete remote branches
permissions:
  contents: write
  pull-requests: read

jobs:
  check-kill-switch:
    runs-on: d-sorg-fleet
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check Jules Kill Switch
        id: check
        run: |
          if [ "${{ vars.JULES_ENABLED }}" = "false" ]; then
            echo "Jules is DISABLED via kill switch."
            echo "enabled=false" >> $GITHUB_OUTPUT
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

  pick-runner:
    needs: check-kill-switch
    if: needs.check-kill-switch.outputs.enabled == 'true'
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            --jq 'if .runners then [.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length else 0 end' \
            2>/dev/null || echo "0")
          if ! [[ "$ONLINE" =~ ^[0-9]+$ ]]; then
            ONLINE=0
          fi
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online - routing locally"
          else
            echo "::error::No local self-hosted runner available; failing closed"
            exit 1
          fi

  archivist:
    needs: [check-kill-switch, pick-runner]
    if: needs.check-kill-switch.outputs.enabled == 'true'
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Cleanup Merged Branches
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN || github.token }}
        run: |
          # Fetch list of merged PR branches with semantic prefixes
          # Note: We filter by the branch prefix used by your agent
          BRANCHES=$(gh pr list --state merged --limit 100 --json headRefName --jq '.[] | select(.headRefName | test("^fix/auto-fix-consolidated-|^fix/code-quality-fix-|^fix/comment-fixes-|^fix/critics-comments-|^fix/issue-resolver-|^docs/laymans-terms-|^docs/assessment-reports|^docs/update-|^refactor/custodian-|^refactor/compiled-|^fix/pragmatic|^fix/compiled-|^fix/consolidated-prs-")) | .headRefName')

          if [ -z "$BRANCHES" ]; then
            echo "No branches to cleanup."
            exit 0
          fi

          for BRANCH in $BRANCHES; do
            echo "Deleting merged branch: $BRANCH"
            # Delete remote branch
            git push origin --delete "$BRANCH" || true
          done
