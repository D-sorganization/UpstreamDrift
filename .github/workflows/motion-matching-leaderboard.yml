# Motion-matching leaderboard regeneration check (issue #4080, #4237).
#
# MATLAB + Simulink are not available on hosted GitHub runners, so this
# workflow cannot actually re-execute `run_leaderboard.m`. Instead it
# enforces the *contract* that every PR touching `motion_matching/`
# commits a refreshed `LEADERBOARD.md` (and its sidecar
# `.leaderboard_meta.json`).
#
# What this workflow does on a PR:
#   1. Verifies `motion_matching/results/LEADERBOARD.md` exists.
#   2. Verifies the LEADERBOARD.md header points at #4080 and lists the
#      canonical column schema.
#   3. Runs `scripts/ci/check_leaderboard_freshness.py`. A PR that
#      changes no solver input under `motion_matching/` (only Markdown,
#      `tests/` or the leaderboard outputs) passes, because a squash
#      merge orphans the branch `git_head` (#14767). Otherwise
#      `git_head` in `motion_matching/results/.leaderboard_meta.json`
#      must be an ancestor of HEAD with no solver input changed after
#      it; if not, the PR is told to rerun `run_leaderboard.m`.
#   4. Surfaces a manual-regeneration reminder in the PR's job summary.
#
# How a contributor regenerates the leaderboard locally (the only path
# that can actually run the optimizers):
#
#   cd src/engines/Simscape_Multibody_Models/3D_Golf_Model/matlab
#   matlab -batch "addpath(genpath('motion_matching')); run_leaderboard"
#
# That command writes the per-pair `.mat` files, the refreshed
# `motion_matching/results/LEADERBOARD.md`, and the freshness sidecar
# `motion_matching/results/.leaderboard_meta.json` which must all be
# staged in the PR.

name: motion-matching-leaderboard

on:
  pull_request:
    paths:
      - "src/engines/Simscape_Multibody_Models/3D_Golf_Model/matlab/motion_matching/**"
      - ".github/workflows/motion-matching-leaderboard.yml"
      - "scripts/ci/check_leaderboard_freshness.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motion-matching-leaderboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-leaderboard:
    # Fork PRs never run on the self-hosted fleet (RM#1989).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    name: check LEADERBOARD.md is committed
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          # Need full history so `git merge-base --is-ancestor` and
          # `git log <git_head>..HEAD -- <path>` resolve correctly.
          fetch-depth: 0

      - name: Verify LEADERBOARD.md exists
        run: |
          set -euo pipefail
          MD="src/engines/Simscape_Multibody_Models/3D_Golf_Model/matlab/motion_matching/results/LEADERBOARD.md"
          if [ ! -f "$MD" ]; then
            echo "::error::Missing $MD. Regenerate by running run_leaderboard.m locally and committing the output."
            exit 1
          fi
          echo "Found $MD"

      - name: Verify schema header
        run: |
          set -euo pipefail
          MD="src/engines/Simscape_Multibody_Models/3D_Golf_Model/matlab/motion_matching/results/LEADERBOARD.md"
          for col in swing_id option solver rmse_mm work_J wall_s commit timestamp; do
            if ! grep -q "$col" "$MD"; then
              echo "::error::LEADERBOARD.md missing canonical column: $col"
              exit 1
            fi
          done
          if ! grep -q "#4080" "$MD"; then
            echo "::error::LEADERBOARD.md must reference #4080 in its header."
            exit 1
          fi
          echo "Schema header looks good."

      - name: Verify leaderboard freshness (issues #4237, #14767)
        env:
          # PR base commit; empty on workflow_dispatch, which then applies the
          # full git_head ancestry contract.
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          python3 scripts/ci/check_leaderboard_freshness.py --base "${PR_BASE_SHA}"

      - name: Manual regeneration reminder
        if: always()
        run: |
          {
            echo "## Motion-matching leaderboard"
            echo ""
            echo "MATLAB / Simulink are not available on hosted runners, so the"
            echo "leaderboard cannot be regenerated here. If your PR changed any"
            echo "optimizer or fit-quality code, please rerun locally:"
            echo ""
            echo '```bash'
            echo "cd src/engines/Simscape_Multibody_Models/3D_Golf_Model/matlab"
            echo "matlab -batch \"addpath(genpath('motion_matching')); run_leaderboard\""
            echo '```'
            echo ""
            echo "and commit the refreshed \`motion_matching/results/LEADERBOARD.md\`"
            echo "and \`motion_matching/results/.leaderboard_meta.json\` (the"
            echo "freshness gate enforces both)."
          } >> "$GITHUB_STEP_SUMMARY"
