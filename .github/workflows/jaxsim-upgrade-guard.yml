name: JaxSim Upgrade Guard

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "pyproject.toml"
      - "src/engines/physics_engines/jaxsim/**"
      - "src/shared/python/pose_interchange/**"
      - "tests/motion_matching/test_cross_engine_equivalence.py"
      - "tests/unit/engines/pinocchio/test_fit_swing_gradient_math.py"
      - "docs/engines/jaxsim.md"
      - "docs/development/jaxsim_version_policy.md"
      - ".github/workflows/jaxsim-upgrade-guard.yml"
  push:
    branches: [main]
    paths:
      - "pyproject.toml"
      - "src/engines/physics_engines/jaxsim/**"
      - "src/shared/python/pose_interchange/**"
      - "tests/motion_matching/test_cross_engine_equivalence.py"
      - "tests/unit/engines/pinocchio/test_fit_swing_gradient_math.py"
      - "docs/engines/jaxsim.md"
      - "docs/development/jaxsim_version_policy.md"
      - ".github/workflows/jaxsim-upgrade-guard.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  jaxsim-upgrade-guard:
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 30

    steps:
      - name: Force HTTP/1.1 and increase postBuffer to fix checkout timeouts
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 1048576000

      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Install pinned JaxSim guard dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m ensurepip --upgrade || true
          python -m pip install --ignore-installed --no-deps pip
          python -m ensurepip --upgrade || true
          pip install -e ".[dev,jaxsim]" || pip install -e ".[dev,jaxsim]" --no-build-isolation
          pip uninstall -y pytest-vcr pytest-recording || true

      - name: Verify JaxSim pin is installed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from importlib import metadata

          installed = metadata.version("jaxsim")
          expected = "0.9.0"
          if installed != expected:
              raise SystemExit(
                  f"JaxSim upgrade guard expected {expected}, installed {installed}"
              )
          print(f"JaxSim upgrade guard using jaxsim=={installed}")
          PY

      - name: Run equivalence and gradient guards
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
          UPSTREAM_DRIFT_OUTPUT_ROOT: ${{ github.workspace }}/output
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$UPSTREAM_DRIFT_OUTPUT_ROOT/jaxsim_upgrade_guard"
          python3 -m pytest \
            -o addopts="" \
            tests/motion_matching/test_cross_engine_equivalence.py \
            tests/unit/engines/pinocchio/test_fit_swing_gradient_math.py \
            -v -rs --tb=short -p no:xvfb \
            --junitxml=test-results/jaxsim-upgrade-guard-junit.xml

      - name: Upload guard report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: jaxsim-upgrade-guard-report
          path: |
            output/jaxsim_upgrade_guard/**
            test-results/jaxsim-upgrade-guard-junit.xml
          if-no-files-found: ignore
