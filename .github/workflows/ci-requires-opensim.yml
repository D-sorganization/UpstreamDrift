name: CI Requires OpenSim

# UD-CI-002 (#13571): run on OpenSim/physics paths OR the ``ci:opensim`` label
# (including synchronize while labeled), nightly ``schedule``, ``workflow_dispatch``,
# and post-merge ``push`` to main — never on ``merge_group``.
#
# Path vs label conflict: ``pull_request`` deliberately has no trigger-level
# ``paths`` filter. The ``classify-changes`` job applies paths OR label so a
# labeled PR still re-runs on synchronize when only docs change.
#
# Regression detection delay: PRs that touch only non-OpenSim code rely on the
# nightly schedule (08:00 UTC) and post-merge main runs. Owner: @core. Response
# SLA: acknowledge nightly failures within 24 hours (``report-nightly`` job).
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Nightly at 08:00 UTC — staggered after ci-standard and optional-stack.
    - cron: "0 8 * * *"

concurrency:
  # PR runs cancel superseded pushes. Main, nightly and dispatched runs are never
  # cancelled once running. Label events other than ci:opensim get their own
  # group so tagging a PR never cancels its in-flight run (#12224 / #13571).
  group: >-
    ci-requires-opensim-${{ github.event_name == 'pull_request' &&
    format('{0}-{1}', github.ref, github.event.action == 'labeled' &&
    github.event.label.name != 'ci:opensim' && 'label' || 'run') ||
    format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  classify-changes:
    name: classify OpenSim lane
    # Fork PRs never run on the self-hosted fleet (RM#1989).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 5
    outputs:
      run: ${{ steps.classify.outputs.run }}
      reason: ${{ steps.classify.outputs.reason }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Classify paths or ci:opensim label
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          changed=()
          if [ "$EVENT_NAME" = "pull_request" ]; then
            mapfile -t changed < <(git diff --name-only "origin/${BASE_REF}...HEAD")
          fi
          args=(opensim --event "$EVENT_NAME" --labels "$PR_LABELS" --github-output)
          for file in "${changed[@]}"; do
            args+=(--changed-file "$file")
          done
          python3 scripts/classify_ci_changes.py "${args[@]}"

  pick-runner:
    needs: classify-changes
    # Fork PRs never run on the self-hosted fleet (RM#1989).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      needs.classify-changes.outputs.run == 'true'
    runs-on:
      ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' &&
      'ubuntu-latest' || 'd-sorg-fleet-docker' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"

  requires-opensim:
    name: Real OpenSim 4.6 (requires_opensim)
    needs: [classify-changes, pick-runner]
    # When the lane is skipped, still report success for branch-protection contexts.
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      always() &&
      needs.classify-changes.result == 'success' &&
      (needs.classify-changes.outputs.run != 'true' ||
      needs.pick-runner.result == 'success')
    runs-on: >-
      ${{ needs.classify-changes.outputs.run == 'true' &&
      github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' ||
      (needs.pick-runner.outputs.runner || 'd-sorg-fleet-docker') }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      MUJOCO_GL: egl
      SDL_VIDEODRIVER: dummy
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      UPSTREAMDRIFT_MSK_BASE_MODEL: shared/models/opensim/opensim-models/Models/Rajagopal/RajagopalLaiUhlrich2023.osim
    steps:
      - name: Skip OpenSim lane (paths/label gate)
        if: needs.classify-changes.outputs.run != 'true'
        run: |
          echo "OpenSim lane skipped (${{ needs.classify-changes.outputs.reason }})."
          {
            echo "## OpenSim lane skipped"
            echo "- reason: \`${{ needs.classify-changes.outputs.reason }}\`"
            echo "- nightly + main push still cover non-OpenSim regressions"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean corrupt git objects
        if: needs.classify-changes.outputs.run == 'true'
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.classify-changes.outputs.run == 'true'
        with:
          fetch-depth: 1

      - name: Fetch pinned Tools packages
        if: needs.classify-changes.outputs.run == 'true'
        uses: ./.github/actions/fetch-pinned-tools

      - name: Fetch OpenSim Rajagopal body model
        if: needs.classify-changes.outputs.run == 'true'
        # The sparse clone is kept per runner, keyed by the upstream commit
        # (#13510). A cached copy is reused only when its HEAD is that commit
        # and its checked-out files match HEAD. Anything else falls back to a
        # fresh clone.
        shell: bash
        env:
          MODELS_URL: https://github.com/opensim-org/opensim-models.git
        run: |
          set -euo pipefail
          dest=shared/models/opensim/opensim-models
          cache_root="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/upstreamdrift-opensim-models/${RUNNER_NAME:-local}"
          rm -rf "$dest"
          mkdir -p "$(dirname "$dest")"
          sha="$(git ls-remote "$MODELS_URL" HEAD 2>/dev/null | cut -f1 || true)"
          cached="$cache_root/${sha:-none}"
          if [ -n "$sha" ] &&
            [ "$(git -C "$cached" rev-parse HEAD 2>/dev/null)" = "$sha" ] &&
            git -C "$cached" diff --quiet HEAD -- Models/Rajagopal; then
            echo "Reusing cached opensim-models $sha"
            cp -a "$cached" "$dest"
          else
            git clone --depth 1 --filter=blob:none --sparse "$MODELS_URL" "$dest"
            git -C "$dest" sparse-checkout set Models/Rajagopal
            head="$(git -C "$dest" rev-parse HEAD)"
            {
              rm -rf "$cache_root" &&
                mkdir -p "$cache_root" &&
                cp -a "$dest" "$cache_root/$head.partial" &&
                mv "$cache_root/$head.partial" "$cache_root/$head"
            } || echo "::warning::could not cache opensim-models $head"
          fi
          test -f "$dest/Models/Rajagopal/RajagopalLaiUhlrich2023.osim"

      - name: Set up Python 3.12
        if: needs.classify-changes.outputs.run == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: "3.12"
          # Self-hosted runners keep a persistent per-runner PIP_CACHE_DIR.
          # There the GitHub cache always missed and its post step uploaded
          # ~135 MB over the fleet's uplink each run (#13510).
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: |
            pyproject.toml
            requirements*.lock

      - name: Create stub ui/dist for editable install
        if: needs.classify-changes.outputs.run == 'true'
        run: mkdir -p ui/dist

      - name: Restore or build persistent OpenSim venv
        if: needs.classify-changes.outputs.run == 'true'
        # Writing the dev lock into a fresh venv cost ~210 s of every run
        # (#13510). The venv is kept per runner, keyed by the lock, the
        # opensim pin and the interpreter. It is reused only when its
        # completion marker carries the key, the OpenSim/pytest stack imports
        # and the installed set matches the build-time snapshot. Anything else
        # (partial, corrupt, mutated) is wiped and rebuilt. Bump
        # OPENSIM_VENV_SCHEMA to force a rebuild on every runner.
        env:
          OPENSIM_PIN: "4.6"
          OPENSIM_VENV_SCHEMA: "1"
        run: |
          set -euo pipefail
          base="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/upstreamdrift-opensim-venv/${RUNNER_NAME:-local}"
          interp="$(python -c 'import sys; print(sys.version, sys.executable)')"
          lock_sha="$(sha256sum requirements-dev.lock | cut -d' ' -f1)"
          key="$(printf '%s\n' "schema=$OPENSIM_VENV_SCHEMA" "opensim=$OPENSIM_PIN" "python=$interp" "lock=$lock_sha" | sha256sum | cut -c1-16)"
          venv="$base/$key"
          # --no-cache-dir guarded the shared ~/.cache/pip http-v2 race. The
          # per-runner PIP_CACHE_DIR (Runner_Dashboard
          # configure-runner-pipcache.sh) removes that race, so keep the guard
          # only where no per-runner cache is configured.
          no_cache=()
          if [ -z "${PIP_CACHE_DIR:-}" ]; then no_cache=(--no-cache-dir); fi

          venv_ok() {
            [ "$(cat "$venv/.opensim-venv-complete" 2>/dev/null)" = "$key" ] || return 1
            "$venv/bin/python" -c "import opensim, pytest, xdist, pytest_timeout; assert opensim.GetVersion().startswith('$OPENSIM_PIN')" >/dev/null || return 1
            "$venv/bin/python" -m pip freeze --exclude-editable | cmp -s - "$venv/.opensim-venv-freeze"
          }

          if venv_ok; then
            echo "Reusing persistent OpenSim venv $key"
          else
            echo "Building persistent OpenSim venv $key"
            rm -rf "$venv"
            mkdir -p "$base"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --upgrade pip
            "$venv/bin/python" -m pip install "${no_cache[@]}" --ignore-installed -r requirements-dev.lock
            "$venv/bin/python" -m pip install "${no_cache[@]}" "opensim==$OPENSIM_PIN"
            "$venv/bin/python" -m pip freeze --exclude-editable > "$venv/.opensim-venv-freeze"
            echo "$key" > "$venv/.opensim-venv-complete"
          fi
          # Keep only the current key so stale venvs do not fill the disk.
          find "$base" -mindepth 1 -maxdepth 1 ! -name "$key" -exec rm -rf {} +
          echo "$venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$venv" >> "$GITHUB_ENV"

      - name: Install UpstreamDrift (editable) into the OpenSim venv
        if: needs.classify-changes.outputs.run == 'true'
        # Redone every run so the venv always tests this checkout.
        run: |
          set -euo pipefail
          no_cache=()
          if [ -z "${PIP_CACHE_DIR:-}" ]; then no_cache=(--no-cache-dir); fi
          python -m pip install "${no_cache[@]}" --force-reinstall --no-deps -e ".[dev]"
          find src/engines/physics_engines/opensim/python -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Verify OpenSim 4.6 is importable
        if: needs.classify-changes.outputs.run == 'true'
        run: |
          python - <<'PY'
          import opensim
          version = opensim.GetVersion()
          print(f"OpenSim version: {version}")
          assert version.startswith("4.6"), f"expected OpenSim 4.6, got {version}"
          PY

      - name: Verify squat joint-reaction kinematics revision
        if: needs.classify-changes.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          from src.engines.physics_engines.opensim.python.msk_lift_joint_reactions import (
              MSK_LIFT_JR_KINEMATICS_REVISION,
              joint_reaction_source_fingerprint,
          )

          assert MSK_LIFT_JR_KINEMATICS_REVISION >= 6
          print(json.dumps(joint_reaction_source_fingerprint(), indent=2))
          PY

      - name: Smoke squat joint-reaction acceleration gate
        if: needs.classify-changes.outputs.run == 'true'
        run: |
          python - <<'PY'
          import json
          import sys

          from src.engines.physics_engines.opensim.python.msk_lift_joint_reactions import (
              evaluate_lift_joint_reactions,
          )

          receipt = evaluate_lift_joint_reactions("squat", stride=5)
          err = float(receipt["acceleration_error_max"])
          limit = 5e-6
          if err >= limit:
              print(
                  json.dumps(receipt.get("acceleration_realization"), indent=2),
                  file=sys.stderr,
              )
              raise SystemExit(
                  f"acceleration_error_max {err} >= {limit} before pytest"
              )
          print(f"acceleration_error_max {err} < {limit}")
          PY

      - name: Run requires_opensim tests
        if: needs.classify-changes.outputs.run == 'true'
        run: |
          python -m pytest \
            tests/unit/lifting tests/opensim \
            -m "requires_opensim and not slow and not heavy" \
            -n auto \
            --timeout=300 \
            --timeout-method=thread \
            -rs \
            --tb=short \
            -v \
            --junitxml="$RUNNER_TEMP/opensim-results.xml"

          python - "$RUNNER_TEMP/opensim-results.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          tree = ET.parse(sys.argv[1])
          root = tree.getroot()
          passed = 0
          for tc in root.iter("testcase"):
              if not any(child.tag in ("failure", "error", "skipped") for child in tc):
                  passed += 1

          print(f"Passed requires_opensim tests: {passed}")
          if passed == 0:
              print("::error::Zero tests passed! All selected tests were skipped or none were run.", file=sys.stderr)
              sys.exit(1)
          PY

  report-nightly:
    name: Report Nightly OpenSim Result
    needs: [classify-changes, requires-opensim]
    if: >-
      always() &&
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository) &&
      github.event_name == 'schedule'
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open, update or close the nightly failure issue
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        with:
          script: |
            const title = 'Nightly OpenSim CI FAILED';
            const results = JSON.parse(process.env.NEEDS_JSON);
            const failed = Object.entries(results)
              .filter(([, job]) => job.result !== 'success')
              .map(([name, job]) => `- \`${name}\`: ${job.result}`);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const { data: open } = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: 'ci',
            });
            const existing = open.find((issue) => issue.title === title);
            if (failed.length === 0) {
              if (existing) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: existing.number,
                  body: `Nightly OpenSim lane passed in [run ${context.runId}](${runUrl}). Closing.`,
                });
                await github.rest.issues.update({
                  ...context.repo, issue_number: existing.number, state: 'closed',
                });
              }
              return;
            }
            const body = [
              `Nightly OpenSim CI failed in [run ${context.runId}](${runUrl}).`,
              '',
              'Owner: @core — acknowledge within 24 hours.',
              '',
              ...failed,
              '',
              'Reproduce on a PR by adding the `ci:opensim` label, or re-run via workflow_dispatch.',
            ].join('\n');
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number, body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo, title, body, labels: ['ci', 'ci-cd'],
              });
            }
