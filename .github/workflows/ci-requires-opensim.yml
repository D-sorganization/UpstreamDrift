name: CI Requires OpenSim

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - "LICENSE"
      - ".gitignore"
  # No merge_group trigger: this job is not a required check (only
  # quality-gate is), so the merge queue never waited on it (#13513).
  # Pull requests run via pull_request; push covers main only, so a PR branch
  # does not run the job twice.
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # PR runs cancel superseded pushes. Main and dispatched runs are never
  # cancelled once running. A per-SHA main group queued one run per merge
  # for the four docker runners (#13494). Grouped per event and ref, GitHub keeps
  # the running main run plus only the newest pending one (#12285).
  group: ci-requires-opensim-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  pick-runner:
    # Fork PRs never run on the self-hosted fleet (RM#1989).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on:
      ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' &&
      'ubuntu-latest' || 'd-sorg-fleet-docker' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"

  requires-opensim:
    name: Real OpenSim 4.6 (requires_opensim)
    needs: pick-runner
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ github.event.pull_request && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || needs.pick-runner.outputs.runner }}
    timeout-minutes: 25
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      MUJOCO_GL: egl
      SDL_VIDEODRIVER: dummy
      UPSTREAMDRIFT_MSK_BASE_MODEL: shared/models/opensim/opensim-models/Models/Rajagopal/RajagopalLaiUhlrich2023.osim
    steps:
      - name: Clean corrupt git objects
        shell: bash
        run: |
          if [ -d .git ]; then
            if find .git/objects -type f -empty | grep -q .; then
              echo "Found empty/corrupt git objects, purging .git..."
              rm -rf .git
            elif ! git fsck --quick >/dev/null 2>&1; then
              echo "git fsck failed, purging .git..."
              rm -rf .git
            fi
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Fetch pinned Tools packages
        uses: ./.github/actions/fetch-pinned-tools

      - name: Fetch OpenSim Rajagopal body model
        # The sparse clone is kept per runner, keyed by the upstream commit
        # (#13510). A cached copy is reused only when its HEAD is that commit
        # and its checked-out files match HEAD. Anything else falls back to a
        # fresh clone.
        shell: bash
        env:
          MODELS_URL: https://github.com/opensim-org/opensim-models.git
        run: |
          set -euo pipefail
          dest=shared/models/opensim/opensim-models
          cache_root="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/upstreamdrift-opensim-models/${RUNNER_NAME:-local}"
          rm -rf "$dest"
          mkdir -p "$(dirname "$dest")"
          sha="$(git ls-remote "$MODELS_URL" HEAD 2>/dev/null | cut -f1 || true)"
          cached="$cache_root/${sha:-none}"
          if [ -n "$sha" ] &&
            [ "$(git -C "$cached" rev-parse HEAD 2>/dev/null)" = "$sha" ] &&
            git -C "$cached" diff --quiet HEAD -- Models/Rajagopal; then
            echo "Reusing cached opensim-models $sha"
            cp -a "$cached" "$dest"
          else
            git clone --depth 1 --filter=blob:none --sparse "$MODELS_URL" "$dest"
            git -C "$dest" sparse-checkout set Models/Rajagopal
            head="$(git -C "$dest" rev-parse HEAD)"
            {
              rm -rf "$cache_root" &&
                mkdir -p "$cache_root" &&
                cp -a "$dest" "$cache_root/$head.partial" &&
                mv "$cache_root/$head.partial" "$cache_root/$head"
            } || echo "::warning::could not cache opensim-models $head"
          fi
          test -f "$dest/Models/Rajagopal/RajagopalLaiUhlrich2023.osim"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.4.0
        with:
          python-version: "3.12"
          # Self-hosted runners keep a persistent per-runner PIP_CACHE_DIR.
          # There the GitHub cache always missed and its post step uploaded
          # ~135 MB over the fleet's uplink each run (#13510).
          cache: ${{ runner.environment == 'github-hosted' && 'pip' || '' }}
          cache-dependency-path: |
            pyproject.toml
            requirements*.lock

      - name: Create stub ui/dist for editable install
        run: mkdir -p ui/dist

      - name: Restore or build persistent OpenSim venv
        # Writing the dev lock into a fresh venv cost ~210 s of every run
        # (#13510). The venv is kept per runner, keyed by the lock, the
        # opensim pin and the interpreter. It is reused only when its
        # completion marker carries the key, the OpenSim/pytest stack imports
        # and the installed set matches the build-time snapshot. Anything else
        # (partial, corrupt, mutated) is wiped and rebuilt. Bump
        # OPENSIM_VENV_SCHEMA to force a rebuild on every runner.
        env:
          OPENSIM_PIN: "4.6"
          OPENSIM_VENV_SCHEMA: "1"
        run: |
          set -euo pipefail
          base="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/upstreamdrift-opensim-venv/${RUNNER_NAME:-local}"
          interp="$(python -c 'import sys; print(sys.version, sys.executable)')"
          lock_sha="$(sha256sum requirements-dev.lock | cut -d' ' -f1)"
          key="$(printf '%s\n' "schema=$OPENSIM_VENV_SCHEMA" "opensim=$OPENSIM_PIN" "python=$interp" "lock=$lock_sha" | sha256sum | cut -c1-16)"
          venv="$base/$key"
          # --no-cache-dir guarded the shared ~/.cache/pip http-v2 race. The
          # per-runner PIP_CACHE_DIR (Runner_Dashboard
          # configure-runner-pipcache.sh) removes that race, so keep the guard
          # only where no per-runner cache is configured.
          no_cache=()
          if [ -z "${PIP_CACHE_DIR:-}" ]; then no_cache=(--no-cache-dir); fi

          venv_ok() {
            [ "$(cat "$venv/.opensim-venv-complete" 2>/dev/null)" = "$key" ] || return 1
            "$venv/bin/python" -c "import opensim, pytest, xdist, pytest_timeout; assert opensim.GetVersion().startswith('$OPENSIM_PIN')" >/dev/null || return 1
            "$venv/bin/python" -m pip freeze --exclude-editable | cmp -s - "$venv/.opensim-venv-freeze"
          }

          if venv_ok; then
            echo "Reusing persistent OpenSim venv $key"
          else
            echo "Building persistent OpenSim venv $key"
            rm -rf "$venv"
            mkdir -p "$base"
            python -m venv "$venv"
            "$venv/bin/python" -m pip install --upgrade pip
            "$venv/bin/python" -m pip install "${no_cache[@]}" --ignore-installed -r requirements-dev.lock
            "$venv/bin/python" -m pip install "${no_cache[@]}" "opensim==$OPENSIM_PIN"
            "$venv/bin/python" -m pip freeze --exclude-editable > "$venv/.opensim-venv-freeze"
            echo "$key" > "$venv/.opensim-venv-complete"
          fi
          # Keep only the current key so stale venvs do not fill the disk.
          find "$base" -mindepth 1 -maxdepth 1 ! -name "$key" -exec rm -rf {} +
          echo "$venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=$venv" >> "$GITHUB_ENV"

      - name: Install UpstreamDrift (editable) into the OpenSim venv
        # Redone every run so the venv always tests this checkout.
        run: |
          set -euo pipefail
          no_cache=()
          if [ -z "${PIP_CACHE_DIR:-}" ]; then no_cache=(--no-cache-dir); fi
          python -m pip install "${no_cache[@]}" --no-deps -e ".[dev]"

      - name: Verify OpenSim 4.6 is importable
        run: |
          python - <<'PY'
          import opensim
          version = opensim.GetVersion()
          print(f"OpenSim version: {version}")
          assert version.startswith("4.6"), f"expected OpenSim 4.6, got {version}"
          PY

      - name: Run requires_opensim tests
        run: |
          python -m pytest \
            tests/unit/lifting tests/opensim \
            -m "requires_opensim and not slow and not heavy" \
            -n auto \
            --timeout=300 \
            --timeout-method=thread \
            -rs \
            --tb=short \
            -v \
            --junitxml="$RUNNER_TEMP/opensim-results.xml"

          python - "$RUNNER_TEMP/opensim-results.xml" <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          tree = ET.parse(sys.argv[1])
          root = tree.getroot()
          passed = 0
          for tc in root.iter("testcase"):
              if not any(child.tag in ("failure", "error", "skipped") for child in tc):
                  passed += 1

          print(f"Passed requires_opensim tests: {passed}")
          if passed == 0:
              print("::error::Zero tests passed! All selected tests were skipped or none were run.", file=sys.stderr)
              sys.exit(1)
          PY
