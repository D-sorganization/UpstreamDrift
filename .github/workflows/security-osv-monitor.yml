name: OSV Monitor

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write

concurrency:
  group: security-osv-monitor-${{ github.repository }}
  cancel-in-progress: true

env:
  AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache

jobs:
  osv-monitor:
    timeout-minutes: 30
    runs-on: d-sorg-fleet-docker
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Run OSV scanner action
        uses: google/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2
        with:
          scan-args: |
            --recursive
            ./
          fail-on-vuln: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-version: "1.23"

      - name: Export OSV JSON for SLA triage
        shell: bash
        run: |
          go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.1 \
            scan --format json --output osv-results.json . || true
          python3 scripts/security/triage_osv_findings.py \
            --osv-json osv-results.json > osv-triage.jsonl || true

      - name: Upload OSV triage summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: osv-triage
          path: |
            osv-results.json
            osv-triage.jsonl
