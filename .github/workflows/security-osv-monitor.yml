name: OSV Monitor

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  security-events: write

concurrency:
  group: security-osv-monitor-${{ github.repository }}
  cancel-in-progress: true

jobs:
  osv-monitor:
    timeout-minutes: 30
    runs-on: ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || 'd-sorg-fleet-docker' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run OSV scanner action
        # The repository root action.yml has no `runs:`; the runnable action is the subpath (#14137).
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36
        # Findings must not fail the monitor; the SLA triage export below reports them.
        continue-on-error: true
        with:
          scan-args: |
            --recursive
            ./

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.23"

      - name: Export OSV JSON for SLA triage
        shell: bash
        run: |
          go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.3.1 \
            scan --format json --output osv-results.json . || true
          python3 scripts/security/triage_osv_findings.py \
            --osv-json osv-results.json > osv-triage.jsonl || true

      - name: Upload OSV triage summary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: osv-triage
          path: |
            osv-results.json
            osv-triage.jsonl
