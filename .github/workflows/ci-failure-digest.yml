name: Weekly CI Failure Digest

on:
  # COST OPTIMIZATION: Schedule removed  -  informational digest, run manually.
  # Was: cron "0 0 * * 0,4" (twice-weekly cloud run creating issues nobody reads daily)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            --jq 'if .runners then [.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length else 0 end' \
            2>/dev/null || echo "0")
          if ! [[ "$ONLINE" =~ ^[0-9]+$ ]]; then
            ONLINE=0
          fi
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online - routing locally"
          else
            echo "::error::No local self-hosted runner available; failing closed"
            exit 1
          fi
