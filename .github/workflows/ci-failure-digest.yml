name: Weekly CI Failure Digest

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  # COST OPTIMIZATION: Schedule removed  -  informational digest, run manually.
  # Was: cron "0 0 * * 0,4" (twice-weekly cloud run creating issues nobody reads daily)
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Force HTTP/1.1 and increase postBuffer to fix checkout timeouts
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 1048576000
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"