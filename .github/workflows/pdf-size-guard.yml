name: PDF Artifact Guard

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "**/*.pdf"

jobs:
  check-pdf-size:
    timeout-minutes: 30
    runs-on: ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || 'd-sorg-fleet-docker' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Check PDF Integrity And Repository Boundary
        run: |
          echo "Checking PDF signatures and GitHub's hard 100 MB file boundary..."

          # Get list of added or modified PDF files in this PR
          FILES=$(git diff --name-only --diff-filter=AM origin/${{ github.base_ref }}...HEAD | grep '\.pdf$' || true)

          if [ -z "$FILES" ]; then
            echo "No PDF files modified."
            exit 0
          fi

          BLOCKED=false

          for file in $FILES; do
            if [ -f "$file" ]; then
              SIZE=$(stat -c%s "$file" 2>/dev/null || stat -f%z "$file")
              SIZE_MB=$(awk "BEGIN {printf \"%.2f\", $SIZE / 1048576}")
              SIGNATURE=$(head -c 5 "$file")

              if [ "$SIGNATURE" != "%PDF-" ]; then
                echo "- BLOCKED: $file does not begin with a PDF signature."
                BLOCKED=true
              elif [ "$SIZE" -gt 100000000 ]; then
                echo "- BLOCKED: $file is $SIZE_MB MiB and exceeds GitHub's 100,000,000-byte hard limit."
                BLOCKED=true
              elif [ "$SIZE" -gt 50000000 ]; then
                echo "- WARNING: $file is $SIZE_MB MiB; GitHub warns for files above 50,000,000 bytes."
              else
                echo "- $file is a valid PDF within the repository boundary ($SIZE_MB MiB)."
              fi
            fi
          done

          if [ "$BLOCKED" = true ]; then
            echo ""
            echo "- One or more PDF artifacts are invalid or exceed GitHub's hard file boundary."
            exit 1
          fi

          echo "- All PDFs passed artifact checks."
