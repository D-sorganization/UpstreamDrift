name: Jules Global Kill Switch

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Kill switch action'
        required: true
        type: choice
        options:
          - 'enable'
          - 'disable'
          - 'status'

permissions:
  contents: write

jobs:
  control:
    timeout-minutes: 30
    runs-on: d-sorg-fleet
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Check current status
        id: status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if JULES_ENABLED is set to true
          VAL=$(gh variable list --json name,value -q '.[] | select(.name == "JULES_ENABLED") | .value' || echo "false")
          if [ "$VAL" = "true" ]; then
            echo "status=enabled" >> $GITHUB_OUTPUT
          else
            echo "status=disabled" >> $GITHUB_OUTPUT
          fi

      - name: Enable Jules workflows
        if: github.event.inputs.action == 'enable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Add/Update repository variable to enable Jules
          gh variable set JULES_ENABLED --value "true"
          echo "Jules workflows ENABLED"

      - name: Disable Jules workflows
        if: github.event.inputs.action == 'disable'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Update repository variable to disable Jules
          gh variable set JULES_ENABLED --value "false"
          echo "Jules workflows DISABLED"
          echo "⚠️  NOTE: In-flight workflows will complete. Use Actions UI to cancel if needed."

      - name: Report status
        if: github.event.inputs.action == 'status'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "## Jules Automation Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Current status: ${{ steps.status.outputs.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### How to Use" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "1. Go to Actions tab" >> $GITHUB_STEP_SUMMARY
          echo "2. Select 'Jules Global Kill Switch'" >> $GITHUB_STEP_SUMMARY
          echo "3. Click 'Run workflow'" >> $GITHUB_STEP_SUMMARY
          echo "4. Choose action: enable/disable/status" >> $GITHUB_STEP_SUMMARY

      - name: Create Issue Summary
        if: github.event.inputs.action != 'status'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ACTION="${{ github.event.inputs.action }}"
          STATUS=$([ "$ACTION" = "enable" ] && echo "ENABLED" || echo "DISABLED")
          echo "Jules workflows have been $STATUS at $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          echo "Triggered by: @${{ github.actor }}"
