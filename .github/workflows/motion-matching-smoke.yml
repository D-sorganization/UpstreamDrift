# Motion-matching slow smokes (scheduled) -- #12784
#
# tests/integration/motion_matching is integration + slow: the default addopts
# deselect it and no PR lane runs it, so two regressions in the MuJoCo-native
# driver smoke went unnoticed until #12702. This nightly lane runs it. It is
# deliberately NOT part of heavy-tests-opt-in.yml, which is gated on
# live_simulation/tests/heavy_integration and held in parity with
# Dockerfile.heavy_test and scripts/ci/run_local_heavy_tests.sh. The shared
# entry point is scripts/ci/run_motion_matching_smoke.sh (runnable locally).
#
# A scheduled failure on main also reaches fleet-main-health (red scheduled run)
# and opens/updates one issue here; a later green run closes it.
#
# Timeouts: the smoke takes about 4.7 min alone and about 10 min on a loaded
# fleet runner. The test step is capped at 30 min (3x worst case; pytest runs
# with --timeout=0, so this is the only hang guard), dependency install at 20,
# and the job at 60 to cover checkout, Python setup and artifact upload.

name: Motion-Matching Smoke

on:
  schedule:
    - cron: "30 3 * * *" # daily 03:30 UTC, away from the 02:00 / 00:00 lanes
  workflow_dispatch:

concurrency:
  group: motion-matching-smoke-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  pick-runner:
    # Dispatcher placement only (same pattern as nightly-cross-engine.yml).
    runs-on:
      ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' &&
      'ubuntu-latest' || 'd-sorg-fleet-docker' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"

  smoke:
    needs: pick-runner
    name: Motion-matching slow smokes
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Fetch pinned Tools packages
        uses: ./.github/actions/fetch-pinned-tools

      - name: Install dependencies
        timeout-minutes: 20
        run: |
          python -m ensurepip --upgrade || true
          python -m pip install --upgrade pip
          pip install -e ".[dev,test]"
          pip install "mujoco>=3.3.0,<4.0.0"
          # Prevent environment pollution conflict between pytest-recording and pytest-vcr
          pip uninstall -y pytest-vcr pytest-recording || true

      - name: Run motion-matching slow smokes
        id: smoke
        timeout-minutes: 30
        env:
          OPENBLAS_NUM_THREADS: "1"
          OMP_NUM_THREADS: "1"
          MKL_NUM_THREADS: "1"
        run: |
          set -o pipefail
          bash scripts/ci/run_motion_matching_smoke.sh \
            --junitxml=motion-matching-smoke.xml \
            | tee motion-matching-smoke.log

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: motion-matching-smoke-${{ github.run_id }}
          path: |
            motion-matching-smoke.xml
            motion-matching-smoke.log
          retention-days: 30

      - name: Open or update the failure issue
        if: failure()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const title = 'Motion-matching smoke FAILED';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci/cd',
            });
            const prior = open.data.find((i) => i.title === title);
            if (prior) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: prior.number, body: `Still failing: [run ${context.runId}](${run}).`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner, repo: context.repo.repo, title,
                labels: ['bug', 'ci/cd'],
                body: `The scheduled motion-matching smokes failed: [run ${context.runId}](${run}).\n\n` +
                  'Reproduce: `bash scripts/ci/run_motion_matching_smoke.sh`.\n' +
                  'Regressions behind this lane: #12702. Closes automatically on the next green run.',
              });
            }

      - name: Close the failure issue on success
        if: success()
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const title = 'Motion-matching smoke FAILED';
            const open = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo,
              state: 'open', labels: 'ci/cd',
            });
            for (const issue of open.data.filter((i) => i.title === title)) {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number,
                body: `Passed in [run ${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}); closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, state: 'closed',
              });
            }
