name: Jules Sentinel (Security Audit)

on:
  workflow_call:
  workflow_dispatch:
  # Schedule disabled - orchestrated by Jules-Control-Tower.yml
  # schedule:
  #   - cron: "0 0 * * 0,4"  # Weekly on Mondays at 1:30 AM UTC (overnight window)

permissions:
  contents: write
  pull-requests: write
  issues: write

# HARDENING: Prevent concurrent runs
concurrency:
  group: jules-sentinel-${{ github.repository }}
  cancel-in-progress: false

jobs:
  check-kill-switch:
    timeout-minutes: 20
    runs-on: d-sorg-fleet
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check Jules Kill Switch
        id: check
        run: |
          if [ "${{ vars.JULES_ENABLED }}" = "false" ]; then
            echo "Jules is DISABLED via kill switch."
            echo "enabled=false" >> $GITHUB_OUTPUT
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

  pick-runner:
    needs: check-kill-switch
    if: needs.check-kill-switch.outputs.enabled == 'true'
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet"

  sentinel:
    timeout-minutes: 20
    needs: [check-kill-switch, pick-runner]
    if: needs.check-kill-switch.outputs.enabled == 'true'
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Install Dependencies
        run: |
          python -m ensurepip --upgrade || true
          python -m pip install safety bandit pip-audit semgrep
          npm install -g @google/jules

      - name: Run Security Scanners
        run: |
          set -euo pipefail
          mkdir -p reports

          echo "Running pip-audit..."
          mapfile -t pip_audit_waiver_flags < <(
            python3 scripts/ci/check_pip_audit_waivers.py \
              --waiver-file scripts/config/pip_audit_waivers.json
          )
          pip_audit_status=0
          pip-audit --format json -o reports/pip_audit.json \
            "${pip_audit_waiver_flags[@]}" || pip_audit_status=$?
          if [ "$pip_audit_status" -gt 1 ]; then
            echo "::error::pip-audit failed with status $pip_audit_status"
            exit "$pip_audit_status"
          fi

          echo "Running bandit..."
          bandit_status=0
          bandit -r . -f json -o reports/bandit.json \
            --exclude './.venv,./venv,./env,./.git' || bandit_status=$?
          if [ "$bandit_status" -gt 1 ]; then
            echo "::error::bandit failed with status $bandit_status"
            exit "$bandit_status"
          fi

          echo "Running semgrep..."
          semgrep_status=0
          semgrep --config=auto --json -o reports/semgrep.json . || semgrep_status=$?
          if [ "$semgrep_status" -gt 1 ]; then
            echo "::error::semgrep failed with status $semgrep_status"
            exit "$semgrep_status"
          fi

      - name: Jules Sentinel Analysis
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
        run: |
          set -e
          DATE=$(date +%Y-%m-%d)
          REPO="${{ github.repository }}"
          API_BASE="https://jules.googleapis.com/v1alpha"

          # Check if API key is configured
          if [ -z "$JULES_API_KEY" ]; then
            echo "::warning::JULES_API_KEY not configured. Skipping Jules task."
            exit 0
          fi

          echo "Looking up repository source..."
          SOURCES=$(curl -sf -H "X-Goog-Api-Key: $JULES_API_KEY" "$API_BASE/sources" || echo '{"sources":[]}')

          OWNER=$(echo "$REPO" | cut -d'/' -f1)
          REPO_NAME=$(echo "$REPO" | cut -d'/' -f2)

          SOURCE_ID=$(echo "$SOURCES" | jq -r ".sources[] | select(.githubRepo.owner == \"$OWNER\" and .githubRepo.repo == \"$REPO_NAME\") | .name" | head -1)

          if [ -z "$SOURCE_ID" ] || [ "$SOURCE_ID" = "null" ]; then
            echo "::warning::Repository $REPO not found in Jules sources."
            exit 0
          fi

          echo "Found source: $SOURCE_ID"

          # Create session prompt
          PROMPT=$(cat << PROMPT_EOF
          '
          You are the SENTINEL security agent.

          Analyze the security audit reports in ./reports/ and document findings.

          ## DO NOT MODIFY CODE directly. Instead:

          ### For HIGH severity: Create GitHub Issue with labels: security, high-priority, jules:sentinel
          ### For MEDIUM severity: Add to .jules/sentinel.md and create Issue
          ### For LOW severity: Document in .jules/sentinel.md only

          Update .jules/sentinel.md with scan results summary.

          CRITICAL: This is a READ-ONLY audit. Do not fix code - only document and create issues.
          PROMPT_EOF
          )

          echo "Creating Jules session..."
          # HARDENING: Do NOT use automationMode: AUTO_CREATE_PR
          # Sentinel is read-only - it documents findings but doesn't create PRs autonomously
          # This prevents cascade issues where Jules creates PRs that trigger more workflows
          REQUEST_JSON=$(jq -n \
            --arg prompt "$PROMPT" \
            --arg source "$SOURCE_ID" \
            '{
              prompt: $prompt,
              sourceContext: {
                source: $source,
                githubRepoContext: {
                  startingBranch: "main"
                }
              }
            }')

          echo "Request: $REQUEST_JSON"

          HTTP_CODE=$(curl -s -o /tmp/session_response.json -w "%{http_code}" -X POST \
            -H "X-Goog-Api-Key: $JULES_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$REQUEST_JSON" \
            "$API_BASE/sessions")

          SESSION_RESPONSE=$(cat /tmp/session_response.json)
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Jules API returned HTTP $HTTP_CODE"
            exit 1
          fi

          SESSION_ID=$(echo "$SESSION_RESPONSE" | jq -r '.name')
          echo "Created session: $SESSION_ID"

          # Poll for completion
          MAX_WAIT=1800
          POLL_INTERVAL=30
          ELAPSED=0

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            SESSION_STATUS=$(curl -sf -H "X-Goog-Api-Key: $JULES_API_KEY" "$API_BASE/$SESSION_ID")
            STATE=$(echo "$SESSION_STATUS" | jq -r '.state')
            echo "Session state: $STATE (elapsed: ${ELAPSED}s)"

            case "$STATE" in
              "COMPLETED"|"SUBMITTED")
                echo "Session completed successfully!"
                break
                ;;
              "FAILED"|"CANCELLED")
                echo "::error::Session $STATE"
                exit 1
                ;;
            esac
            sleep $POLL_INTERVAL
            ELAPSED=$((ELAPSED + POLL_INTERVAL))
          done

      - name: Commit Journal
        uses: stefanzweifel/git-auto-commit-action@04702edda442b2e678b25b537cec683a1493fcb9
        with:
          commit_message: "docs(sentinel): weekly security audit"
          file_pattern: ".jules/sentinel.md"
