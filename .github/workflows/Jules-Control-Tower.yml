name: Jules Control Tower

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, closed]
  workflow_run:
    workflows: ["CI Standard"]
    types: [completed]
  schedule:
    # OVERNIGHT SCHEDULE - Staggered so each cron maps to exactly one worker via routing switch
    # Runs Sun (0) + Thu (4) at unique UTC times  -  matches routing logic in triage job
    - cron: "0 8 * * 0,4" # 08:00 UTC - assessment-generator
    - cron: "30 8 * * 0,4" # 08:30 UTC - code-quality-reviewer
    - cron: "0 9 * * 0,4" # 09:00 UTC - completist
    - cron: "30 9 * * 0,4" # 09:30 UTC - documentation-auditor
    - cron: "30 10 * * 0,4" # 10:30 UTC - sentinel
    - cron: "0 11 * * 0,4" # 11:00 UTC - auto-refactor
    - cron: "30 11 * * 0,4" # 11:30 UTC - issue-resolver
    - cron: "0 12 * * 0,4" # 12:00 UTC - pr-compiler
    - cron: "0 13 * * 0,4" # 13:00 UTC - auto-rebase
  workflow_dispatch:
    inputs:
      target:
        description: "Worker to dispatch (auto uses schedule routing)"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - assessment-generator
          - code-quality-reviewer
          - completist
          - documentation-auditor
          - sentinel
          - auto-refactor
          - auto-rebase
          - issue-resolver
          - pr-compiler

# =============================================================================
# AGENT GOVERNANCE CONFIGURATION
# =============================================================================
# SAFEGUARD: Maximum iterations to prevent infinite repair loops
env:
  AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
  MAX_REPAIR_ITERATIONS: 3
  MAX_ITERATIONS_WINDOW_HOURS: 1
  # Path allowlist: Jules workflows can only modify these paths
  AGENT_ALLOWED_PATHS: "docs/,tests/,src/**/test_*,.github/workflows/"
  # Branch quarantine: Agent output must go to prefixed branches
  AGENT_BRANCH_PREFIX: "jules-auto/"
  # API budget: Max API calls per run (enforced by workers)
  AGENT_MAX_API_CALLS: 50
  # Wall-clock budget: Max minutes per job
  AGENT_MAX_JOB_MINUTES: 30

concurrency:
  group: jules-control-tower-${{ github.repository }}
  cancel-in-progress: true

# HARDENED PERMISSIONS:
# - Scheduled runs: read-only by default
# - Write permissions granted only to specific worker workflows via needs
# - Branch protection and path restrictions enforced at worker level
permissions:
  contents: read
  pull-requests: read
  actions: read
  issues: read
  security-events: read
  checks: read

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"
  triage:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    # Removed global actor check to allow scheduled runs even if file modified by bot
    outputs:
      target: ${{ steps.decide.outputs.target }}
    steps:
      # SAFEGUARD: Check if we've exceeded max repair iterations in the time window
      - name: Check Iteration Limits
        id: check-limits
        if: github.event_name == 'workflow_run' && (github.event.workflow_run && github.event.workflow_run.conclusion) == 'failure'
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          echo "Checking repair iteration limits..."
          BRANCH="${{ (github.event.workflow_run && github.event.workflow_run.head_branch) }}"
          HOURS_AGO=$(date -u -d "${{ env.MAX_ITERATIONS_WINDOW_HOURS }} hours ago" +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -u -v-${{ env.MAX_ITERATIONS_WINDOW_HOURS }}H +%Y-%m-%dT%H:%M:%SZ)

          FAILURE_COUNT=$(gh run list \
            --workflow="CI Standard" \
            --branch="$BRANCH" \
            --limit=20 \
            --json conclusion,createdAt,status \
            --jq "[.[] | select(.conclusion == \"failure\" and .createdAt > \"$HOURS_AGO\")] | length" \
            || echo "0")

          if [ "$FAILURE_COUNT" -ge "${{ env.MAX_REPAIR_ITERATIONS }}" ]; then
            echo "::error::Max repair iterations reached. Manual intervention required."
            echo "exceeded=true" >> $GITHUB_OUTPUT
          else
            echo "exceeded=false" >> $GITHUB_OUTPUT
          fi

      - name: Analyze Event Context
        id: decide
        if: steps.check-limits.outcome == 'skipped' || steps.check-limits.outputs.exceeded != 'true'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const event = context.eventName;
            const actor = context.actor;
            const schedule = context.payload.schedule;
            const manualTarget = context.payload.inputs?.target;
            let target = "none";

            console.log(`Event: ${event}, Actor: ${actor}, Schedule: ${schedule}`);

            // 0. MANUAL DISPATCH - Honor explicit target selection
            if (event === "workflow_dispatch" && manualTarget && manualTarget !== "auto") {
              target = manualTarget;
              console.log(`Manual dispatch: ${target}`);
            }
            // 1. CI FAILURE -> AUTO-REPAIR or HOTFIX-CREATOR
            else if (event === "workflow_run" && context.payload.workflow_run.conclusion === "failure") {
               // Allow bot to trigger repair (handled by check-limits loop protection)
               const failedBranch = context.payload.workflow_run.head_branch;
               if (failedBranch === "main" || failedBranch === "master") {
                  target = "hotfix-creator";
               } else {
                  target = "auto-repair";
               }
            }
            // 2. SCHEDULED RUNS - Route by cron pattern (deterministic) with UTC time fallback
            else if (event === "schedule" || (event === "workflow_dispatch" && (!manualTarget || manualTarget === "auto"))) {
              // Always run schedules regardless of actor
              // Primary: Match exact cron pattern for deterministic routing
              if (schedule) {
                switch (schedule) {
                  case "0 8 */3 * *":
                    target = "assessment-generator";
                    break;
                  case "30 8 */3 * *":
                    target = "code-quality-reviewer";
                    break;
                  case "0 9 */3 * *":
                    target = "completist";
                    break;
                  case "30 9 */3 * *":
                    target = "documentation-auditor";
                    break;
                  case "30 10 */3 * *":
                    target = "sentinel";
                    break;
                  case "0 11 */3 * *":
                    target = "auto-refactor";
                    break;
                  case "30 11 */3 * *":
                    target = "issue-resolver";
                    break;
                  case "0 12 */3 * *":
                    target = "pr-compiler";
                    break;
                  case "0 13 */3 * *":
                    target = "auto-rebase";
                    break;
                  default:
                    target = "none";
                }
              }

              // Fallback: UTC time-based routing (for workflow_dispatch with auto or edge cases)
              if (target === "none") {
                const now = new Date();
                const hour = now.getUTCHours();
                const minute = now.getUTCMinutes();

                if (hour === 8 && minute < 30) {
                  target = "assessment-generator";
                } else if (hour === 8 && minute >= 30) {
                  target = "code-quality-reviewer";
                } else if (hour === 9 && minute < 30) {
                  target = "completist";
                } else if (hour === 9 && minute >= 30) {
                  target = "documentation-auditor";
                } else if (hour === 10 && minute >= 30) {
                  target = "sentinel";
                } else if (hour === 11 && minute < 30) {
                  target = "auto-refactor";
                } else if (hour === 11 && minute >= 30) {
                  target = "issue-resolver";
                } else if (hour === 12) {
                  target = "pr-compiler";
                } else if (hour === 13) {
                  target = "auto-rebase";
                } else {
                  target = "none";
                }
              }
            }
            // 3. PUSH TO MAIN -> DOCS
            else if (event === "push" && context.ref === "refs/heads/main") {
              if (actor === 'jules-bot' || actor === 'jules-ai[bot]') {
                 console.log("Ignoring push by bot to prevent doc-scribe loops.");
                 target = "none";
              } else {
                 target = "doc-scribe";
              }
            }
            // 4. NEW PR -> TEST GENERATOR
            else if (event === "pull_request" && context.payload.action === 'opened') {
               if (actor === 'jules-bot' || actor === 'jules-ai[bot]') {
                  console.log("Ignoring PR open by bot.");
                  target = "none";
               } else {
                  target = "test-generator";
               }
            }
            // 5. PR CLOSED -> ARCHIVIST
            else if (event === "pull_request" && context.payload.action === 'closed' && context.payload.pull_request.merged) {
               target = "archivist";
            }

            console.log(`Decision: Dispatching [${target}]`);
            core.setOutput("target", target);

  # --- WORKER DISPATCH ---

  # =============================================================================
  # WORKER DISPATCH - With branch quarantine and path restrictions
  # =============================================================================
  # All worker workflows receive write permissions via their own permissions blocks
  # This parent workflow only routes and passes context

  call-repair:
    needs: triage
    if: needs.triage.outputs.target == 'auto-repair'
    uses: ./.github/workflows/Jules-Auto-Repair.yml
    with:
      run_id: ${{ format('{0}', (github.event.workflow_run && github.event.workflow_run.id)) }}
      branch: ${{ (github.event.workflow_run && github.event.workflow_run.head_branch) || '' }}
    permissions:
      contents: write
      pull-requests: write
      actions: read
      checks: read
    secrets: inherit

  call-hotfix-creator:
    needs: triage
    if: needs.triage.outputs.target == 'hotfix-creator'
    uses: ./.github/workflows/Jules-Hotfix-Creator.yml
    with:
      run_id: ${{ format('{0}', (github.event.workflow_run && github.event.workflow_run.id)) }}
      failed_branch: ${{ (github.event.workflow_run && github.event.workflow_run.head_branch) || '' }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    secrets: inherit

  call-scribe:
    needs: triage
    if: needs.triage.outputs.target == 'doc-scribe'
    uses: ./.github/workflows/Jules-Documentation-Scribe.yml
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit

  call-tests:
    needs: triage
    if: needs.triage.outputs.target == 'test-generator'
    uses: ./.github/workflows/Jules-Test-Generator.yml
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit

  # call-auto-refactor: archived (was a placeholder stub only) -- issue #2055
  # call-auto-rebase: archived (was a placeholder stub only) -- issue #2055

  call-archivist:
    needs: triage
    if: needs.triage.outputs.target == 'archivist'
    uses: ./.github/workflows/Jules-Archivist.yml
    permissions:
      contents: write
      pull-requests: read
    secrets: inherit

  call-sentinel:
    needs: triage
    if: needs.triage.outputs.target == 'sentinel'
    uses: ./.github/workflows/Jules-Sentinel.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets: inherit

  call-code-quality-reviewer:
    needs: triage
    if: needs.triage.outputs.target == 'code-quality-reviewer'
    uses: ./.github/workflows/Jules-Code-Quality-Reviewer.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets: inherit

  call-assessment-generator:
    needs: triage
    if: needs.triage.outputs.target == 'assessment-generator'
    uses: ./.github/workflows/Jules-Assessment-Generator.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets: inherit

  call-issue-resolver:
    needs: triage
    if: needs.triage.outputs.target == 'issue-resolver'
    uses: ./.github/workflows/Jules-Issue-Resolver.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets: inherit

  call-completist:
    needs: triage
    if: needs.triage.outputs.target == 'completist'
    uses: ./.github/workflows/Jules-Completist.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets: inherit

  call-documentation-auditor:
    needs: triage
    if: needs.triage.outputs.target == 'documentation-auditor'
    uses: ./.github/workflows/Jules-Documentation-Auditor.yml
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets: inherit

  call-pr-compiler:
    needs: triage
    if: needs.triage.outputs.target == 'pr-compiler'
    uses: ./.github/workflows/Jules-PR-Compiler.yml
    permissions:
      contents: write
      pull-requests: write
    secrets: inherit
