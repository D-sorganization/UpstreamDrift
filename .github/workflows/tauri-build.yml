# =============================================================================
# Tauri Desktop Application Build Workflow
# =============================================================================
# Builds the Golf Modeling Suite as a native desktop app using Tauri 2
# Runs on: Pull requests (check only), Releases (build artifacts)
#
# Prerequisites:
# - Rust toolchain
# - Node.js 20+
# - Platform-specific dependencies (see Tauri docs)
# =============================================================================

name: Tauri Build

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/tauri-build.yml"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/tauri-build.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            --jq 'if .runners then [.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length else 0 end' \
            2>/dev/null || echo "0")
          if ! [[ "$ONLINE" =~ ^[0-9]+$ ]]; then
            ONLINE=0
          fi
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online - routing locally"
          else
            echo "::error::No local self-hosted runner available; failing closed"
            exit 1
          fi
  check:
    needs: pick-runner
    name: Check (Rust + TypeScript)
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: TypeScript check
        working-directory: ui
        run: npm run type-check

      - name: Rust format check
        working-directory: ui/src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: ui/src-tauri
        run: cargo clippy -- -D warnings

      - name: Cargo check
        working-directory: ui/src-tauri
        run: cargo check

  # ===========================================================================
  # Build - Full build on main/release
  # ===========================================================================
  build:
    name: Build (${{ matrix.platform }})
    needs: check
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: d-sorg-fleet
            target: x86_64-unknown-linux-gnu
          - platform: [self-hosted, Windows]
            target: x86_64-pc-windows-msvc
          - platform: [self-hosted, macOS]
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'd-sorg-fleet'
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build frontend
        working-directory: ui
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4
        env:
          GITHUB_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        with:
          projectPath: ui

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: golf-modeling-suite-${{ matrix.platform }}
          path: |
            ui/src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
