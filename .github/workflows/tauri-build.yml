# =============================================================================
# Tauri Desktop Application Build Workflow
# =============================================================================
# Builds the Golf Modeling Suite as a native desktop app using Tauri 2
# Runs on: Pull requests (check only), Releases (build artifacts)
#
# Prerequisites:
# - Rust toolchain
# - Node.js 20+
# - Platform-specific dependencies (see Tauri docs)
# =============================================================================

name: Tauri Build

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/tauri-build.yml"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/tauri-build.yml"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          ONLINE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
            --jq '[.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online — routing locally"
          else
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "No self-hosted runner — using self-hosted"
          fi
  # ===========================================================================
  # Check - Fast validation on PRs
  # ===========================================================================
  check:
    needs: pick-runner
    name: Check (Rust + TypeScript)
    runs-on: self-hosted
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Checkout Tools (tools-core dependency)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: D-sorganization/Tools
          path: _tools_dep
          sparse-checkout: |
            rust_core
            Cargo.toml
            rust-toolchain.toml
      - name: Symlink Tools for Cargo path resolution
        run: ln -sfn "$GITHUB_WORKSPACE/_tools_dep" "$GITHUB_WORKSPACE/../Tools"

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          components: rustfmt, clippy

      - name: Install Linux dependencies
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: TypeScript check
        working-directory: ui
        run: npm run type-check

      - name: Rust format check
        working-directory: ui/src-tauri
        run: cargo fmt --check

      - name: Rust clippy
        working-directory: ui/src-tauri
        run: cargo clippy -- -D warnings

      - name: Cargo check
        working-directory: ui/src-tauri
        run: cargo check

  # ===========================================================================
  # Build - Full build on main/release
  # ===========================================================================
  build:
    name: Build (${{ matrix.platform }})
    needs: check
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: d-sorg-fleet
            os-label: linux
            target: x86_64-unknown-linux-gnu
          - platform: d-sorg-fleet
            os-label: windows
            target: x86_64-pc-windows-msvc
          - platform: d-sorg-fleet
            os-label: macos
            target: x86_64-apple-darwin

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Checkout Tools (tools-core dependency)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          repository: D-sorganization/Tools
          path: _tools_dep
          sparse-checkout: |
            rust_core
            Cargo.toml
            rust-toolchain.toml
      - name: Symlink Tools for Cargo path resolution
        run: ln -sfn "$GITHUB_WORKSPACE/_tools_dep" "$GITHUB_WORKSPACE/../Tools"

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.os-label == 'linux'
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build frontend
        working-directory: ui
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5  # v0
        env:
          GITHUB_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        with:
          projectPath: ui

      - name: Upload artifacts
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b  # v4.5.0
        with:
          name: golf-modeling-suite-${{ matrix.os-label }}
          path: |
            ui/src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
