# =============================================================================
# Tauri Desktop Application Build Workflow
# =============================================================================
# Builds the UpstreamDrift desktop app using Tauri 2
# Runs on: Pull requests (check only), Releases (build artifacts)
#
# Prerequisites:
# - Rust toolchain
# - Node.js 20+
# - Platform-specific dependencies (see Tauri docs)
# =============================================================================

name: Tauri Build

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/tauri-build.yml"
      - "src-tauri/**"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "package-lock.json"
  pull_request:
    paths:
      - "ui/**"
      - ".github/workflows/tauri-build.yml"
      - "src-tauri/**"
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "package.json"
      - "pnpm-lock.yaml"
      - "package-lock.json"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"
  check:
    needs: pick-runner
    name: Check (Rust + TypeScript)
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 25
    env:
      CARGO_HOME: ${{ github.workspace }}/.cargo-tauri-check
    steps:
      - name: Increase Git buffers to prevent fetch-pack timeouts
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 1048576000

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          components: rustfmt, clippy

      - name: Verify Rust toolchain
        run: |
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          export PATH="$CARGO_HOME/bin:$PATH"
          command -v rustup
          command -v rustc
          command -v cargo
          rustup --version
          rustc --version
          cargo --version

      # Cache cargo registry, git deps, and ui/src-tauri/target/. Cold Tauri
      # builds compile ~400 crates; warm cache typically cuts time by 60-70%.
      - name: Cache Rust target (check)
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          workspaces: ui/src-tauri -> target
          key: ud-tauri-check-${{ runner.name }}

      - name: Install Linux dependencies
        run: |
          apt_retry() {
            local attempt
            for attempt in 1 2 3; do
              if sudo apt-get -o DPkg::Lock::Timeout=300 -o APT::Get::Lock-Timeout=300 "$@"; then
                return 0
              fi
              echo "apt-get $* failed on attempt $attempt; retrying after lock backoff"
              sleep $((attempt * 20))
            done
            sudo apt-get -o DPkg::Lock::Timeout=300 -o APT::Get::Lock-Timeout=300 "$@"
          }
          apt_retry update
          apt_retry install -y libwebkit2gtk-4.1-dev libappindicator3-dev libdbus-1-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: TypeScript check
        working-directory: ui
        run: npm run type-check

      - name: Rust format check
        working-directory: ui/src-tauri
        run: cargo fmt --check

      - name: Repair Cargo target cache
        working-directory: ui/src-tauri
        run: |
          for crate in golf-modeling-suite tauri tauri-macros tauri-runtime tauri-runtime-wry; do
            cargo clean -p "$crate" || echo "No cached package named $crate to clean."
          done
          cargo fetch --locked

      - name: Rust clippy
        working-directory: ui/src-tauri
        run: cargo clippy -- -D warnings

      - name: Cargo check
        working-directory: ui/src-tauri
        run: cargo check

  # ===========================================================================
  # Build - Full build on main/release
  # ===========================================================================
  build:
    name: Build (${{ matrix.artifact_name }})
    needs: check
    if: github.event_name == 'release' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact_name: linux-x64
            os: linux
            runner: d-sorg-fleet-docker
            target: x86_64-unknown-linux-gnu
          - artifact_name: windows-x64
            os: windows
            runner: [self-hosted, Windows]
            target: x86_64-pc-windows-msvc
          # macOS leg removed: org has no `[self-hosted, macOS]` runners. Jobs
          # with this label queued indefinitely. Re-add when macOS runner
          # capacity is provisioned and macOS becomes an active deliverable.

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      WINDOWS_TAURI_RELEASE_ENABLED: ${{ vars.TAURI_WINDOWS_RELEASE_ENABLED == 'true' && 'true' || 'false' }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup Node.js
        if: matrix.os != 'windows' || env.WINDOWS_TAURI_RELEASE_ENABLED == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Setup Rust (Unix)
        if: matrix.os != 'windows'
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.target }}

      - name: Setup Rust (Windows)
        if: matrix.os == 'windows' && env.WINDOWS_TAURI_RELEASE_ENABLED == 'true'
        shell: pwsh
        env:
          RUST_TARGET: ${{ matrix.target }}
        run: |
          $ErrorActionPreference = "Stop"
          $cargoBin = Join-Path $env:USERPROFILE ".cargo\bin"
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri "https://win.rustup.rs" -OutFile "rustup-init.exe"
            .\rustup-init.exe -y --default-toolchain stable --profile minimal
            $env:PATH = "$cargoBin;$env:PATH"
            $cargoBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          }
          rustup toolchain install stable --profile minimal --target $env:RUST_TARGET
          rustup default stable
          rustup target add $env:RUST_TARGET
          rustup --version
          rustc --version
          cargo --version

      # Per-target Rust cache for release builds. Each platform gets its own
      # cache so the Linux/Windows matrix legs don't trash each other.
      - name: Cache Rust target (build)
        if: matrix.os != 'windows' || env.WINDOWS_TAURI_RELEASE_ENABLED == 'true'
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          workspaces: ui/src-tauri -> target
          key: ud-tauri-build-${{ runner.name }}-${{ matrix.target }}

      - name: Report Windows Tauri release disabled
        if: matrix.os == 'windows' && env.WINDOWS_TAURI_RELEASE_ENABLED != 'true'
        shell: pwsh
        run: |
          Write-Host "::notice::Windows Tauri release packaging is skipped because this self-hosted Windows runner blocks Cargo build-script executables with Application Control (os error 4551). Set repository variable TAURI_WINDOWS_RELEASE_ENABLED=true only after the selected Windows runner policy allows Cargo build scripts."

      - name: Install Linux dependencies
        if: matrix.os == 'linux'
        run: |
          apt_retry() {
            local attempt
            for attempt in 1 2 3; do
              if sudo apt-get -o DPkg::Lock::Timeout=300 -o APT::Get::Lock-Timeout=300 "$@"; then
                return 0
              fi
              echo "apt-get $* failed on attempt $attempt; retrying after lock backoff"
              sleep $((attempt * 20))
            done
            sudo apt-get -o DPkg::Lock::Timeout=300 -o APT::Get::Lock-Timeout=300 "$@"
          }
          apt_retry update
          apt_retry install -y libwebkit2gtk-4.1-dev libappindicator3-dev libdbus-1-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        if: matrix.os != 'windows' || env.WINDOWS_TAURI_RELEASE_ENABLED == 'true'
        working-directory: ui
        run: npm ci

      - name: Build frontend
        if: matrix.os != 'windows' || env.WINDOWS_TAURI_RELEASE_ENABLED == 'true'
        working-directory: ui
        run: npm run build

      - name: Build Tauri app
        if: matrix.os != 'windows' || env.WINDOWS_TAURI_RELEASE_ENABLED == 'true'
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        with:
          projectPath: ui

      - name: Upload artifacts
        if: matrix.os != 'windows' || env.WINDOWS_TAURI_RELEASE_ENABLED == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: golf-modeling-suite-${{ matrix.artifact_name }}
          path: |
            ui/src-tauri/target/release/bundle/**/*
          if-no-files-found: warn
