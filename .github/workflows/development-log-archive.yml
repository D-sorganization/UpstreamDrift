name: Development Log Archive

# Nightly archiver for shipped/abandoned DL-#<issue> rows that finished more
# than ARCHIVE_AFTER_DAYS ago (shared_scripts/development_log_schema.py). Keeps
# docs/development/DEVELOPMENT_LOG.md within the active-entry budget without
# raising caps. Proposes the result on bot/development-log-archive and arms
# auto-merge when there are changes; idempotent when nothing is eligible.

on:
  schedule:
    # ~4 AM America/Los_Angeles: 11:00 UTC during PDT, 12:00 UTC during PST.
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: development-log-archive
  cancel-in-progress: false

jobs:
  archive:
    name: Archive old terminal development-log entries
    runs-on: ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || 'd-sorg-fleet-docker' }}
    timeout-minutes: 10
    steps:
      - name: Generate fleet app token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.JULES_APP_ID }}
          private-key: ${{ secrets.JULES_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Checkout Repository_Management (automerge guard)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: D-sorganization/Repository_Management
          ref: main
          path: .rm-tools
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: scripts

      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Archive terminal development-log entries
        shell: bash
        run: |
          set -euo pipefail
          python3 shared_scripts/development_log.py --repo-root . --archive

      - name: Propose archive as a pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          BRANCH: bot/development-log-archive
          REPO_SLUG: ${{ github.repository }}
          GUARD: .rm-tools/scripts/automerge_guard.py
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          if [ -z "$(git status --porcelain -- docs/development/DEVELOPMENT_LOG.md docs/development/DEVELOPMENT_LOG_ARCHIVE_*.md)" ]; then
            echo "OUTCOME=no archive changes; no PR" >> "$GITHUB_ENV"
            exit 0
          fi
          OWNER="${REPO_SLUG%%/*}"
          PR_NUM=$(gh api "repos/$REPO_SLUG/pulls?state=open&head=$OWNER:$BRANCH" --jq '.[0].number // empty')
          if [ -n "$PR_NUM" ] && ! python3 "$GUARD" "$REPO_SLUG" "$PR_NUM"; then
            echo "::warning::Archive PR #$PR_NUM is held by a reviewer; leaving it untouched."
            echo "OUTCOME=archive PR #$PR_NUM held; not updated" >> "$GITHUB_ENV"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add docs/development/DEVELOPMENT_LOG.md docs/development/DEVELOPMENT_LOG_ARCHIVE_*.md
          git commit -m "chore(devlog): archive shipped development log entries"
          git push --force origin "$BRANCH"
          if [ -z "$PR_NUM" ]; then
            PR_BODY="$(printf 'Generated by development-log-archive.yml: moves terminal development-log entries older than ARCHIVE_AFTER_DAYS into yearly archive files via shared_scripts/development_log.py --archive. Generated content only.\n')"
            PR_NUM=$(gh api "repos/$REPO_SLUG/pulls" -X POST \
              -f title="chore(devlog): archive shipped development log entries" \
              -f head="$BRANCH" -f base=main \
              -f body="$PR_BODY" \
              --jq '.number')
          fi
          if python3 "$GUARD" "$REPO_SLUG" "$PR_NUM" --arm --strategy squash; then
            echo "OUTCOME=archive PR #$PR_NUM, auto-merge armed" >> "$GITHUB_ENV"
          else
            echo "::warning::Auto-merge withheld on PR #$PR_NUM"
            echo "OUTCOME=archive PR #$PR_NUM, auto-merge withheld" >> "$GITHUB_ENV"
          fi

      - name: Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Development Log Archive"
            echo ""
            echo "- **Outcome:** ${OUTCOME:-not reached}"
          } >> "$GITHUB_STEP_SUMMARY"
