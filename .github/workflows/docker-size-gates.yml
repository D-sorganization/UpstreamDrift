name: Docker Size and Health Check

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          ONLINE=$(gh api -H "Accept: application/vnd.github+json" /orgs/${{ github.repository_owner }}/actions/runners --paginate \
            --jq '[.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" =~ ^[0-9]+$ ]] && [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online — routing locally"
          else
            echo "::error::No local self-hosted runner available; failing closed"
            exit 1
          fi
  docker-smoke-and-size:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker Image (runtime)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          load: true # Load image into local docker engine
          tags: upstream-drift:runtime
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify Image Size Budget
        run: |
          # Runtime image budget: slim venv (~1 GB) + src/ models (~650 MB) + base + libs ≈ 4 GB
          MAX_SIZE_MB=4000

          # Get size in bytes
          IMAGE_SIZE_BYTES=$(docker image inspect upstream-drift:runtime --format='{{.Size}}')

          # Convert to MB
          IMAGE_SIZE_MB=$((IMAGE_SIZE_BYTES / 1024 / 1024))

          echo "Image size: ${IMAGE_SIZE_MB} MB"
          echo "Budget: ${MAX_SIZE_MB} MB"

          if [ "$IMAGE_SIZE_MB" -gt "$MAX_SIZE_MB" ]; then
            echo "::error::Image size (${IMAGE_SIZE_MB} MB) exceeds budget (${MAX_SIZE_MB} MB)!"
            exit 1
          else
            echo "Image size is within budget."
          fi

      - name: Run Basic Health Checks
        run: |
          docker run --rm upstream-drift:runtime python -c "import mujoco, numpy, scipy; print('Core physics stack OK')"
          docker run --rm upstream-drift:runtime python -c "import fastapi, uvicorn; print('API server stack OK')"
          docker run --rm upstream-drift:runtime python -c "import pinocchio; print('Pinocchio OK')"
