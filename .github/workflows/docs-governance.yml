name: Docs Governance

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/check_docs_governance.py"
      - "scripts/check_doc_catalog.py"
      - "scripts/check_doc_size_budget.py"
      - "scripts/config/doc_size_budget.json"
      - "tests/scripts/test_doc_governance_checks.py"
      - ".github/workflows/docs-governance.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/check_docs_governance.py"
      - "scripts/check_doc_catalog.py"
      - "scripts/check_doc_size_budget.py"
      - "scripts/config/doc_size_budget.json"
      - "tests/scripts/test_doc_governance_checks.py"
      - ".github/workflows/docs-governance.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet"

  doc-governance:
    name: doc-governance
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - name: Validate documentation governance files
        run: python3 scripts/check_docs_governance.py

      - name: Install test dependencies
        run: python3 -m pip install pytest

      - name: Test documentation governance files
        run: python3 -m pytest tests/scripts/test_doc_governance_checks.py -q

      - name: Validate documentation catalog
        run: python3 scripts/check_doc_catalog.py

      - name: Validate documentation size budget
        run: python3 scripts/check_doc_size_budget.py

      - name: Run documentation governance tests
        run: python3 -m pytest tests/scripts/test_doc_governance_checks.py -q
