name: Jules Test Generator (Worker)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_call:

jobs:
  check-kill-switch:
    timeout-minutes: 30
    runs-on: d-sorg-fleet-docker
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check Jules Kill Switch
        id: check
        run: |
          if [ "${{ vars.JULES_ENABLED }}" = "false" ]; then
            echo "Jules is DISABLED via kill switch."
            echo "enabled=false" >> $GITHUB_OUTPUT
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

  pick-runner:
    needs: check-kill-switch
    if: needs.check-kill-switch.outputs.enabled == 'true'
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"

  test-generator:
    timeout-minutes: 30
    needs: [check-kill-switch, pick-runner]
    if: needs.check-kill-switch.outputs.enabled == 'true'
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with: { fetch-depth: 0 }

      - name: Identify New/Modified Files
        id: files
        run: |
          # Use origin/${{ github.base_ref }}...HEAD if base_ref exists (PR), else HEAD^
          if [ -n "${{ github.base_ref }}" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD^"
          fi

          CHANGED_FILES=$(git diff --name-only $BASE HEAD -- 'src/**/*.py' ':!**/tests/*' ':!**/test_*.py' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No relevant source files changed."
            exit 0
          fi

          # Flatten newlines to commas for the prompt
          FILES_FLAT=$(echo "$CHANGED_FILES" | tr '\n' ', ')
          echo "files=$FILES_FLAT" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24" }
      - run: npm install -g @google/jules

      - name: Generate Tests
        if: steps.files.outputs.files != ''
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          FILES: ${{ steps.files.outputs.files }}
        run: |
          # Request 3 parallel sessions. Jules will try 3 different testing strategies.
          jules remote new \
            --repo ${{ github.repository }} \
            --session "Generate comprehensive pytest unit tests for: [ $FILES ]. Focus on edge cases." \
            --branch ${{ github.ref_name }} \
            --parallel 3