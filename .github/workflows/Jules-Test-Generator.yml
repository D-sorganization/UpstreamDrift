name: Jules Test Generator (Worker)

on:
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          FLEET_MODE: ${{ vars.FLEET_RUNNER_MODE }}
        run: |
          MODE="${FLEET_MODE:-hybrid}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            cloud)
              echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
              echo "Routing to GitHub-hosted (mode=cloud)"
              ;;
            hybrid|*)
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "No idle fleet runners - falling back to GitHub-hosted"
              fi
              ;;
          esac
  generate-tests:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - name: Identify New/Modified Files
        id: files
        run: |
          # Use origin/${{ github.base_ref }}...HEAD if base_ref exists (PR), else HEAD^
          if [ -n "${{ github.base_ref }}" ]; then
            BASE="origin/${{ github.base_ref }}"
          else
            BASE="HEAD^"
          fi

          CHANGED_FILES=$(git diff --name-only $BASE HEAD -- 'src/**/*.py' ':!**/tests/*' ':!**/test_*.py' || true)

          if [ -z "$CHANGED_FILES" ]; then
            echo "No relevant source files changed."
            exit 0
          fi

          # Flatten newlines to commas for the prompt
          FILES_FLAT=$(echo "$CHANGED_FILES" | tr '\n' ', ')
          echo "files=$FILES_FLAT" >> $GITHUB_OUTPUT

      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm install -g @google/jules

      - name: Generate Tests
        if: steps.files.outputs.files != ''
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          FILES: ${{ steps.files.outputs.files }}
        run: |
          # Request 3 parallel sessions. Jules will try 3 different testing strategies.
          jules remote new \
            --repo ${{ github.repository }} \
            --session "Generate comprehensive pytest unit tests for: [ $FILES ]. Focus on edge cases." \
            --branch ${{ github.ref_name }} \
            --parallel 3

