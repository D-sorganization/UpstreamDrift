# spec-check.yml  -  Specification Freshness Enforcement
#
# PURPOSE: Ensures SPEC.md is updated when source files change.
# DEPLOYMENT: Copy this file to .github/workflows/spec-check.yml in each repo.
#
# HOW IT WORKS:
# 1. On pull requests, detects which files changed
# 2. If source files changed but SPEC.md did not, posts a warning
# 3. Blocks merge unless spec-exempt label is applied or SPEC.md is updated
#
# CONFIGURATION: Edit the 'source_patterns' in the Check step to match
# your repo's source directories.

name: Spec Check

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "docs/**"
      - "specs/**"
      - "**/*.md"
      - "src/**"
      - "tests/**"
      - "!.github/**"
permissions:
  contents: read
  pull-requests: write

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || 'd-sorg-fleet-docker' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' && 'ubuntu-latest' || 'd-sorg-fleet-docker' }}" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"
  spec-freshness:
    needs: pick-runner
    name: Verify SPEC.md freshness
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    # Skip if spec-exempt label is applied
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'spec-exempt') }}
    timeout-minutes: 5

    steps:
      - name: Enable long Git paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2

      - name: Check if source files changed without SPEC.md update
        id: check
        shell: bash
        run: |

          # Get the list of changed files in this PR
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
          fi

          echo "Changed files:"
          git diff --name-only "$BASE_SHA" HEAD

          # Source patterns that require a spec update live in
          # scripts/ci/check_spec_freshness.py. A PR that carries only valid
          # change fragments (changes/<issue>-<slug>.md, RM-5 /
          # Repository_Management#1976) passes without editing SPEC.md:
          # collate-changes.yml writes the PR-keyed row after merge.
          python3 scripts/ci/check_spec_freshness.py --base "$BASE_SHA" | tee -a "$GITHUB_OUTPUT"

      - name: Post warning comment
        if: steps.check.outputs.needs_update == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Same policy link the retired inline github-script interpolated.
          SPEC_POLICY_URL: ${{ format('{0}/{1}/blob/main/docs/SPECIFICATION_DRIVEN_DEVELOPMENT_POLICY.md', github.server_url, vars.REPOSITORY_MANAGEMENT_REPOSITORY || format('{0}/Repository_Management', github.repository_owner)) }}
        # Fail-safe reporting (scripts/post_spec_reminder.py): a posting
        # failure prints the diagnostic into this job's log and stays green
        # so the staleness step below deterministically fails the run.
        run: |
          python3 scripts/post_spec_reminder.py \
            --repository "${{ github.repository }}" \
            --issue-number "${{ github.event.pull_request.number }}" \
            --policy-url "$SPEC_POLICY_URL"

      - name: Fail if spec is stale
        # always(): even if the posting step above hard-fails, the finding
        # must still fail the run — a reporting failure never swallows it.
        if: ${{ always() && steps.check.outputs.needs_update == 'true' }}
        shell: bash
        run: |

          echo "::error::Source files changed but SPEC.md was not updated."
          echo "Update SPEC.md, add a change fragment (changes/README.md), or add the 'spec-exempt' label to bypass."
          exit 1

      - name: Spec check passed
        if: steps.check.outputs.needs_update == 'false'
        shell: bash
        run: |

          echo "- Spec check passed."
          if [[ "${{ steps.check.outputs.spec_changed }}" == "true" ]]; then
            echo "   SPEC.md was updated alongside source changes. Good."
          elif [[ "${{ steps.check.outputs.fragment_valid }}" == "true" ]]; then
            echo "   A valid change fragment stands in for the SPEC.md edit."
          elif [[ "${{ steps.check.outputs.source_changed }}" == "false" ]]; then
            echo "   No source files changed  -  spec update not required."
          fi

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
