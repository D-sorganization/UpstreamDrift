name: Vendor Submodule Freshness

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  schedule:
    # Run nightly at 02:00 UTC
    - cron: "0 8 * * 0,4"
  workflow_dispatch:
    inputs:
      auto_bump:
        description: "Automatically open a PR if a submodule is stale?"
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: write
  pull-requests: write

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"
  check-vendor-freshness:
    timeout-minutes: 30
    needs: pick-runner
    name: Check vendor submodule freshness
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    outputs:
      stale: ${{ steps.check.outputs.stale }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: false
          fetch-depth: 0

      - name: Force-clean stale Python tool cache (NVMe runners)
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for cache_root in /opt/runner-tool-cache /home/dieterolson/actions-runners/.shared-tool-cache /home/dieterolson/actions-runners-nvme/.shared-tool-cache; do
            if [ -d "$cache_root/Python" ]; then
              echo "Cleaning $cache_root/Python (pre-setup-python)"
              sudo mv "$cache_root/Python" "$cache_root/Python_stale_$RANDOM" || true
              sudo rm -rf "$cache_root/Python_stale_$RANDOM" || true
            fi
          done
      - name: Set up Python
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Run freshness check
        id: check
        run: |
          python scripts/check_vendor_updates.py --no-network --json > vendor_status.json 2>&1 || true
          cat vendor_status.json
          STALE=$(python -c "
          import json, sys
          data = json.load(open('vendor_status.json'))
          stale = [d for d in data if not d['is_current']]
          print('true' if stale else 'false')
          ")
          echo "stale=$STALE" >> "$GITHUB_OUTPUT"

      - name: Upload status report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: vendor-freshness-report
          path: vendor_status.json
          retention-days: 7

  bump-submodule:
    timeout-minutes: 30
    name: Open bump PR if stale
    needs: [pick-runner, check-vendor-freshness]
    if: >
      needs.check-vendor-freshness.outputs.stale == 'true' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.auto_bump == 'true'))
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
          token: ${{ secrets.RUNNER_CHECK_TOKEN }}
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Update vendor/ud-tools to latest Tools main
        run: |
          git submodule update --remote vendor/ud-tools
          NEW_SHA=$(git -C vendor/ud-tools rev-parse HEAD)
          echo "NEW_SHA=$NEW_SHA" >> "$GITHUB_ENV"

      - name: Check for actual changes
        id: diff
        run: |
          if git diff --quiet HEAD -- vendor/ud-tools; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create bump branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          BRANCH="chore/bump-ud-tools-$(date +%Y%m%d)"
          echo "BRANCH=$BRANCH" >> "$GITHUB_ENV"
          git checkout -b "$BRANCH"
          git add vendor/ud-tools
          SHORT="${NEW_SHA:0:12}"
          git commit -m "chore(vendor): bump ud-tools to ${SHORT}"

      - name: Push branch
        if: steps.diff.outputs.changed == 'true'
        run: git push origin "$BRANCH"

      - name: Open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          SHORT="${NEW_SHA:0:12}"
          gh pr create \
            --title "chore(vendor): bump ud-tools to ${SHORT}" \
            --body "Automated nightly submodule bump from vendor-freshness CI job. Review the Tools CHANGELOG before merging." \
            --label "dependencies" \
            --label "automated"
