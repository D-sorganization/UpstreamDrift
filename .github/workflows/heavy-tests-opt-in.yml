name: Heavy Integration Tests (Opt-In)
# -----------------------------------------------------------------------------
# ISOLATION CONTRACT: This workflow MUST NOT run on standard PR required lanes.
#   - Trigger: manual dispatch OR weekly schedule ONLY
#   - Runner: d-sorg-fleet-docker (or dedicated runner if configured)
#   - Marker: live_simulation (explicitly EXCLUDED from ci-standard.yml)
#
#         If you add a test here, add it there too and vice-versa.
# -----------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      engine:
        description: "Engine lane to test"
        required: false
        default: "all"
        type: choice
        options:
          [
            "all",
            "pinocchio",
            "drake",
            "jaxsim",
            "mujoco",
            "local_embeddings",
            "coverage",
            "auto-mark-dry-run",
          ]
      python_version:
        description: "Python version to test with"
        required: false
        default: "3.11"
        type: choice
        options: ["3.10", "3.11", "3.12"]
  schedule:
    - cron: "0 2 * * 0" # Weekly Sunday 02:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    # Dispatcher placement only. This repo is public, so a hosted runner is
    # free and unmetered; pinning the dispatcher meant every run waited for a
    # self-hosted slot just to decide where to run. The runner it SELECTS is
    # unchanged, so no workload moves off the fleet.
    runs-on:
      ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' &&
      'ubuntu-latest' || 'd-sorg-fleet-docker' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        shell: bash
        env:
          CI_RUNNER_MODE: ${{ vars.CI_RUNNER_MODE }}
          REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        run: |
          if [ "$REPOSITORY_PRIVATE" != "true" ] && [ "${CI_RUNNER_MODE:-auto}" != "local" ]; then
            runner="ubuntu-latest"
          else
            runner="d-sorg-fleet-docker"
          fi
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=$runner" >> "$GITHUB_OUTPUT"
          echo "Selected runner: $runner"
  run-heavy-tests:
    if: ${{ github.event_name != 'workflow_dispatch' || (inputs.engine != 'local_embeddings' && inputs.engine != 'coverage') }}
    needs: pick-runner
    name: Heavy Integration Tests (${{ matrix.engine }})
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 90
    env:
      HEAVY_TEST_SLACK_WEBHOOK: ${{ secrets.HEAVY_TEST_SLACK_WEBHOOK }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: pinocchio
            python-version: "3.11"
            marker: "live_simulation and requires_pinocchio"
            test-path: "tests/heavy_integration"
          - engine: drake
            python-version: "3.12"
            marker: "requires_drake"
            test-path: "tests"
          - engine: jaxsim
            python-version: "3.11"
            marker: "requires_jaxsim"
            test-path: "tests"
          - engine: mujoco
            python-version: "3.11"
            marker: "requires_mujoco and not slow"
            test-path: "tests"

    steps:
      - name: Skip unselected engine lane
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.engine != 'all' && inputs.engine != matrix.engine }}
        run: echo "Skipping ${{ matrix.engine }} because workflow_dispatch selected ${{ inputs.engine }}."

      - name: Checkout repository
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Isolate Python tool cache (prevent shared-cache races)
        if: ${{ runner.os != 'Windows' && (github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine) }}
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - name: Set up Python
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ inputs.python_version || matrix.python-version }}
          cache: pip

      - name: Purge pip cache
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        run: python -m pip cache purge || true
      - name: Install system display dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update -qq
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends \
            xvfb x11-utils mesa-utils \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libdbus-1-3 libxrandr2 libxss1 libxcursor1 libxcomposite1 \
            libasound2-dev libxi6 libxtst6

      - name: Create isolated virtualenv (no shared toolcache pollution)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/heavy-venv"
          echo "$RUNNER_TEMP/heavy-venv/bin" >> "$GITHUB_PATH"

      - name: Install Python dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        timeout-minutes: 20
        run: |
          python -m ensurepip --upgrade || true
          pip install --upgrade pip
          python -m ensurepip --upgrade || true
          if [ -f pyproject.toml ]; then pip install -e ".[dev,test]" || pip install -e .; fi
          python -m ensurepip --upgrade || true
          if [ -f requirements.lock ]; then pip install -r requirements.lock; fi
          python3 scripts/ci/bootstrap_conformance_deps.py
          python -m ensurepip --upgrade || true
          pip install \
            pin \
            pin-pink \
            mujoco \
            mediapipe \
            meshcat \
            pyvista \
            vtk \
            scipy \
            sympy \
            trimesh \
            c3d \
            ezdxf \
            "pytest>=9.0.3,<9.2.0" pytest-cov pytest-timeout pytest-xdist
          # Prevent environment pollution conflict between pytest-recording and pytest-vcr
          pip uninstall -y pytest-vcr pytest-recording || true

      - name: Install reviewed Drake builds (drake lane)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        run: |
          if [ "${{ matrix.engine }}" = "drake" ]; then
            pip install -e ".[drake]"
          fi

      - name: Verify heavy dependencies
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        run: |
          python -c "
          import sys
          deps = ['mujoco', 'pinocchio', 'mediapipe', 'pyvista', 'trimesh', 'scipy', 'sympy', 'ezc3d', 'ezdxf']
          failures = []
          for pkg in deps:
              try:
                  __import__(pkg)
                  print(f'OK {pkg}')
              except ImportError as exc:
                  failures.append(f'{pkg}: {exc}')
                  print(f'FAIL {pkg}: {exc}')
          if failures:
              sys.exit(1)
          "

      - name: Run heavy ${{ matrix.engine }} tests
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine }}
        timeout-minutes: 60
        shell: bash
        run: |
          set -o pipefail
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            pytest \
              -v \
              -m "${{ matrix.marker }}" \
              --timeout=300 \
              --timeout-method=thread \
              --tb=short \
              --no-header \
              -p no:randomly \
              --junit-xml="heavy_test_results_${{ matrix.engine }}.xml" \
              --cov=. \
              --cov-report="xml:heavy_coverage_${{ matrix.engine }}.xml" \
              --cov-report=term-missing \
              "${{ matrix.test-path }}" \
            | tee "heavy_test_output_${{ matrix.engine }}.log"

      - name: Summarize heavy test results
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine) }}
        run: |
          {
            echo "## Heavy Integration Test Report - UpstreamDrift"
            echo ""
            echo "Engine lane: ${{ matrix.engine }}"
            echo "Python version: ${{ inputs.python_version || matrix.python-version }}"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "heavy_test_results_${{ matrix.engine }}.xml" ]; then
            python3 - <<'PYEOF'
          import os
          import xml.etree.ElementTree as ET
          engine = '${{ matrix.engine }}'
          tree = ET.parse(f'heavy_test_results_{engine}.xml')
          root = tree.getroot()
          suite = root.find('.//testsuite') or root
          total = int(suite.get('tests', 0))
          failures = int(suite.get('failures', 0))
          errors = int(suite.get('errors', 0))
          skipped = int(suite.get('skipped', 0))
          passed = total - failures - errors - skipped
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write(f"| Status | Count |\n|--------|-------|\n")
              fh.write(f"| Passed | {passed} |\n")
              fh.write(f"| Failed | {failures} |\n")
              fh.write(f"| Errors | {errors} |\n")
              fh.write(f"| Skipped | {skipped} |\n")
              fh.write(f"| Total | {total} |\n\n")
          PYEOF
          fi
          echo "### Tail of test output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 "heavy_test_output_${{ matrix.engine }}.log" >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload heavy test artifacts
        if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: heavy-test-results-UpstreamDrift-${{ matrix.engine }}-${{ github.run_id }}
          path: |
            heavy_test_results_${{ matrix.engine }}.xml
            heavy_test_output_${{ matrix.engine }}.log
            heavy_coverage_${{ matrix.engine }}.xml
          retention-days: 30

      - name: Notify on failure
        if: ${{ failure() && env.HEAVY_TEST_SLACK_WEBHOOK != '' && (github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == matrix.engine) }}
        run: |
          curl -s -X POST "$HEAVY_TEST_SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"Heavy integration tests failed for UpstreamDrift (${{ matrix.engine }}) on ${GITHUB_REF_NAME}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
  local-embeddings:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.engine == 'local_embeddings' }}
    needs: pick-runner
    name: Pinned offline local embeddings
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 90
    env:
      RUSTUP_HOME: "${{ github.workspace }}/.rustup-home"
      CARGO_HOME: "${{ github.workspace }}/.cargo-home"
    steps:
      - name: Verify supported Linux runner
        run: test "$(uname -s)" = "Linux"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Create isolated local-embedding virtualenv
        shell: bash
        run: |
          venv="$RUNNER_TEMP/local-embedding-venv"
          python -m venv "$venv"
          echo "VIRTUAL_ENV=$venv" >> "$GITHUB_ENV"
          echo "UPSTREAM_DRIFT_MODEL_CACHE=$RUNNER_TEMP/local-embedding-cache-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "$venv/bin" >> "$GITHUB_PATH"
      - name: Install test dependencies and ONNX Runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pytest>=9.0.3,<9.2.0" pytest-asyncio pytest-timeout "onnxruntime==1.24.1" maturin
          python - <<'PY' >> "$GITHUB_ENV"
          import onnxruntime, pathlib
          lib = pathlib.Path(onnxruntime.__file__).parent / "capi" / "libonnxruntime.so.1.24.1"
          if not lib.is_file():
              raise SystemExit(f"Pinned ONNX Runtime library not found: {lib}")
          print(f"ORT_DYLIB_PATH={lib}")
          PY
      - name: Build local-embeddings extension
        working-directory: rust_core/ai_backend
        run: python -m maturin develop --features python,local-embeddings
      - name: Verify offline model-fetch guard with a failing local network probe
        run: cargo test --manifest-path rust_core/ai_backend/Cargo.toml --features local-embeddings local_embed::tests --no-fail-fast
      - name: Prove collection is model-free before provisioning
        shell: bash
        env:
          CI_LOCAL_EMBEDDINGS_EXPECTED: "1"
          UPSTREAM_DRIFT_MODEL_OFFLINE: "1"
        run: |
          mkdir -p "$UPSTREAM_DRIFT_MODEL_CACHE"
          pytest --collect-only -vv -m requires_ort tests/ai/test_rust_rag_pipeline.py | tee local_embedding_collected.txt
          python - <<'PY'
          from pathlib import Path
          ids, test_class = [], ""
          for line in Path("local_embedding_collected.txt").read_text().splitlines():
              line = line.strip()
              if line.startswith("<Class "):
                  test_class = line[7:-1]
              elif line.startswith("<Function "):
                  scope = f"::{test_class}" if test_class else ""
                  ids.append(f"tests/ai/test_rust_rag_pipeline.py{scope}::{line[10:-1]}")
          if not ids:
              raise SystemExit("requires_ort collected zero test cases")
          Path("local_embedding_collected_ids.txt").write_text("\n".join(ids) + "\n")
          print(f"Collected {len(ids)} node IDs before model provisioning")
          PY
      - name: Provision and verify pinned model artifacts
        shell: bash
        run: python scripts/provision_local_embedding_model.py | tee local_embedding_model_receipt.json
      - name: Run local embeddings offline and fail on skips
        env:
          CI_LOCAL_EMBEDDINGS_EXPECTED: "1"
          UPSTREAM_DRIFT_MODEL_OFFLINE: "1"
          http_proxy: http://127.0.0.1:9
          https_proxy: http://127.0.0.1:9
          all_proxy: http://127.0.0.1:9
        run: |
          unset NO_PROXY no_proxy
          pytest -v -m requires_ort --junit-xml=local_embedding_results.xml --no-header tests/ai/test_rust_rag_pipeline.py
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse("local_embedding_results.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root.iter("testsuite"))
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          failures = sum(int(s.get("failures", 0)) for s in suites)
          errors = sum(int(s.get("errors", 0)) for s in suites)
          if total == 0 or skipped or failures or errors:
              raise SystemExit(f"offline lane invalid: tests={total}, skipped={skipped}, failures={failures}, errors={errors}")
          import json, onnxruntime, platform, subprocess, sys
          from pathlib import Path
          collected = Path("local_embedding_collected_ids.txt").read_text().splitlines()
          cases = []
          for case in root.iter("testcase"):
              matches = [nodeid for nodeid in collected if nodeid.endswith(f"::{case.get('name')}")]
              if len(matches) != 1:
                  raise SystemExit(f"JUnit case does not map uniquely to a collected node ID: {case.get('name')}")
              cases.append({"id": matches[0], "result": "passed" if case.find("failure") is None and case.find("error") is None and case.find("skipped") is None else "not-passed"})
          if len(cases) != total:
              raise SystemExit(f"JUnit case count mismatch: {len(cases)} IDs for {total} tests")
          evidence = {
              "source_commit": "${{ github.sha }}",
              "model_receipt": json.loads(Path("local_embedding_model_receipt.json").read_text()),
              "python": sys.version,
              "platform": platform.platform(),
              "onnxruntime": onnxruntime.__version__,
              "rustc": subprocess.check_output(["rustc", "--version"], text=True).strip(),
              "offline": True,
              "model_network_guard": "offline cache miss/corruption probe passed; model download guard active",
              "proxy_sentinel": "127.0.0.1:9",
              "general_egress_isolated": False,
              "collected_ids": collected,
              "executed_count": total,
              "executed_cases": cases,
              "skipped": skipped,
              "failures": failures,
              "errors": errors,
          }
          Path("local_embedding_evidence.json").write_text(json.dumps(evidence, indent=2) + "\n")
          print(f"Offline local-embedding tests passed: {total}")
          PY
      - name: Upload local-embedding evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: local-embedding-offline-evidence-${{ github.run_id }}
          path: |
            local_embedding_collected_ids.txt
            local_embedding_model_receipt.json
            local_embedding_results.xml
            local_embedding_evidence.json
          retention-days: 30

  coverage-shard:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == 'coverage' }}
    needs: pick-runner
    name: Sharded Coverage (${{ matrix.shard }})
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { shard: api, path: src/api, tests: tests/unit/api }
          - {
              shard: shared,
              path: src/shared/python,
              tests: tests/unit/data_io,
            }
          - { shard: engines, path: src/engines, tests: tests/unit/engines }
          - {
              shard: deploy,
              path: src/deployment,
              tests: tests/unit/deployment,
            }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Measure and save coverage shard
        run: |
          pip install --upgrade pip && pip install pytest pytest-cov coverage && pip install -e . --no-deps || true
          mkdir -p .coverage_shards
          COVERAGE_FILE=".coverage_shards/.coverage.${{ matrix.shard }}" \
            python -m pytest "--cov=${{ matrix.path }}" "${{ matrix.tests }}" -q || true
      - name: Upload coverage shard
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: .coverage_shards/.coverage.*
          retention-days: 7

  coverage-combine-ratchet:
    needs: [pick-runner, coverage-shard]
    if: ${{ always() && (github.event_name != 'workflow_dispatch' || inputs.engine == 'all' || inputs.engine == 'coverage') && needs.coverage-shard.result == 'success' }}
    name: Combine Coverage and Ratchet Gate
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Download all coverage shards
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: coverage-shard-*
          path: .coverage_shards
          merge-multiple: true
      - name: Combine coverage and evaluate ratchet
        run: |
          pip install coverage
          cd .coverage_shards && coverage combine && coverage json -o ../coverage.json && cd ..
          python scripts/ci/package_coverage_ratchet.py --coverage-json coverage.json --budget-json scripts/config/mypy_exclusion_budget.json
      - name: Upload combined coverage.json
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-report-${{ github.run_id }}
          path: coverage.json
          retention-days: 14

  suite-marker-auto-mark-dry-run:
    needs: pick-runner
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.engine == 'all' || inputs.engine == 'auto-mark-dry-run')) }}
    name: Suite Marker Auto-Mark Full Migration Dry-Run (issue #14947)
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
      - name: Run full auto-marked dry-run
        shell: bash
        env:
          UD_AUTO_MARK_BY_DIRECTORY: "1"
          UD_AUTO_MARK_INCLUDE_BASELINE: "1"
        run: |
          set +e
          python -m pytest tests/unit -m unit --continue-on-collection-errors || true
      - name: Generate Failure Rollup Summary
        if: always()
        shell: bash
        run: |
          echo "## Suite Marker Auto-Mark Migration Dry-Run Rollup" >> "$GITHUB_STEP_SUMMARY"
          python3 scripts/ci/check_suite_marker_reach.py >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
