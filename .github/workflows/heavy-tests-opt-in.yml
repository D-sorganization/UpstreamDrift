name: Heavy Integration Tests (Opt-In)
# -----------------------------------------------------------------------------
# ISOLATION CONTRACT: This workflow MUST NOT run on standard PR required lanes.
#   - Trigger: manual dispatch OR weekly schedule ONLY
#   - Runner: d-sorg-fleet-docker (or dedicated runner if configured)
#   - Marker: live_simulation (explicitly EXCLUDED from ci-standard.yml)
#
# Parity: mirrors scripts/run_local_heavy_tests.sh exactly.
#         If you add a test here, add it there too and vice-versa.
# -----------------------------------------------------------------------------

on:
  workflow_dispatch:
    inputs:
      python_version:
        description: "Python version to test with"
        required: false
        default: "3.11"
        type: choice
        options: ["3.10", "3.11", "3.12"]
  schedule:
    - cron: "0 2 * * 0" # Weekly Sunday 02:00 UTC

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"
  run-heavy-tests:
    needs: pick-runner
    name: Heavy Integration Tests
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    timeout-minutes: 90
    env:
      HEAVY_TEST_SLACK_WEBHOOK: ${{ secrets.HEAVY_TEST_SLACK_WEBHOOK }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Force-clean stale Python tool cache (NVMe runners)
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for cache_root in /opt/runner-tool-cache /home/dieterolson/actions-runners/.shared-tool-cache /home/dieterolson/actions-runners-nvme/.shared-tool-cache; do
            if [ -d "$cache_root/Python" ]; then
              echo "Cleaning $cache_root/Python (pre-setup-python)"
              sudo mv "$cache_root/Python" "$cache_root/Python_stale_$RANDOM" || true
              sudo rm -rf "$cache_root/Python_stale_$RANDOM" || true
            fi
          done
      - name: Set up Python
        env:
          AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ inputs.python_version || '3.11' }}
          cache: pip

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Install system display dependencies
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=300 update -qq
          sudo apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends \
            xvfb x11-utils mesa-utils \
            libgl1 libegl1 libxkbcommon-x11-0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-xinerama0 \
            libdbus-1-3 libxrandr2 libxss1 libxcursor1 libxcomposite1 \
            libasound2-dev libxi6 libxtst6

      - name: Install Python dependencies
        timeout-minutes: 20
        run: |
          python -m ensurepip --upgrade || true
          pip install --upgrade pip
          python -m ensurepip --upgrade || true
          if [ -f pyproject.toml ]; then pip install -e ".[dev,test]" || pip install -e .; fi
          python -m ensurepip --upgrade || true
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          python -m ensurepip --upgrade || true
          pip install \
            pinocchio \
            pink \
            mujoco \
            mediapipe \
            meshcat \
            pyvista \
            vtk \
            scipy \
            sympy \
            trimesh \
            c3d \
            ezdxf \
            pytest pytest-cov pytest-timeout pytest-xdist
          # Prevent environment pollution conflict between pytest-recording and pytest-vcr
          pip uninstall -y pytest-vcr pytest-recording || true

      - name: Verify heavy dependencies
        run: |
          python -c "
          import sys
          deps = ['mujoco', 'pinocchio', 'mediapipe', 'pyvista', 'trimesh', 'scipy', 'sympy', 'c3d', 'ezdxf']
          failures = []
          for pkg in deps:
              try:
                  __import__(pkg)
                  print(f'OK {pkg}')
              except ImportError as exc:
                  failures.append(f'{pkg}: {exc}')
                  print(f'FAIL {pkg}: {exc}')
          if failures:
              sys.exit(1)
          "

      - name: Run heavy integration tests
        timeout-minutes: 60
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" \
            pytest \
              -v \
              -m "live_simulation" \
              --timeout=300 \
              --timeout-method=thread \
              --tb=short \
              --no-header \
              -p no:randomly \
              --junit-xml=heavy_test_results.xml \
              --cov=. \
              --cov-report=xml:heavy_coverage.xml \
              --cov-report=term-missing \
              tests/heavy_integration/ \
            | tee heavy_test_output.log

      - name: Summarize heavy test results
        if: always()
        run: |
          echo "## Heavy Integration Test Report - UpstreamDrift" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Python version: ${{ inputs.python_version || '3.11' }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if [ -f heavy_test_results.xml ]; then
            python3 - <<'PYEOF'
          import os
          import xml.etree.ElementTree as ET
          tree = ET.parse('heavy_test_results.xml')
          root = tree.getroot()
          suite = root.find('.//testsuite') or root
          total = int(suite.get('tests', 0))
          failures = int(suite.get('failures', 0))
          errors = int(suite.get('errors', 0))
          skipped = int(suite.get('skipped', 0))
          passed = total - failures - errors - skipped
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as fh:
              fh.write(f"| Status | Count |\n|--------|-------|\n")
              fh.write(f"| Passed | {passed} |\n")
              fh.write(f"| Failed | {failures} |\n")
              fh.write(f"| Errors | {errors} |\n")
              fh.write(f"| Skipped | {skipped} |\n")
              fh.write(f"| Total | {total} |\n\n")
          PYEOF
          fi
          echo "### Tail of test output" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -40 heavy_test_output.log >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload heavy test artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: heavy-test-results-UpstreamDrift-${{ github.run_id }}
          path: |
            heavy_test_results.xml
            heavy_test_output.log
            heavy_coverage.xml
          retention-days: 30

      - name: Notify on failure
        if: failure() && env.HEAVY_TEST_SLACK_WEBHOOK != ''
        run: |
          curl -s -X POST "$HEAVY_TEST_SLACK_WEBHOOK" \
            -H 'Content-type: application/json' \
            --data "{\"text\":\"Heavy integration tests failed for UpstreamDrift on ${GITHUB_REF_NAME}. Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}\"}"
