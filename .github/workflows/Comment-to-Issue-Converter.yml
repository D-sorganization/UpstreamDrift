name: Convert Review Comments to Issues

# Converts PR review comments into GitHub Issues with deduplication and bot filtering
# This ensures no feedback is lost and creates a trackable work queue

on:
  # Run when review comments are created on pull requests
  pull_request_review_comment:
    types: [created]
  # Manual trigger to process all open PRs or a specific PR
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Specific PR to process (leave empty for all open PRs)"
        required: false
        type: string
      archive_only:
        description: "Only archive to markdown, do not create issues"
        required: false
        default: false
        type: boolean
      max_issues:
        description: "Maximum issues to create in this run"
        required: false
        default: "5"
        type: string

permissions:
  contents: write
  pull-requests: read
  issues: write

# HARDENING: Prevent concurrent runs and limit frequency
concurrency:
  group: comment-to-issue-${{ github.repository }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # HARDENING: Rate limit - max issues to create per run
  MAX_ISSUES_PER_RUN: 5

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    # Dispatcher placement only. This repo is public, so a hosted runner is
    # free and unmetered; pinning the dispatcher meant every run waited for a
    # self-hosted slot just to decide where to run. The runner it SELECTS is
    # unchanged, so no workload moves off the fleet.
    runs-on:
      ${{ !github.event.repository.private && vars.CI_RUNNER_MODE != 'local' &&
      'ubuntu-latest' || 'd-sorg-fleet-docker' }}
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"
  process-comments:
    timeout-minutes: 30
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    # HARDENING: Skip bot-triggered events to prevent cascades
    if: |
      github.event_name == 'workflow_dispatch' ||
      (!endsWith(github.actor, '[bot]') &&
       github.actor != 'github-actions[bot]' &&
       github.actor != 'dependabot[bot]' &&
       github.actor != 'renovate[bot]' &&
       github.actor != 'jules-bot' &&
       github.actor != 'jules-ai[bot]' &&
       github.actor != 'google-labs-jules' &&
       github.actor != 'chatgpt-codex-connector[bot]' &&
       github.actor != 'copilot-pull-request-reviewer[bot]')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Collect Review Comments
        id: collect
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          mkdir -p .github/review_comments
          mkdir -p docs/review_archive

          # Determine which PRs to process
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.pr_number }}" ]; then
            PR_NUMBERS="${{ inputs.pr_number }}"
          elif [ "${{ github.event_name }}" = "pull_request_review_comment" ]; then
            PR_NUMBERS="${{ github.event.pull_request.number }}"
          else
            # Get all open PRs
            PR_NUMBERS=$(gh pr list --state open --json number -q '.[].number' | tr '\n' ' ')
          fi

          echo "Processing PRs: $PR_NUMBERS"
          echo "pr_numbers=$PR_NUMBERS" >> $GITHUB_OUTPUT

          # Collect comments from each PR
          for PR_NUM in $PR_NUMBERS; do
            echo "Fetching comments for PR #$PR_NUM..."

            # Get PR details
            gh pr view $PR_NUM --json title,author,headRefName,state,body > ".github/review_comments/pr_${PR_NUM}_details.json" 2>/dev/null || continue

            # Get review comments (inline code comments)
            gh api "repos/${{ github.repository }}/pulls/${PR_NUM}/comments" \
              > ".github/review_comments/pr_${PR_NUM}_review_comments.json" || echo "[]" > ".github/review_comments/pr_${PR_NUM}_review_comments.json"

            # Get PR conversation comments
            gh api "repos/${{ github.repository }}/issues/${PR_NUM}/comments" \
              > ".github/review_comments/pr_${PR_NUM}_issue_comments.json" || echo "[]" > ".github/review_comments/pr_${PR_NUM}_issue_comments.json"
          done

      - name: Process and Create Issues
        id: process
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          ARCHIVE_ONLY: ${{ inputs.archive_only || 'false' }}
        run: |
          ARCHIVE_FLAG=""
          if [ "${ARCHIVE_ONLY}" = "true" ]; then
            ARCHIVE_FLAG="--archive-only"
          fi

          python scripts/ci/process_review_comments.py \
            --comments-dir .github/review_comments \
            --archive-dir docs/review_archive \
            --repo "${{ github.repository }}" \
            --max-issues "${{ inputs.max_issues || env.MAX_ISSUES_PER_RUN }}" \
            $ARCHIVE_FLAG

      - name: Commit Archive
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          TARGET_BRANCH: ${{ github.event.pull_request.head.ref || github.head_ref || github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add docs/review_archive/ docs/review_archive/comment_tracking.json || true

          if ! git diff --staged --quiet; then
            git commit -m "docs: archive review comments from PRs"
            git push origin HEAD:"$TARGET_BRANCH"
          else
            echo "No changes to commit"
          fi

      - name: Summary
        run: |
          echo "## Review Comment Processing Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Archived:** ${{ steps.process.outputs.archived_count }} comments" >> $GITHUB_STEP_SUMMARY
          echo "- **Issues Created:** ${{ steps.process.outputs.created_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Bots Skipped:** ${{ steps.process.outputs.bot_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duplicates Skipped:** ${{ steps.process.outputs.duplicate_count }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check \`docs/review_archive/\` for the full archive." >> $GITHUB_STEP_SUMMARY
