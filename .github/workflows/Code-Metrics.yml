name: Code Metrics

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Informational code quality metrics - never fails CI
# Reports complexity (radon) and duplication (jscpd) metrics

on:
  # COST OPTIMIZATION: Schedule removed. This is an informational report - run manually via workflow_dispatch.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"

  complexity-metrics:
    timeout-minutes: 30
    needs: pick-runner
    name: Complexity Analysis (radon)
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Force-clean stale Python tool cache (NVMe runners)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for cache_root in /opt/runner-tool-cache /home/dieterolson/actions-runners/.shared-tool-cache /home/dieterolson/actions-runners-nvme/.shared-tool-cache; do
            if [ -d "$cache_root/Python" ]; then
              echo "Cleaning $cache_root/Python (pre-setup-python)"
              sudo rm -rf "$cache_root/Python"
            fi
          done
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Install Radon
        run: |
          python -m ensurepip --upgrade || true
          pip install radon

      - name: Run Complexity Analysis
        run: |
          echo "## Code Complexity Analysis (Radon)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cyclomatic Complexity (Top 10)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          radon cc src -s -a -nb C | head -20 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

          echo "### Maintainability Index" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          radon mi src -s -nb B | head -20 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

  duplication-metrics:
    timeout-minutes: 30
    needs: pick-runner
    name: Duplication Analysis (jscpd)
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"

      - name: Install jscpd
        run: npm install -g jscpd

      - name: Run Duplication Analysis
        run: |
          echo "## Code Duplication Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Create jscpd config
          cat > .jscpd.json << 'EOF'
          {
            "threshold": 0,
            "reporters": ["console", "json"],
            "ignore": [
              "**/node_modules/**",
              "**/.git/**",
              "**/venv/**",
              "**/.venv/**",
              "**/archive/**",
              "**/legacy/**",
              "**/__pycache__/**",
              "**/*.min.js",
              "**/*.min.css"
            ],
            "format": ["python", "javascript", "typescript", "matlab"],
            "absolute": true,
            "gitignore": true
          }
          EOF

          # Run jscpd and capture output
          jscpd src --output ./jscpd-report 2>&1 || true

          echo "### Duplication Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f "./jscpd-report/jscpd-report.json" ]; then
             echo '```' >> $GITHUB_STEP_SUMMARY
             jscpd src --reporters console | tail -10 >> $GITHUB_STEP_SUMMARY || true
             echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo "No duplication report generated" >> $GITHUB_STEP_SUMMARY
          fi

  summary:
    timeout-minutes: 30
    name: Metrics Summary
    needs: [pick-runner, complexity-metrics, duplication-metrics]
    if: always()
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - name: Final Summary
        run: |
          echo "## Code Metrics Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "This is an **informational report** - it does not block CI." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Recommendations" >> $GITHUB_STEP_SUMMARY
          echo "- **Complexity**: Refactor functions with Grade C or worse" >> $GITHUB_STEP_SUMMARY
          echo "- **Duplication**: Extract common code into shared utilities" >> $GITHUB_STEP_SUMMARY
          echo "- **Maintainability**: Focus on files with MI score below 20" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Generated by Code Metrics workflow*" >> $GITHUB_STEP_SUMMARY
