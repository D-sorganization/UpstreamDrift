name: Auto-Update PRs
on:
  push:
    branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  # -- Dispatcher: route to self-hosted if available --------------------------
  pick-runner:
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            --jq 'if .runners then [.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length else 0 end' \
            2>/dev/null || echo "0")
          if ! [[ "$ONLINE" =~ ^[0-9]+$ ]]; then
            ONLINE=0
          fi
          if [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online - routing locally"
          else
            echo "::error::No local self-hosted runner available; failing closed"
            exit 1
          fi
  update-prs:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - name: Update open PR branches
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const pulls = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              base: 'main',
              per_page: 100,
            });
            for (const pr of pulls.data) {
              if (pr.draft) continue;
              try {
                await github.rest.pulls.updateBranch({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                });
                core.info(`Updated PR #${pr.number}: ${pr.title}`);
              } catch (err) {
                core.warning(`Failed to update PR #${pr.number}: ${err.message}`);
              }
            }
