name: Quality Gate

# Blocking repository-wide Law-of-Demeter quality gate. Existing findings are
# ratcheted in scripts/ci/lod_baseline.txt; new production src/ occurrences
# fail this required quality-gate status.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    name: quality-gate
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 15
    steps:
      - name: Enable long Git paths
        run: git config --global core.longpaths true

      - name: Set git config to workaround HTTP/2 fetch issues
        run: |
          git config --global http.version HTTP/1.1
          git config --global http.postBuffer 524288000

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 10
          fetch-tags: false
          show-progress: false

      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Run repo-wide LOD lint
        shell: bash
        run: |
          python3 scripts/ci/check_lod.py \
            src \
            --baseline scripts/ci/lod_baseline.txt
