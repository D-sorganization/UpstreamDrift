name: Quality Gate

# Advisory quality checks for engine-specific coding standards.
# Currently runs the LOD (Law of Demeter) lint over the pinocchio Python
# package; the check is **advisory** (it prints warnings and never fails the
# build) until issue #4139 is fully landed and we want to start blocking
# regressions.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/engines/physics_engines/pinocchio/python/**"
      - "scripts/ci/check_lod.py"
      - ".github/workflows/quality-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lod-pinocchio:
    name: LOD lint (pinocchio python) — advisory
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 15
    steps:
      - name: Enable long Git paths
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Force-clean stale Python tool cache (NVMe runners)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for cache_root in /opt/runner-tool-cache /home/dieterolson/actions-runners/.shared-tool-cache /home/dieterolson/actions-runners-nvme/.shared-tool-cache; do
            if [ -d "$cache_root/Python" ]; then
              echo "Cleaning $cache_root/Python (pre-setup-python)"
              sudo rm -rf "$cache_root/Python"
            fi
          done
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt

      - name: Purge pip cache
        run: python -m pip cache purge || true
      - name: Run LOD lint (advisory)
        shell: bash
        run: |
          python3 scripts/ci/check_lod.py \
            src/engines/physics_engines/pinocchio/python \
            --advisory
