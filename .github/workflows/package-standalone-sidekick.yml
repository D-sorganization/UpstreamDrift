name: Package Standalone Sidekick

# Builds an sdist + wheel from the exact pinned Tools source, uploads both
# artifacts, and smoke-tests the one wheel selected by the build job.

on:
  pull_request:
    paths:
      - "vendor/ud-tools"
      - "src/shared/python/sidekick/**"
      - "src/__init__.py"
      - "src/launchers/sidekick_extension_overlay.py"
      - "launch_upstream_drift.py"
      - "build_hooks.py"
      - "scripts/config/shared_python_ownership_exceptions.yaml"
      - "pyproject.toml"
      - "sidekick.spec"
      - "scripts/packaging/build_sidekick_binary.py"
      - ".github/workflows/package-standalone-sidekick.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-wheel:
    name: Build sdist + wheel
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 15
    outputs:
      wheel-size-kb: ${{ steps.size.outputs.kb }}
      wheel_filename: ${{ steps.build-dist.outputs.wheel_filename }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false

      # Re-materialize vendor/ud-tools at the pinned SHA with a FULL worktree.
      # `submodules: recursive` adopts whatever clone already sits in the
      # reused runner workspace — including standalone sparse clones left by
      # other jobs — which can yield a partial Tools tree and fail the build
      # hook's pinned-roots check during sdist/wheel builds.
      - name: Fetch pinned Tools packages
        uses: ./.github/actions/fetch-pinned-tools

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: ui
        run: npm ci

      - name: Build frontend
        working-directory: ui
        run: npm run build

      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Purge pip cache
        run: python3 -m pip cache purge
      - name: Install build tools
        run: |
          python3 -m pip install build

      - name: Build sdist + wheel
        id: build-dist
        shell: bash
        run: |
          rm -rf dist
          python3 -m build --sdist --outdir dist/
          python3 -m build --wheel --outdir dist/
          mapfile -t wheels < <(
            find dist -maxdepth 1 -type f -name 'upstream_drift-*.whl' -print
          )
          if ! test "${#wheels[@]}" -eq 1; then
            echo "::error::Expected exactly one upstream_drift wheel; found ${#wheels[@]}"
            printf '  %s\n' "${wheels[@]}"
            exit 1
          fi
          wheel_filename=$(basename "${wheels[0]}")
          echo "wheel_filename=$wheel_filename" >> "$GITHUB_OUTPUT"
          echo "UPSTREAM_DRIFT_WHEEL=${wheels[0]}" >> "$GITHUB_ENV"

      - name: Record wheel size
        id: size
        shell: bash
        run: |
          kb=$(du -k "$UPSTREAM_DRIFT_WHEEL" | cut -f1)
          echo "Wheel: $UPSTREAM_DRIFT_WHEEL  Size: ${kb} kB"
          echo "kb=${kb}" >> "$GITHUB_OUTPUT"
          echo "### Wheel size: ${kb} kB" >> "$GITHUB_STEP_SUMMARY"

      - name: Assert wheel does not contain tests/ docs/ vendor/
        shell: bash
        run: |
          python3 -m zipfile -l "$UPSTREAM_DRIFT_WHEEL" \
            | awk '{print $NF}' > wheel_contents.txt
          if grep -E '^(tests/|docs/|vendor/)' wheel_contents.txt; then
            echo "::error::Wheel contains tests/, docs/, or vendor/ content"
            exit 1
          fi
          echo "Wheel contents look clean."

      - name: Upload artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sidekick-dist
          path: dist/

  smoke-test-wheel:
    name: Smoke-test wheel (Python ${{ matrix.python }})
    needs: build-wheel
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive
          persist-credentials: false
      - name: Isolate Python tool cache (prevent shared-cache races)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          if [ -f /.dockerenv ]; then
            echo "Running inside Docker container. Redirecting tool cache to private temp directory..."
            mkdir -p "$RUNNER_TEMP/hostedtoolcache"
            echo "RUNNER_TOOL_CACHE=$RUNNER_TEMP/hostedtoolcache" >> "$GITHUB_ENV"
          else
            echo "Running directly on host. Sharing tool cache."
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}

      - name: Purge pip cache
        run: python3 -m pip cache purge
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: sidekick-dist
          path: dist/

      - name: Install wheel in clean venv
        shell: bash
        env:
          UPSTREAM_DRIFT_WHEEL: dist/${{ needs.build-wheel.outputs.wheel_filename }}
        run: |
          python3 -m venv .smoke-venv
          .smoke-venv/bin/pip install "$UPSTREAM_DRIFT_WHEEL"

      - name: sidekick --help
        shell: bash
        run: .smoke-venv/bin/sidekick --help

      - name: sidekick run smoke test
        shell: bash
        run: |
          .smoke-venv/bin/sidekick run \
            --calculator wgs_reactor \
            --inputs tests/fixtures/wgs.json \
            --output /tmp/wgs_result.json
          cat /tmp/wgs_result.json
