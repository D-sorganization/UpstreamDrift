name: Jules Conflict Resolver
on:
  workflow_call:

jobs:

  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          FLEET_MODE: ${{ vars.FLEET_RUNNER_MODE }}
        run: |
          MODE="${FLEET_MODE:-hybrid}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            cloud)
              echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
              echo "Routing to GitHub-hosted (mode=cloud)"
              ;;
            hybrid|*)
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "No idle fleet runners - falling back to GitHub-hosted"
              fi
              ;;
          esac
  find-and-fix-conflicts:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    if: github.actor != 'jules-bot'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm install -g @google/jules
      - run: jules auth --token ${{ secrets.JULES_API_KEY }}

      - name: Scan for Conflicted PRs
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          FLEET_MODE: ${{ vars.FLEET_RUNNER_MODE }}
        run: |
          PRS=$(gh pr list --state open --label "auto-fix" --json number --jq '.[].number')

          if [ -z "$PRS" ]; then
            exit 0
          fi

          for PR in $PRS; do
            STATE=$(gh pr view $PR --json mergeable --jq '.mergeable')

            if [ "$STATE" == "CONFLICTING" ]; then
              # FIX: Robustly count comments containing the keyword
              ATTEMPTS=$(gh pr view $PR --json comments --jq '[.comments[] | select(.body | contains("conflict resolution attempt"))] | length')

              # Default to 0 if null/empty
              ATTEMPTS=${ATTEMPTS:-0}

              if [ "$ATTEMPTS" -gt 3 ]; then
                 echo "Too many attempts ($ATTEMPTS) for PR $PR. Skipping."
                 continue
              fi

              jules task fix \
                --pr $PR \
                --prompt "Merge conflict detected. Resolve textual conflicts ONLY.
                1. Merge 'origin/main'.
                2. Do NOT change logic or function signatures.
                3. This is conflict resolution attempt #$((ATTEMPTS+1))."
            fi
          done

