name: Jules Conflict Resolver
on:
  workflow_call:

jobs:
  check-kill-switch:
    runs-on: d-sorg-fleet
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check Jules Kill Switch
        id: check
        run: |
          if [ "${{ vars.JULES_ENABLED }}" = "false" ]; then
            echo "Jules is DISABLED via kill switch."
            echo "enabled=false" >> $GITHUB_OUTPUT
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

  pick-runner:
    needs: check-kill-switch
    if: needs.check-kill-switch.outputs.enabled == 'true'
    runs-on: d-sorg-fleet
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          ONLINE=$(gh api -H "Accept: application/vnd.github+json" /orgs/${{ github.repository_owner }}/actions/runners --paginate \
            --jq 'if .runners then [.runners[] | select(.status == "online") | select(.labels[].name == "d-sorg-fleet")] | length else 0 end' \
            2>/dev/null || echo "0")
          if [[ "$ONLINE" =~ ^[0-9]+$ ]] && [[ "$ONLINE" -gt 0 ]]; then
            echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
            echo "Self-hosted runner online - routing locally"
          else
            echo "::error::No local self-hosted runner available; failing closed"
            exit 1
          fi

  conflict-fix:
    needs: [check-kill-switch, pick-runner]
    if: needs.check-kill-switch.outputs.enabled == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: npm install -g @google/jules
      - run: jules auth --token ${{ secrets.JULES_API_KEY }}

      - name: Scan for Conflicted PRs
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
        run: |
          PRS=$(gh pr list --state open --label "auto-fix" --json number --jq '.[].number')

          if [ -z "$PRS" ]; then
            exit 0
          fi

          for PR in $PRS; do
            STATE=$(gh pr view $PR --json mergeable --jq '.mergeable')

            if [ "$STATE" == "CONFLICTING" ]; then
              # FIX: Robustly count comments containing the keyword
              ATTEMPTS=$(gh pr view $PR --json comments --jq '[.comments[] | select(.body | contains("conflict resolution attempt"))] | length')

              # Default to 0 if null/empty
              ATTEMPTS=${ATTEMPTS:-0}

              if [ "$ATTEMPTS" -gt 3 ]; then
                 echo "Too many attempts ($ATTEMPTS) for PR $PR. Skipping."
                 continue
              fi

              jules task fix \
                --pr $PR \
                --prompt "Merge conflict detected. Resolve textual conflicts ONLY.
                1. Merge 'origin/main'.
                2. Do NOT change logic or function signatures.
                3. This is conflict resolution attempt #$((ATTEMPTS+1))."
            fi
          done

