name: Docker Security Scan

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/docker-security-scan.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements*.txt"
      - "pyproject.toml"
      - ".github/workflows/docker-security-scan.yml"
  schedule:
    # Weekly scan on Sunday at midnight
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: docker-security-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  security-events: write

jobs:
  trivy-scan:
    # Fork PRs never run on the self-hosted fleet (RM#1989).
    if: >-
      (!github.event.pull_request ||
      github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 40
    name: Trivy Container Scan
    runs-on: d-sorg-fleet-docker

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Fetch pinned Tools packages
        # The primary Dockerfile now COPYs vendor/ud-tools (UD #9406).
        uses: ./.github/actions/fetch-pinned-tools

      - name: Rehydrate tracked Dockerfile
        shell: bash
        run: python3 scripts/ci/rehydrate_docker_context.py --targets Dockerfile

      - name: Attach the host's shared BuildKit builder (one layer cache per host, #13208)
        id: buildkit
        # Cache infrastructure never fails a build: any crash means a cold fallback.
        continue-on-error: true
        shell: bash
        run: python3 scripts/ci/shared_buildkit.py ensure --github-output "$GITHUB_OUTPUT"

      - name: Set up a throwaway Buildx builder (fallback when the shared one is unavailable)
        id: buildx-fallback
        if: steps.buildkit.outputs.builder == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069

      - name: Build Docker image
        # --target runtime avoids pulling in the ~10 GB training stage (PyTorch + CUDA)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          load: true
          tags: upstreamdrift:ci
          builder: ${{ steps.buildkit.outputs.builder || steps.buildx-fallback.outputs.name }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "upstreamdrift:ci"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          # SARIF upload remains nonblocking; the table scan below is the
          # blocking HIGH/CRITICAL gate.
          exit-code: "0"
          timeout: "30m0s"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b25d0ebf40e5b63ee81e1bd6e5d2a12b7c2aeb61
        if: success()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Trivy (table output for PR comments)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "upstreamdrift:ci"
          format: "table"
          severity: "CRITICAL,HIGH"
          # Fail the build on actionable HIGH or CRITICAL vulnerabilities.
          # The SARIF upload above still reports unfixed OS findings; this
          # blocking gate ignores CVEs with no fixed package version available.
          exit-code: "1"
          ignore-unfixed: "true"
          vuln-type: "os,library"
          timeout: "30m0s"
