name: Docker Security Scan

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements*.txt"
      - "pyproject.toml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements*.txt"
      - "pyproject.toml"
  schedule:
    # Weekly scan on Sunday at midnight
    - cron: "0 0 * * 0"
  workflow_dispatch:

concurrency:
  group: docker-security-scan-${{ github.ref }}
  cancel-in-progress: true

env:

jobs:
  trivy-scan:
    timeout-minutes: 40
    name: Trivy Container Scan
    runs-on: d-sorg-fleet-docker
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Build Docker image
        # --target runtime avoids pulling in the ~10 GB training stage (PyTorch + CUDA)
        shell: bash
        run: docker build --target runtime -t upstreamdrift:ci .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "upstreamdrift:ci"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"
          # Don't fail the build initially - triage first
          exit-code: "0"
          timeout: "30m0s"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@b25d0ebf40e5b63ee81e1bd6e5d2a12b7c2aeb61
        if: success()
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Trivy (table output for PR comments)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: "upstreamdrift:ci"
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          # Exit with error only on CRITICAL vulnerabilities
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os,library"
          timeout: "30m0s"
