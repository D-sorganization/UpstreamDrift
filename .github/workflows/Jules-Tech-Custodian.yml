name: Jules Tech Debt Custodian
on:
  workflow_call:

jobs:

  # ── Dispatcher: route to self-hosted if available ──────────────────────────
  pick-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Check for self-hosted runner
        id: check
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          FLEET_MODE: ${{ vars.FLEET_RUNNER_MODE }}
        run: |
          MODE="${FLEET_MODE:-hybrid}"
          echo "Fleet mode: $MODE"

          case "$MODE" in
            local)
              echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
              echo "Routing to self-hosted fleet (mode=local)"
              ;;
            cloud)
              echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
              echo "Routing to GitHub-hosted (mode=cloud)"
              ;;
            hybrid|*)
              AVAILABLE=$(gh api /orgs/${{ github.repository_owner }}/actions/runners \
                --jq '[.runners[] | select(.status == "online") | select(.busy == false) | select(.labels[].name == "d-sorg-fleet")] | length' \
                2>/dev/null || echo "0")
              if [[ "$AVAILABLE" -gt 0 ]]; then
                echo "runner=d-sorg-fleet" >> $GITHUB_OUTPUT
                echo "$AVAILABLE idle fleet runner(s) - routing locally"
              else
                echo "runner=ubuntu-latest" >> $GITHUB_OUTPUT
                echo "No idle fleet runners - falling back to GitHub-hosted"
              fi
              ;;
          esac
  refactor-worst-file:
    needs: pick-runner
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with: { python-version: "3.11" }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - run: |
          npm install -g @google/jules
          pip install ruff==0.14.10

      - name: Identify Target File
        id: target
        run: |
          WORST_FILE=$(ruff check . --output-format text --select ALL 2>/dev/null | cut -d: -f1 | sort | uniq -c | sort -nr | head -n1 | awk '{print $2}')
          if [ -z "$WORST_FILE" ]; then
            echo "has_issues=false" >> $GITHUB_OUTPUT
          else
            echo "file=$WORST_FILE" >> $GITHUB_OUTPUT
            echo "has_issues=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Cleanup Branch
        if: steps.target.outputs.has_issues == 'true'
        id: branch # FIX: Added ID so we can output data
        env:
          TARGET: ${{ steps.target.outputs.file }}
        run: |
          BRANCH_NAME="refactor/custodian-$(date +%Y%m%d%H%M%S)-$(basename "$TARGET")"
          git checkout -b $BRANCH_NAME
          git push -u origin $BRANCH_NAME
          # FIX: This output now belongs to step 'branch', not 'target'
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Authenticate Jules
        if: steps.target.outputs.has_issues == 'true'
        run: jules auth --token ${{ secrets.JULES_API_KEY }}

      - name: Dispatch Jules
        if: steps.target.outputs.has_issues == 'true'
        env:
          TARGET: ${{ steps.target.outputs.file }}
          # FIX: Reference the correct step output
          BRANCH: ${{ steps.branch.outputs.branch_name }}
        run: |
          jules task fix \
            --branch $BRANCH \
            --prompt "Refactor '$TARGET' to fix linting errors. Do not change logic."

      - name: Open PR
        if: steps.target.outputs.has_issues == 'true'
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          FLEET_MODE: ${{ vars.FLEET_RUNNER_MODE }}
          BRANCH: ${{ steps.branch.outputs.branch_name }}
          TARGET: ${{ steps.target.outputs.file }}
        run: |
          # 1. Create the PR (Capture the URL)
          PR_URL=$(gh pr create \
            --title "[Jules/Tech-Custodian] chore: weekly refactor of $TARGET" \
            --body "Automated cleanup." \
            --base main \
            --head $BRANCH \
            --label "auto-fix")

          echo "PR Created: $PR_URL"

          # 2. FORCE READY STATE (Fixes Draft Issue)
          # We use || true so it doesn't fail if the PR is already ready
          gh pr ready "$PR_URL" || true

