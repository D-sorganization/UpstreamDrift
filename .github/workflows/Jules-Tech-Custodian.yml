name: Jules Tech Debt Custodian

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_call:

env:
  AGENT_TOOLSDIRECTORY: ${{ runner.temp }}/_tool_cache

jobs:
  check-kill-switch:
    timeout-minutes: 30
    runs-on: d-sorg-fleet-docker
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - name: Check Jules Kill Switch
        id: check
        run: |
          if [ "${{ vars.JULES_ENABLED }}" = "false" ]; then
            echo "Jules is DISABLED via kill switch."
            echo "enabled=false" >> $GITHUB_OUTPUT
          else
            echo "enabled=true" >> $GITHUB_OUTPUT
          fi

  pick-runner:
    needs: check-kill-switch
    if: needs.check-kill-switch.outputs.enabled == 'true'
    runs-on: d-sorg-fleet-docker
    timeout-minutes: 2
    outputs:
      runner: ${{ steps.check.outputs.runner }}
    steps:
      - name: Set runner
        id: check
        run: |
          mkdir -p "$(dirname "$GITHUB_OUTPUT")"
          echo "runner=d-sorg-fleet-docker" >> "$GITHUB_OUTPUT"
          echo "Self-hosted dispatcher selected d-sorg-fleet-docker"

  tech-custodian:
    timeout-minutes: 30
    needs: [check-kill-switch, pick-runner]
    if: needs.check-kill-switch.outputs.enabled == 'true'
    runs-on: ${{ needs.pick-runner.outputs.runner }}
    steps:
      - name: Force-clean stale Python tool cache (NVMe runners)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          for cache_root in /opt/runner-tool-cache /home/dieterolson/actions-runners/.shared-tool-cache /home/dieterolson/actions-runners-nvme/.shared-tool-cache; do
            if [ -d "$cache_root/Python" ]; then
              echo "Cleaning $cache_root/Python (pre-setup-python)"
              sudo mv "$cache_root/Python" "$cache_root/Python_stale_$RANDOM" || true
              sudo rm -rf "$cache_root/Python_stale_$RANDOM" || true
            fi
          done
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            pyproject.toml
            requirements*.txt
      - name: Purge pip cache
        run: python -m pip cache purge || true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with: { node-version: "24" }
      - run: |
          npm install -g @google/jules
          python -m ensurepip --upgrade || true
          pip install ruff==0.14.10

      - name: Identify Target File
        id: target
        run: |
          WORST_FILE=$(ruff check . --output-format text --select ALL 2>/dev/null | cut -d: -f1 | sort | uniq -c | sort -nr | head -n1 | awk '{print $2}')
          if [ -z "$WORST_FILE" ]; then
            echo "has_issues=false" >> $GITHUB_OUTPUT
          else
            echo "file=$WORST_FILE" >> $GITHUB_OUTPUT
            echo "has_issues=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Cleanup Branch
        if: steps.target.outputs.has_issues == 'true'
        id: branch # FIX: Added ID so we can output data
        env:
          TARGET: ${{ steps.target.outputs.file }}
        run: |
          BRANCH_NAME="refactor/custodian-$(date +%Y%m%d%H%M%S)-$(basename "$TARGET")"
          git checkout -b $BRANCH_NAME
          git push -u origin $BRANCH_NAME
          # FIX: This output now belongs to step 'branch', not 'target'
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Authenticate Jules
        if: steps.target.outputs.has_issues == 'true'
        run: jules auth --token ${{ secrets.JULES_API_KEY }}

      - name: Dispatch Jules
        if: steps.target.outputs.has_issues == 'true'
        env:
          TARGET: ${{ steps.target.outputs.file }}
          # FIX: Reference the correct step output
          BRANCH: ${{ steps.branch.outputs.branch_name }}
        run: |
          jules task fix \
            --branch $BRANCH \
            --prompt "Refactor '$TARGET' to fix linting errors. Do not change logic."

      - name: Open PR
        if: steps.target.outputs.has_issues == 'true'
        env:
          GH_TOKEN: ${{ secrets.RUNNER_CHECK_TOKEN }}
          BRANCH: ${{ steps.branch.outputs.branch_name }}
          TARGET: ${{ steps.target.outputs.file }}
        run: |
          # 1. Create the PR (Capture the URL)
          PR_URL=$(gh pr create \
            --title "[Jules/Tech-Custodian] chore: weekly refactor of $TARGET" \
            --body "Automated cleanup." \
            --base main \
            --head $BRANCH \
            --label "auto-fix")

          echo "PR Created: $PR_URL"

          # 2. FORCE READY STATE (Fixes Draft Issue)
          # We use || true so it doesn't fail if the PR is already ready
          gh pr ready "$PR_URL" || true
