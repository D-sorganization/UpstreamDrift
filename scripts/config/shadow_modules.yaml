  # ── ADR-0046 Stage 1 canonical launch-monitor layer — CLEARED 2026-09-02 ──
  #
  # The `launch_monitor` entry that stood here is gone, and this note records
  # how, because it is the first entry in this ledger to be cleared by a move
  # rather than by a port. The Tools#4899-#4907 ladder built the canonical
  # layer at vendor/ud-tools/src/shared/python/launch_monitor/ (ADR-0046
  # Stage 1, pinned by UD#9400), but UpstreamDrift's transitional copy still
  # sat at src/shared/python/launch_monitor/ and won `shared.python.__path__`
  # outright, so the Stage 2 import rewrite ADR-0048 prescribes resolved back
  # to the module it was meant to replace. ADR-0048 "Stage 2 Blocker (G2)"
  # Option 1 moved that copy out of the shared.python namespace to
  # src/tools/launch_monitor_model/ — beside the workbench that consumes it —
  # which is a rename, not a retirement: all thirty modules still exist and
  # UpstreamDrift still runs its own code. What changed is that no UD entry
  # named `launch_monitor` remains under src/shared/python/, so the guard
  # above no longer sees a shadow and `shared.python.launch_monitor` now
  # resolves to the vendored canonical package. The port-up debt itself lives
  # on in ADR-0048's port order (#9348), not here.
