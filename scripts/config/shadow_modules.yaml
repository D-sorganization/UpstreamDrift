# Shadow-module ledger — grandfathered debt, enforced as a no-growth ratchet.
#
# BACKGROUND
# ----------
# Tools (D-sorganization/Tools) is the source of truth for shared modules under
# `src/shared/python/`. UpstreamDrift consumes them through the
# `vendor/ud-tools` submodule. A UD-side module with the same name as a vendor
# module silently *shadows* the vendored copy: imports resolve to the UD copy,
# the two diverge, and work is lost on the next vendor bump.
#
# HOW THIS FILE IS ENFORCED
# -------------------------
# `tests/unit/repo_hygiene/test_no_shadow_of_tools_shared.py` enumerates every
# top-level entry under `vendor/ud-tools/src/shared/python/` and fails if a
# same-named entry exists under `src/shared/python/` and is NOT listed here.
#
# This is a RATCHET, not an amnesty:
#   * Entries may be REMOVED (the shadow was resolved). That is the goal.
#   * Entries may NOT be ADDED without a deliberate policy exception — a new
#     shadow means new divergence and must be justified in review.
#   * Every entry MUST carry a positive-int `tracking_issue` and a parseable
#     ISO `sunset_date`. Once a sunset date passes the guard fails, forcing the
#     shadow to be resolved or the deadline to be renegotiated in the open.
#
# The correct way to clear an entry is to move the canonical implementation
# into Tools, land it there, bump the `vendor/ud-tools` pin, delete the UD-side
# copy, and drop the line below.
#
# HISTORY — why every vendor module is listed
# -------------------------------------------
# The guard and its ledger were introduced 2026-05-16 (UD #5623, PR #5625) and
# hardened the same day (PR #5652). On 2026-08-01 the consolidation commit
# 0575fb4b8 ("chore: consolidate overlapping UpstreamDrift PR backlog", #8322)
# replaced the 28-entry ledger with a bare `allowed_shadows: []`, downgraded
# both hygiene tests to stubs that skip when the submodule is absent, closed
# #5623 as resolved, and in the same commit introduced four NEW shadows. The
# guard therefore never blocked anything. This file restores the ledger and
# records the four regressions explicitly rather than laundering them.
#
# Shadow count is currently 32 of 32 vendor modules. That number is the debt.
# It should only ever go down.

