# buildkitd configuration for the per-host shared builder `ud-buildkit` (#13208).
# Used by scripts/ci/shared_buildkit.py. Requires BuildKit >= 0.17 for the
# reservedSpace / maxUsedSpace / minFreeSpace GC keys (the pre-0.17 byte-count key is deliberately not used).

[worker.oci]
  gc = true

  # Transient build intermediates and source/git snapshots go first.
  [[worker.oci.gcpolicy]]
    filters = ["type==source.local", "type==exec.cachemount", "type==source.git.checkout"]
    keepDuration = "48h"
    maxUsedSpace = "5GB"

  # Everything else: keep the cache within 30 GB, and always leave 20% of the
  # disk free for runner workspaces. reservedSpace is never reclaimed.
  [[worker.oci.gcpolicy]]
    all = true
    reservedSpace = "5GB"
    maxUsedSpace = "30GB"
    minFreeSpace = "20%"
