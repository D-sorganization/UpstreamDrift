# Preset skill families for the personalised strokes-gained stack (SHOW-B2, #14566).
#
# ASSUMPTIONS, NOT MEASUREMENTS. Means follow rounded, publicly reported
# launch-monitor tour averages (club speed and attack angle by club class) and
# the sds are order-of-magnitude choices. They are placeholders until B7
# (#14571) fits families from shot data; nothing here is a fitted or validated
# value. Field order: clubhead_speed_mph, face_angle_deg, club_path_deg,
# attack_angle_deg, toe_mm, high_mm (GCV-15 signs).

correlation:
