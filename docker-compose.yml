# WARNING: LOCAL DEVELOPMENT ONLY
# This compose file is intended for local developer workflows only.
# Policy reference: docker/README.md and docs/adr/0021-container-strategy.md
# Before using in any shared or internet-facing environment:
#   - Change port bindings from 127.0.0.1 to an appropriate reverse-proxy.
#   - Remove or set GOLF_AUTH_DISABLED=false if present in your .env.
#   - Remove --reload from the uvicorn command.
version: "3.8"

# Shared by the three model-explorer services (UpstreamDrift #12878 D). See
# docs/development/DOCKER_SETUP.md ("Model Explorer in Docker").
x-explorer-common: &explorer-common
  build: &explorer-build
    context: .
    dockerfile: Dockerfile.modular
    # Host prune jobs skip images labelled keep (they take 25+ min to rebuild
    # over the ControlTower WAN).
    labels:
      keep: "true"
    args:
      PROFILE: ${EXPLORER_PROFILE:-full}
      # Required by the pinned-Tools provenance check in the image build;
      # scripts/docker/explorer.sh computes them.
      TOOLS_GITLINK_SHA: ${TOOLS_GITLINK_SHA:-}
      TOOLS_SOURCE_SHA256: ${TOOLS_SOURCE_SHA256:-}
  volumes:
    # Read-only models/evidence for --model docs/... ; exports land in ./output.
    - ./docs:/workspace/docs:ro
    - ./shared:/workspace/shared:ro
    - ./output/explorer:/out
  networks:
    - upstream-drift

services:
  # Backend API server with all physics engines
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: upstream-drift:runtime
    container_name: upstream-drift-backend
    ports:
      # Bind to loopback only — not exposed on all host interfaces.
      - "127.0.0.1:8001:8001"
    volumes:
      - .:/workspace:delegated
      - ./data:/workspace/data
    environment:
      - PYTHONPATH=/workspace
      - PATH=/home/golfer/.local/bin:/opt/venv/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      - DATABASE_URL=sqlite:////workspace/golf_modeling_suite.db
      - API_HOST=0.0.0.0
      - API_PORT=8001
      - ENVIRONMENT=development
      - MUJOCO_GL=${MUJOCO_GL:-osmesa}
    # Override the image ENTRYPOINT (the prod uvicorn wrapper, #7129) so this
    # dev `command` with --reload is run directly rather than passed as args.
    entrypoint: []
    command: python3 -m uvicorn src.api.server:app --host 0.0.0.0 --port 8001 --reload
    restart: unless-stopped
    working_dir: /workspace
    healthcheck:
      # Python one-liner (issue #7161 D3) — no curl dependency; python is always
      # present in the venv. Matches the image HEALTHCHECK in Dockerfile.
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/health', timeout=5).status==200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - upstream-drift

  # Frontend UI (optional — can also run locally outside Docker).
  # node_modules are cached in a named volume so `npm install` does not re-run
  # on every `docker compose up`. `npm ci` runs only when the volume is empty
  # (first boot / after `docker compose down -v`) or when package-lock.json is
  # newer than the cached lockfile snapshot (`node_modules/.package-lock.json`),
  # which npm writes after every successful install. This preserves cache hits
  # across restarts and keeps startup fast and offline-capable once populated.
  frontend:
    image: node:20-alpine
    container_name: upstream-drift-frontend
    ports:
      - "127.0.0.1:5180:5180"
    volumes:
      - ./ui:/app:delegated
      # Named volume so npm install is not repeated on every start.
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    command: >-
      sh -c "if [ ! -f node_modules/.package-lock.json ] ||
               [ package-lock.json -nt node_modules/.package-lock.json ]; then
               echo '[frontend] installing dependencies (first boot or lockfile changed)';
               npm ci;
             else
               echo '[frontend] node_modules cache is up-to-date, skipping npm ci';
             fi &&
             npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://backend:8001
    depends_on:
      # Wait for the backend to be HEALTHY, not merely started (issue #7161 D3),
      # so `docker compose up` from cold start brings up a working frontend with
      # no manual retry.
      backend:
        condition: service_healthy
    networks:
      - upstream-drift

  # Training stage for advanced ML workflows
  training:
    build:
      context: .
      dockerfile: Dockerfile
      target: training
    image: upstream-drift:training
    container_name: upstream-drift-training
    volumes:
      - .:/workspace:delegated
      - ./data:/workspace/data
    environment:
      - PYTHONPATH=/workspace
      - MUJOCO_GL=${MUJOCO_GL:-osmesa}
    working_dir: /workspace
    command: /bin/bash
    stdin_open: true
    tty: true
    networks:
      - upstream-drift

  # --- Model Explorer (PyQt6 app + headless export) -------------------------
  # Headless: `docker compose --profile explorer-headless run --rm explorer-headless`
  # exports an MP4 to ./output/explorer with no display (Qt offscreen + EGL).
  explorer-headless:
    <<: *explorer-common
    profiles: ["explorer-headless"]
    build:
      <<: *explorer-build
      target: explorer-headless
    image: upstream-drift:explorer-headless
    container_name: upstream-drift-explorer-headless
    environment:
      - QT_QPA_PLATFORM=offscreen
      - MUJOCO_GL=${MUJOCO_GL:-egl}
    command: >-
      export --model canonical-humanoid --out /out/explorer_headless.mp4
      --duration 2 --fps 30 --width 1280 --height 720

  # GUI over noVNC: `docker compose --profile explorer-gui up explorer-gui`,
  # then open http://localhost:6080/vnc.html . Works from any client machine.
  explorer-gui:
    <<: *explorer-common
    profiles: ["explorer-gui"]
    build:
      <<: *explorer-build
      target: explorer-gui
    image: upstream-drift:explorer-gui
    container_name: upstream-drift-explorer-gui
    ports:
      # Loopback only: the VNC session has no password.
      - "127.0.0.1:6080:6080"
    environment:
      - QT_QPA_PLATFORM=xcb
      - MUJOCO_GL=${MUJOCO_GL:-egl}
      - DISPLAY=:99
      - NOVNC_PORT=6080
      - VNC_PORT=5900
    command: ["gui"]
    shm_size: "1gb"

  # GUI as a native window on the Windows desktop via WSLg (X11 socket
  # passthrough). Requires the Docker daemon to run inside WSL2.
  explorer-gui-wslg:
    <<: *explorer-common
    profiles: ["explorer-gui-wslg"]
    build:
      <<: *explorer-build
      target: explorer-gui
    image: upstream-drift:explorer-gui
    container_name: upstream-drift-explorer-gui-wslg
    volumes:
      - ./docs:/workspace/docs:ro
      - ./shared:/workspace/shared:ro
      - ./output/explorer:/out
      - /tmp/.X11-unix:/tmp/.X11-unix
      - /mnt/wslg:/mnt/wslg
    environment:
      - QT_QPA_PLATFORM=xcb
      - MUJOCO_GL=${MUJOCO_GL:-egl}
      - DISPLAY=${DISPLAY:-:0}
      - UD_EXPLORER_DISPLAY_MODE=host
      - XDG_RUNTIME_DIR=/mnt/wslg/runtime-dir
      - WAYLAND_DISPLAY=wayland-0
    command: ["gui"]
    shm_size: "1gb"

  # --- Images other ControlTower jobs expect (ct-run.sh) ---------------------
  # `build:` as well as `image:`, so a pruned image is rebuilt on demand and never
  # becomes a failed pull. `scripts/docker/explorer.sh ensure` does this for you.
  # ud-sim:latest = the explorer base (all engines + Qt + EGL + ffmpeg); its
  # entrypoint execs any command it is given, so `docker run ud-sim python ...`
  # behaves as before.
  ud-sim:
    <<: *explorer-common
    profiles: ["explorer-images"]
    build:
      <<: *explorer-build
      target: explorer-headless
    image: ud-sim:latest
    container_name: upstream-drift-ud-sim
    environment:
      - QT_QPA_PLATFORM=offscreen
      - MUJOCO_GL=${MUJOCO_GL:-egl}

  upstream-drift-full:
    profiles: ["explorer-images"]
    build:
      <<: *explorer-build
      target: runtime
    image: upstream-drift:full
    container_name: upstream-drift-full
    networks:
      - upstream-drift

networks:
  upstream-drift:
    driver: bridge

volumes:
  # Cached node_modules for the frontend service.  Reset: docker compose down -v
  frontend_node_modules:
