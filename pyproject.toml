# Upstream Drift — pyproject.toml
[project]
name = "upstream-drift"
version = "2.1.1"
description = "Biomechanical golf simulation and analysis suite"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["golf", "biomechanics", "simulation", "physics", "mujoco", "urdf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    # Core (always installed)
    "numpy>=2.0.0",
    "scipy>=1.13.1",
    "fastapi>=0.136.0",
    # Security floor for CVE-2026-48710; FastAPI 0.136+ supports Starlette 1.x.
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.5.0",
    # Typed unified settings (issue #6565). Small dep; config is load-bearing.
    "pydantic-settings>=2.14.2",
    "httpx>=0.27.0",

    # Default physics engine (lightweight, cross-platform)
    "mujoco>=3.6.0,<4.0.0",

    # Safe expression evaluation (replaces eval())
    "simpleeval>=1.0.0",

    # Structured logging (OBS-001: required for observability)
    "structlog>=24.1.0",
    "h5py>=3.0.0",
    "jinja2>=3.1.0",

    # Platform-appropriate config/data directories (replaces .kiro/ — issue #5713)
    "platformdirs>=4.2.0",

    # Runtime security floor constraints documented in issue #3838.
    "pillow>=12.2.0",
    "requests>=2.33.0",
    "python-dotenv>=1.2.2",
    "bokeh>=3.8.2",
    # Transitive via bokeh, which only requires tornado>=6.2. The floor is
    # declared here rather than left to bokeh so it binds on every install
    # path; it previously existed only as a hand-edit in the generated
    # environment.yml, where it constrained conda users alone and was
    # scheduled for deletion by the next `make sync-deps` (#8689).
    "tornado>=6.5.7",

    "flask>=3.1.3",

    # Geospatial projection for sg_optimizer Phase 2 (#6271).
    "pyproj>=3.6.0",

    # Imported at module load by the API server (rate_limit/auth/server), which
    # backs the default web-UI launch path — must be core, not dev-only (#6612).
    "slowapi>=0.1.9",
    "python-multipart>=0.0.31",
    # API auth/database runtime imports (#7125): src.api.database imports
    # SQLAlchemy/Alembic at module load and src.api.auth.security imports
    # bcrypt/JWT/cryptography at module load.
    "alembic>=1.13.0",
    # Alembic imports Mako for migration templates; keep a direct floor so
    # container pip-audit cannot resolve vulnerable transitive releases.
    "Mako>=1.3.12",
    "sqlalchemy>=2.0.0",
    "bcrypt>=4.1.0",
    "PyJWT>=2.13.0",
    "cryptography>=48.0.1",
    "email-validator>=2.0.0",
    # Hardened XML parsing used at module load by src/api/routes/models.py, which
    # is imported by src/api/routes/__init__.py and therefore by every API server
    # start-up. Tiny pure-Python package; must be core, not urdf-extra-only (#8032).
    "defusedxml>=0.7.0",
    # Imported at module load by src/shared/python/data_io/common_utils.py and
    # src/bunkershot3d/kinematics/trajectory.py, both of which sit on the
    # `import src.api.local_server` chain via eager package __init__ re-exports.
    # Too widely used at module scope to make lazy; keep it core (#8032).
    # The `data` extra still adds pandera/pyarrow on top of it.
    "pandas>=2.0.0",
]

[project.optional-dependencies]
# Default extras policy:
#   extras_default = "core"
# The runtime dependencies list above is the canonical core dependency set.
# Optional extras add only tier-specific or feature-specific dependencies.
rust = ["upstream-physics>=0.1.0", "upstream-mocap-preproc>=0.1.0", "upstream-mocap-io>=0.1.0"]
mocap-preproc = ["upstream-mocap-preproc>=0.1.0"]
mocap-io = ["upstream-mocap-io>=0.1.0"]
# C3D read/write at runtime (epic #8390, A3/#8393). ezc3d backs the canonical
# C3DDataReader, the motion_pipeline fallback parser, and the only C3D writer
# (canonical_c3d_exporter); it was previously declared dev-only even though
# runtime modules import it. Consumers keep their guarded imports, so absence
# still degrades gracefully.
c3d = ["ezc3d>=1.5.0,<2.0.0"]
# Upper bounds added per issue #5914 to prevent silent breakage on
# upstream major releases of these physics engines.
drake = ["drake>=1.22.0,<2.0.0"]
# pin-pink is imported by four production modules in the Pinocchio engine
# (dtack/ik, dtack/backends, motion_training) and was declared only in the
# engine's requirements.txt (epic #8390, A4/#8394). Guarded imports keep the
# PINK-free diff_ik fallback (#4138) load-bearing when pink is absent.
pinocchio = ["pin>=2.6.0,<5.0.0", "meshcat>=0.3.0,<1.0.0", "pin-pink>=1.0.0,<5.0.0"]
chrono = ["pychrono>=8.0,<10.0"]
# JaxSim is isolated from all-engines until the Linux Pinocchio/JaxSim
# coexistence gate is proven. The base wheel resolves on Windows with CPU JAX,
# but URDF conversion still requires gz/ign sdformat tooling for follow-up #6648.
jaxsim = ["jaxsim==0.9.0"]
# Offline validation only: Stanford Nimble is a differentiable-physics oracle,
# not a runtime engine dependency. Wheels are uneven across platforms, so keep
# it out of core/all-engines and run tests under the explicit requires_nimble
# marker.
nimble-oracle = ["nimblephysics==0.10.52.2", "torch>=2.0.0"]

# Differentiable MuJoCo rollouts via MJX (MuJoCo on JAX).
mjx = ["mujoco-mjx>=3.6.0", "jax>=0.4.30", "jaxlib>=0.4.30"]

all-engines = ["upstream-drift[drake,pinocchio]"]

# Recorded 3D diagnostics via Rerun (ADR-0027 follow-up, epic #8390 D1/#8405).
# Opt-in: the renderer degrades with an install hint when absent.
visualization = ["rerun-sdk>=0.15.0,<1.0.0"]

# Trajectory optimization backends (epic #8390 B3/#8398). Opt-in: the
# CasADi swing backend degrades with an install hint when absent.
optimal-control = ["casadi>=3.6.0,<4.0.0"]
# Crocoddyl DDP backend (epic #8390 B4/#8399): separate extra because wheel
# coverage is platform-uneven, and PyPI's cmeel-based crocoddyl wheel must
# NOT be mixed with the PyPI pin wheel in one process (bundled libpinocchio
# duplication corrupts derivatives / segfaults). The backend probes the
# binary stack in a subprocess and degrades with conda-forge guidance —
# prefer `conda install -c conda-forge crocoddyl pinocchio`.
crocoddyl = ["crocoddyl>=2.0.0,<4.0.0"]

# Strokes-gained optimizer — GeoJSON I/O requires pyproj for UTM projection.
sg-optimizer = ["pyproj>=3.6.0"]

# Data IO schema validation (issue #6568). pandas moved to core dependencies
# (#8032) — it is a module-level import on the API server's import chain — and
# is repeated here only so the extra stays self-describing. pandera powers the
# additive schema checks in src/shared/python/data_io/_schemas.py. These are
# optional: the loaders import pandera lazily and degrade to structural-only
# checks when it is absent, so this stays out of the hard core dependencies.
# pyarrow powers the Parquet IO in scripts/compact_swing_dataset.py and the
# dataset_tools loaders (hard top-level imports, not lazy), so it ships with
# the data extra rather than being treated as optional.
data = ["pandas>=2.0.0", "pandera>=0.20.0", "pyarrow>=14.0.0"]

# Analysis extras
analysis = ["opencv-python>=4.8.0", "scikit-learn>=1.3.0"]

# Pose estimation and video processing
pose = ["mediapipe>=0.10.33", "opencv-python>=4.8.0", "imageio[ffmpeg]>=2.31.0"]

# Biomechanics engines
biomechanics = ["myosuite>=2.0.0", "opensim>=4.4.0,<5.0.0", "gymnasium>=0.29.0"]
experimental = ["myosuite>=2.0.0", "opensim>=4.4.0,<5.0.0", "gymnasium>=0.29.0"]

# Reinforcement learning (for MyoSuite muscle training)
rl = ["stable-baselines3>=2.0.0", "gymnasium>=0.29.0"]
torch = ["torch>=2.0.0"]

# GPU-accelerated, massively-parallel batched simulation via MuJoCo Warp
# (NVIDIA Warp). OPTIONAL: requires CUDA + an NVIDIA GPU. The suite runs fully
# on CPU (the `ode` and `mujoco` simulation backends) without this extra.
# MuJoCo Warp ships with MuJoCo 3.5+, already satisfied by the core mujoco>=3.6
# pin. MJWarp is alpha/active — keep these bounds tight and review on upgrade
# (see docs/adr/0023-mujoco-warp-backend.md).
warp = ["mujoco-warp>=0.1.0", "warp-lang>=1.3.0"]

# URDF generation tools (from shared Tools repo)
urdf = ["trimesh>=4.11.5", "PyYAML>=6.0.3", "defusedxml>=0.7.0", "robot_descriptions>=1.12.0"]

# Development and testing
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.0.0",
    "pytest-benchmark>=4.0.0",
    "pytest-timeout>=2.0.0",
    "pytest-xdist>=3.0.0",
    "ruff>=0.15.10",
    "mypy>=1.20.1",
    "build",
    # Required for tests that import common_utils and model_explorer
    "pandas>=2.0.0",
    # Required for Parquet IO tests (compact_swing_dataset compactor/loader suites)
    "pyarrow>=14.0.0",
    "defusedxml>=0.7.0",
    # Required for plotting tests
    "matplotlib>=3.10.8",
    # API auth/database packages live in core dependencies (#7125).
    # Required for async tests
    "anyio>=4.0.0",
    "pytest-anyio>=0.0.0",
    # Required for config tests
    "PyYAML>=6.0.3",
    # NOTE: slowapi and python-multipart moved to core [project] dependencies
    # (#6612) — they are runtime imports of the API server, not test-only.
    # Required for async streaming tests
    "pytest-asyncio>=1.3.0",
    # Required for symbolic math in controls tab
    "sympy>=1.12",
    # Required for video/image processing tests
    "opencv-python-headless>=4.13.0.92",
    # Required for C3D motion-capture tests (load_club_target_c3d cluster-marker suite)
    "ezc3d>=1.5.0",
    # Required for property-based testing
    "hypothesis>=6.0.0",
    # Database migration tooling lives in core dependencies (#7125).
    # Type stubs for untyped third-party packages (GH2034)
    "types-PyYAML>=6.0",
    "scipy-stubs>=1.13.0",
    # Required for URDF schema validation tests (issue #4597)
    "lxml>=5.0.0",
]

# GUI testing (requires PyQt6)
gui-test = [
    "PyQt6>=6.5.0",
    "pytest-qt>=4.2.0",
]

# Desktop GUI tools (model_explorer, video_analyzer, data_explorer,
# starting_pose_matcher, motion_capture_plotter).  Install with::
#
#     pip install upstream-drift[gui-tools]
#
# These are the runtime deps the desktop tile-launcher needs to actually
# launch any tile.  Kept separate from `gui-test` so unit-only CI runs
# don't pull pytest-qt.
gui-tools = [
    "PyQt6>=6.5.0",
    "matplotlib>=3.10.8",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",   # required by pandas.read_excel for .xlsx
    "pywinpty>=2.0; platform_system == 'Windows'", # required for Sidekick Terminal PTY support
]

# Body-part visualisation: optional GPU-accelerated renderer (pyqtgraph.opengl).
# Install when the matplotlib backend's per-frame budget is exceeded
# (typically: > 30 segments × > 1000 vertices each).
body-part-viz-gl = [
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
    "matplotlib>=3.10.8",  # required by _hex_or_name_to_rgba in PyQtGLRenderer
]

# Everything
all = ["upstream-drift[rust,all-engines,analysis,pose,biomechanics,rl,urdf,dev]"]

[project.scripts]
# Point at the canonical launcher rather than the deprecated launch_golf_suite
# shim: the shim emits a DeprecationWarning telling the user to "use the
# upstream-drift console script", which is what they just ran (#8031).
upstream-drift = "launch_upstream_drift:main"
# Expose the canonical Tools-owned standalone Sidekick from this product wheel.
# build_hooks.py requires the exact Tools gitlink and assembles parent modules
# before the UpstreamDrift-owned extensions classified in the ownership manifest.
sidekick = "sidekick.__main__:main"

[project.entry-points."upstream_drift.engines"]
# Third-party engines register here via pyproject.toml:
# [project.entry-points."upstream_drift.engines"]
# my_engine = "my_package:get_engine_plugin"

[project.entry-points."upstream_drift.embeddable_tools"]
model_explorer = "src.tools.model_explorer._embed_adapter"
data_explorer = "data_explorer._embed_adapter"
starting_pose_matcher = "src.tools.starting_pose_matcher._embed_adapter"
training_controller = "src.tools.training_controller._embed_adapter"
config_setup_wizard = "src.tools.config_setup_wizard._embed_adapter"
pose_subscriber_demo = "src.tools.pose_subscriber_demo._embed_adapter"
canonical_core = "src.tools.canonical_core._embed_adapter"
sidekick = "src.tools.sidekick._embed_adapter"
pose_studio = "src.tools.pose_studio.gui"
video_analyzer = "src.tools.video_analyzer._embed_adapter"
ball_flight_gui = "src.tools.ball_flight_gui._embed_adapter"
bunker_shot_gui = "src.tools.bunker_shot_gui._embed_adapter"
putting_green_gui = "src.tools.putting_green_gui._embed_adapter"
golf_environment = "src.tools.golf_environment._embed_adapter"
terrain_engine = "src.tools.terrain_engine._embed_adapter"
golf_simulation_suite = "src.tools.golf_simulation_suite._embed_adapter"
simulation_backends_launcher = "src.tools.simulation_backends_launcher._embed_adapter"
simscape_3d_golf_model = "engines.Simscape_Multibody_Models.3D_Golf_Model.python.src.apps._embed_adapter"

[project.urls]
Homepage = "https://github.com/D-sorganization/UpstreamDrift"
Documentation = "https://upstream-drift.readthedocs.io"
Repository = "https://github.com/D-sorganization/UpstreamDrift"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# Include pre-built UI in the wheel. Canonical Sidekick sources are assembled
# from the exact Tools gitlink by build_hooks.py; vendor/ itself is not shipped.
# docs/, tests/, and vendor/ are NOT listed here and are therefore excluded.
include = [
    "src/**/*",
    "ui/dist/**/*",  # Bundled web UI (built by build_hooks.py); sdist only —
                     # the wheel gets ui/dist via build_hooks.py force_include
                     # because `packages = ["src"]` makes this list inert (#8018).
    "launch_golf_suite.py",
    "launch_upstream_drift.py",
    "build_hooks.py",
]
exclude = [
    "src/**/__pycache__/**",
    "src/**/test_*.py",
    "src/**/tests/**",
]
artifacts = [
    "ui/dist/**/*",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src",
]

[tool.hatch.build.targets.wheel.force-include]
# NOTE: src/shared/python/sidekick -> sidekick is force-included per file by
# build_hooks.py. A whole-directory entry here bypasses the `exclude` patterns
# above (hatchling never applies them to forced files) and shipped the entire
# sidekick test suite in every wheel (#8018).
"launch_golf_suite.py" = "launch_golf_suite.py"
# launch_golf_suite.py does `from launch_upstream_drift import ...` at module
# load, so shipping only the shim leaves the console script dead (#8031).
"launch_upstream_drift.py" = "launch_upstream_drift.py"
# NOTE: ui/dist is force-included dynamically by build_hooks.py, not here — a
# static entry would hard-fail the build whenever the frontend is not built.


[tool.hatch.build.hooks.custom]
# Build UI before packaging
path = "build_hooks.py"

[tool.ruff]
src = ["src"]
line-length = 88
target-version = "py310"
# force-exclude ensures glob patterns are honoured even when files are passed explicitly.
force-exclude = true
# Exclude third-party model files (legacy Python 2 scripts from OpenSim).
# Also exclude PSA analysis notebooks: interactive Jupyter cells use print() by design.
exclude = [
    "src/shared/models/opensim/opensim-models/**",
    "shared/models/opensim/opensim-models/**",
    "shared/models/myosuite/**",
    "src/shared/models/myosuite/**",
    "vendor/**",
    "src/shared/python/sidekick/process_calculators/psa_package/**/*.ipynb",
    "src/shared/python/sidekick/process_calculators/psa_package/*.ipynb",
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "T201", "SIM",  # existing rules
    "C4",    # unnecessary comprehensions / list/dict/set calls
    "PIE",   # misc flake8-pie improvements
    "PLE",   # pylint errors
    "FURB",  # refurb modernization suggestions
    "RSE",   # raise statement best practices
    "LOG",   # logging best practices
    "PERF",  # performance anti-patterns
    "RET",   # return statement cleanup
    "BLE",   # blind except (broad-exception-caught)
    "C90",   # mccabe cyclomatic complexity
]

ignore = [
    "E501",    # line too long (handled by formatter)
    "B008",    # function call in default arg (FastAPI Depends)
    "RET504",  # unnecessary assign before return (often clearer)
    "PERF203", # try-except in loop (unavoidable in some patterns)
    "PERF401", # manual list comprehension (often clearer as explicit loop)
]

# extend-ignore: rules NOT promoted to enforcement yet.
# - C901 (mccabe complexity) — tracked separately; many existing functions
#   exceed the budget and a global enforcement would block all PRs.
# - E402 (module-level import not at top) — common in conditional imports
#   guarded by `if sys.platform == ...`.
# - I001 (import-block-unsorted) — re-export blocks in __init__.py legitimately
#   group by source package rather than alphabetically.
# - SIM118 (key-in-dict-keys) — pandas Index types break the suggested rewrite.
#
# Previously suppressed but now ENFORCED (issue #5911):
# - BLE001 (blind-except), F841 (unused-variable), F401 (unused-import).
#   Pre-existing instances are annotated with file-local `# noqa: <code>`;
#   new violations must use src/shared/python/core/process_safety.narrow_catch
#   or supply a justified `# noqa: BLE001 - <reason>` comment. Enforced via
#   scripts/ci/check_error_handling_ratchet.py (issue #5911 / epic #5907).
extend-ignore = ["C901", "E402", "I001", "SIM118"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["T201"]
"tests/**" = ["T201"]
"examples/**" = ["T201"]
# Runnable docs examples are CLI-style scripts: stdout is how they report results.
"docs/examples/**" = ["T201"]
"tests/unit/test_calc_backend_protocols.py" = ["I"]
# Codemap CLI / watcher / MCP server: stdout is the contract.
"src/shared/python/codemap/cli.py" = ["T201"]
"src/shared/python/codemap/watcher.py" = ["T201"]
"src/shared/python/codemap/mcp_server.py" = ["T201"]
# programmatic_pid CLI: generate-pid command intentionally writes to stdout as a command-line tool.
"src/shared/python/programmatic_pid/cli.py" = ["T201"]


[tool.mypy]
python_version = "3.11"
mypy_path = "stubs"
namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
# Exclude directories with invalid Python package names, third-party models,
# and modules pending type annotation improvements (tracked for future cleanup)
exclude = [
    "src/shared/python/sidekick/",
    "src/engines/Simscape_Multibody_Models/2D_Golf_Model",
    "src/engines/Simscape_Multibody_Models/3D_Golf_Model",
    "vendor/",
    "shared/models/",
    "src/shared/models/",
    # Pending type annotation cleanup (consolidated PR 2026-01-31)
    "src/shared/python/plotting/",
    "src/shared/python/ui/qt/widgets/",
    "src/launchers/",
    # Additional directories with complex typing issues (pre-existing)
    "src/shared/python/pose_editor/",
    "src/shared/python/ai/gui/",
    "src/engines/physics_engines/pinocchio/python/pinocchio_golf/pose_editor_tab.py",
    "src/engines/physics_engines/drake/python/src/pose_editor_tab.py",
    "src/shared/python/pose_estimation/",
    "src/shared/python/ui/adapters/",
    "src/shared/python/ui/",
    # Mixin-based decomposition files (attr-defined false positives)
    "src/engines/physics_engines/drake/python/src/",
    "src/engines/physics_engines/mujoco/python/humanoid_launcher_analysis.py",
    "src/engines/physics_engines/mujoco/python/humanoid_launcher_sim.py",
    "src/engines/physics_engines/mujoco/python/humanoid_launcher_ui.py",
    # Test stubs with pre-existing issues
    "src/engines/physics_engines/drake/python/tests/",
    # Root/example scripts use runtime src. prefixed imports
    "installer/",
    "start_api_server.py",
    "setup_golf_suite.py",
    # numpy-stubs version divergence on self-hosted vs GitHub-hosted runners
    # These files have pre-existing type issues exposed by numpy>=2.0 stubs

    "src/shared/python/perturbation/statistics.py",
    "src/shared/python/model_generation/core/physics_validation.py",
    "src/shared/python/model_generation/core/constants.py",
    "src/learning/imitation/dataset.py",
    "src/engines/physics_engines/mujoco/docker/",
    "src/deployment/realtime/controller.py",
    "src/shared/python/pendulum_simulator/simulation.py",
    "src/shared/python/club_data/targets.py",
    "src/shared/python/data_io/marker_mapping.py",
    "src/shared/python/signal_toolkit/",
    "src/shared/python/engine_core/checkpoint.py",
    "src/shared/python/data_io/export.py",
    "src/engines/common/export.py",
    "src/api/routes/putting_green.py",
    "src/api/routes/physics.py",
    "src/api/routes/analysis_tools.py",
    # numpy-stubs floating/signedinteger type-narrowing divergence (mypy 1.20.1 + numpy 2.2.x)
    # These files surface new type errors on runners with numpy 2.2.x stubs but pass
    # on runners with numpy 2.3.x stubs. Excluded until numpy stubs stabilise across runners.

    "src/deployment/digital_twin/twin.py",
    "src/shared/python/analysis/nonlinear_dynamics.py",
    "src/shared/python/optimization/swing_optimizer.py",
    "src/research/deformable/objects.py",
]

[[tool.mypy.overrides]]
module = "src.shared.python.spatial_algebra.*"
disallow_untyped_defs = true
warn_return_any = true
disable_error_code = ["arg-type", "no-any-return"]

[[tool.mypy.overrides]]
module = "src.shared.python.physics.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "src.engines.common.*"
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "signal_toolkit",
    "signal_toolkit.*",
    "src.shared.python.signal_toolkit",
    "src.shared.python.signal_toolkit.*",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "src.shared.python.gui_pkg.draggable_tabs"
follow_imports = "silent"

[[tool.mypy.overrides]]
module = [
    "src.shared.python.gui_pkg.plotting_utils",
    "src.shared.python.ui.auto_complete",
    "src.shared.python.ui.preferences_dialog",
    "src.shared.python.validation_pkg.comparative_plotting",
]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = "src.api.*"
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = [
    "tifffile",
    "tifffile.*",
]
follow_imports = "skip"

[tool.pytest.ini_options]
# Consolidated pytest configuration (replaces duplicate pytest.ini files)
# Default pytest must collect repository-level tests and intentional colocated
# package tests under src/**/tests (#7126). Keep this explicit rather than
# recursing all of src, which also contains engines, MATLAB bridges, and
# generated assets.
testpaths = [
    "tests",
    "src/engines/lower_body_model/tests",
    "src/engines/physics_engines/mujoco/python/mujoco_humanoid_golf/tests/unit",
    "src/engines/physics_engines/tests",
    "src/engines/Simscape_Multibody_Models/3D_Golf_Model/matlab/motion_matching/option4_python_bridge/tests",
    "src/shared/python/ai/tests",
    "src/shared/python/calc_backend/tests",
    "src/shared/python/chat/tests",
    "src/shared/python/data_processing/tests",
    "src/shared/python/humanoid_character_builder/tests",
    "src/shared/python/model_generation/tests",
    "src/shared/python/movement_optimizer/tests",
    "src/shared/python/notes",
    "src/shared/python/plot_engine/tests",
    "src/shared/python/plot_theme/tests",
    "src/shared/python/programmatic_pid/tests",
    "src/shared/python/sidekick/process_calculators/scrubber/tests",
    "src/shared/python/sidekick/tests",
    "src/shared/python/signal_toolkit/tests",
    # "vendor/ud-tools/src/shared/python/tests",
]
pythonpath = [
    "vendor/ud-tools/src/shared/python",
    "vendor/ud-tools/src/python/src",
    "vendor/ud-tools/src",
    ".",
    "src",
    "src/shared/python",
    "src/tools",
    "src/engines/physics_engines/mujoco/python",
    "src/engines/pendulum_models/python",
    "src/engines/Simscape_Multibody_Models/3D_Golf_Model/matlab/src",
    "tests/fixtures",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-ra -q --strict-markers --strict-config --durations=20 -m \"not slow and not live_simulation and not e2e and not requires_network and not requires_mocap_fixtures\""
asyncio_mode = "auto"
timeout = 60
timeout_method = "thread"
# Prevent ImportPathMismatchError from conftest.py files in engine subdirectories
norecursedirs = [
    "archive",
    "legacy",
    "node_modules",
    "vendor",
    ".git",
    "*.egg-info",
]
markers = [
    "live_simulation: tests requiring live physics/math engines",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "parity: cross-implementation parity and contract checks (engine-vs-engine and Python-vs-Rust equivalence); run in a dedicated parity CI lane",
    "e2e: full-stack smoke tests; nightly + release gate only",
    "gate: production validation gate",
    "core_only: tests that must pass in a default install with no optional engine extras",
    "requires_gl: Tests needing OpenGL/moderngl or a display",
    "headless_safe: marks tests verified to work in headless mode",
    "slow_numba: Tests that require numba JIT or are heavy",
    "asyncio: marks tests as async tests",
    "benchmark: marks tests as performance benchmarks",
    "perf: marks fast microbenchmarks (e.g. >= 60 fps targets); excluded from default CI run",
    "serial: marks tests that must not run in parallel (sys.modules manipulation)",
    "requires_network: marks tests that require network access (skip with '-m not requires_network')",
    "requires_gpu: marks tests that require a GPU (skip with '-m not requires_gpu')",
    "smoke: release-blocking smoke tests for built production artifacts",
    "requires_matlab: tests that require the MATLAB Engine for Python (alias of live_simulation for the Simscape adapter)",
    "requires_pinocchio: tests that require the optional pinocchio engine extra (skip with '-m \"not requires_pinocchio\"')",
    "requires_drake: tests that require pydrake (skipped unless the heavy Drake stack is installed)",
    "requires_mujoco: tests that require the mujoco Python bindings (skipped when `import mujoco` fails)",
    "requires_myosuite: tests that require the myosuite (and mujoco) Python wheels (skipped when `import myosuite` fails)",
    "requires_opensim: tests that require the OpenSim Python bindings (skipped when `import opensim` fails)",
    "requires_jaxsim: tests that require the optional JaxSim/JAX stack (skipped when `import jaxsim` fails)",
    "requires_nimble: offline Nimble gradient-oracle tests (skipped when `import nimblephysics` fails)",
    "requires_rerun: tests that require the optional rerun-sdk visualization stack (skipped when `import rerun` fails)",
    "requires_casadi: tests that require the optional casadi stack (skipped when `import casadi` fails)",
    "requires_crocoddyl: tests that require the optional crocoddyl stack (skipped when `import crocoddyl` fails)",
    "requires_sdformat: tests that require gz/ign/sdf sdformat CLI tooling (skipped when executables are absent)",
    "requires_matlab_engine: tests that require matlab.engine importable (Option 4 bridge)",
    "requires_torch: tests that require PyTorch importable (skipped via importorskip when missing)",
    "requires_real_dataset: tests that require the 9 GB raw Simscape parquet on disk (skipped if absent)",
    "requires_mocap_fixtures: tests that require body-marker mocap fixtures (Rajagopal2015 muscle CMC, post-MVP per #4296; loud-fail or skip when absent)",
    "requires_ort: tests that require the ONNX Runtime + cached MiniLM model (skip when ai_backend was built without `local-embeddings` or the model isn't downloaded)",
    "motion_pipeline: tests for the motion capture pipeline (sources, IK, matching, orchestrator)",
    "makehuman: tests that exercise the MakeHuman mesh backend (skip without MakeHuman installed)",
    "smplx: tests that exercise the SMPL-X mesh backend (skip without SMPL-X model files)",
    "scientific: marks tests that verify numerical accuracy of physics/biomechanics computations against known reference data",
    "ui: PyQt6 widget/layout tests that assert on rendered UI structure (see docs/testing/testing-guide.md)",
    "gui: alias of `ui` retained for the vendored Sidekick suites; prefer `ui` in new tests",
    "contract: API/behaviour contract tests for a module's published surface",
    "security: security-posture tests (secret scanning, auth hardening)",
    "validates_physics: tests that check computed physics against an analytic or published ground truth",
]
filterwarnings = [
    # Suppress hppfcl→coal rename noise (third-party, not actionable in this repo)
    "ignore:Please update your 'hppfcl' imports to 'coal':DeprecationWarning:hppfcl",
]

# ---------------------------------------------------------------------------
# Coverage configuration (pytest-cov / coverage.py)
# Run with:  pytest --cov   (flags are NOT baked into addopts so that plain
#            pytest still works without the coverage plugin installed)
# ---------------------------------------------------------------------------

[tool.coverage.run]
source = ["src", "shared"]
branch = true
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/vendor/*",
    "*/archive/*",
    "*/legacy/*",
    "*/node_modules/*",
    "*/migrations/*",
    "*/conftest.py",
    # Third-party / vendored model files
    "src/shared/models/opensim/opensim-models/*",
    "src/shared/models/myosuite/*",
]

[tool.coverage.report]
# Coverage threshold — enforced in CI and locally when running with --cov.
# Per-package coverage ratchets for production-critical surfaces are tracked
# in scripts/config/mypy_exclusion_budget.json (#3912).
#
# Coverage floors by risk tier (issue #3939):
#   - 85% for API routes, engine adapters, task management (production-critical)
#   - 70% for shared utilities, services (important but lower risk)
#   - 75% overall floor (raised from 65% per issue #4929)
fail_under = 75
show_missing = true
skip_empty = true
precision = 1
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if __name__ == .__main__.",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# Per-module coverage minimums for production-critical surfaces
# These are enforced by scripts/config/coverage_enforcer.py in CI
# See issue #3939 for remediation details
# Note: coverage.py does not support per-module fail_under in config;
# use scripts/config/coverage_enforcer.py in CI to enforce these thresholds:
#   - API routes/services: 85%
#   - Engine core/control_interface: 85%
#   - Task management: 80%
#   - Shared utilities: 70%

[tool.coverage.html]
directory = "htmlcov"
