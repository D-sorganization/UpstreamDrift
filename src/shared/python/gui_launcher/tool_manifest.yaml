      class: PIDGeneratorMainWindow
      dependencies:
        - ezdxf
        - PyQt6
      settings_app: PIDGenerator
      min_size: [800, 600]

  - tool_name: pressure_drop_calculator
    name: Pressure Drop Calculator
    description: Pipe flow pressure drop analysis with multiple friction methods
    category: Process Simulation
    icon: pipe
    pyqt6:
      module: >-
        pressure_drop_calculator.python.pressure_drop_calculator.ui.pyqt6.main_window
