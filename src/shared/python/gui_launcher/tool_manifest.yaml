      min_size: [1100, 700]
    web:
      port: 5175
      auto_open_browser: true

  - tool_name: rate_of_closure
    name: Rate of Closure Impact Explorer
    description: >-
      Quantifies how a rotating clubhead's impact-point delivery differs
      from the tracked reference point (COM or geometric center): path
      deviation, attack-angle change, face rotation during contact, and
      the launch-monitor geometric-center question, with an animated 3D
      clubhead and rate sweeps.
    category: Biomechanics
    icon: rotate
    pyqt6:
      module: rate_of_closure.ui.pyqt6.main_window
      class: RateOfClosureMainWindow
      dependencies:
        - PyQt6
        - matplotlib
        - numpy
      settings_app: RateOfClosure
      min_size: [1200, 780]
    web:
      port: 5193
      auto_open_browser: true
  - tool_name: rotation_converter
    name: Rotation Converter
    description: >-
      Comprehensive rotation and rigid-body transform converter with
      interactive 3D visualization. Supports quaternions, Euler angles,
      rotation matrices, axis-angle, SE(3), twists, screw axes, and
      frame-aware transforms.
    category: Robotics
    icon: rotate
    pyqt6:
      module: rotation_converter.ui.pyqt6.main_window
      class: RotationConverterMainWindow
      dependencies:
        - PyQt6
        - matplotlib
      settings_app: RotationConverter
      min_size: [1200, 800]
    web:
      port: 5192
      auto_open_browser: true

  - tool_name: signal_processing_studio
    name: Signal Processing Studio
    description: >-
      Unified signal processing: waveform generation, analysis, filtering,
