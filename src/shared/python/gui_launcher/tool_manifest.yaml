# Tool registration manifest for the Tools platform.
#
# This is the single source of truth for GUI tool registration.
# Each entry mirrors the GUI_INFO dict previously duplicated across 20
# individual gui_registration.py files.
#
# Schema (per tool):
#   tool_name:   snake_case unique identifier (required)
#   name:        human-readable display name (required)
#   description: short description (required)
#   category:    grouping label (required)
#   icon:        icon name hint (optional)
#   pyqt6:       PyQt6 surface config (optional)
#     module:        dotted module path to the main window
#     class:         main window class name
#     dependencies:  list of required packages
#     settings_app:  QSettings application name
#     min_size:      [width, height] minimum window size (optional)
#   web:           web surface config (optional)
#     port:            development server port
#     auto_open_browser: whether to open browser automatically
#   engine:        backend engine config (optional)
#     module:        dotted module path to the engine
#     class:         engine class name
#
# Closes #1863

tools:
  - tool_name: c3d_viewer
    name: C3D Motion Capture Viewer
    description: View and analyze C3D motion capture files
    category: Biomechanics
    icon: body
    pyqt6:
      module: c3d_viewer.ui.pyqt6.main_window
      class: C3DViewerWindow
      dependencies:
        - PyQt6
      settings_app: C3DViewer

  - tool_name: data_processor
    name: Data Processor
    description: Signal processing and time-series data analysis tool
    category: Data Processing
    icon: chart
    pyqt6:
      module: data_processor.ui.pyqt6.main_window
      class: DataProcessorMainWindow
      dependencies:
        - PyQt6
        - pandas
        - numpy
      settings_app: DataProcessor
    web:
      port: 3000
      auto_open_browser: true

  - tool_name: pdf_renamer
    name: PDF Renamer
    description: Intelligent PDF File Renaming Tool
    category: Development Tools
    icon: pdf
    pyqt6:
      module: pdf_renamer.gui
      class: PDFRenamer
      dependencies:
        - PyQt6
        - pdfplumber

  - tool_name: financial_calculator
    name: Financial Calculator
    description: Comprehensive financial modeling for plant operations
    category: Process Simulation
    icon: calculator
    pyqt6:
      module: financial_calculator.ui.pyqt6.main_window
      class: FinancialCalculatorMainWindow
      dependencies:
        - PyQt6
        - numpy
      settings_app: FinancialCalculator
    engine:
      module: upstream_drift_tools.process_calculators.financial_calculator
      class: FinancialModelCalculator
    web:
      port: 5173
      auto_open_browser: false

  - tool_name: flow_rate_converter
    name: Flow Rate Converter
    description: Convert between mass, molar, and volumetric flow rate units
    category: Utilities
    icon: exchange
    pyqt6:
      module: flow_rate_converter.ui.pyqt6.main_window
      class: FlowRateConverterWindow
      dependencies:
        - PyQt6
      settings_app: FlowRateConverter

  - tool_name: folder_packer_pro
    name: Folder Packer Pro
    description: Professional Project Archiving and Distribution Tool
    category: Development Tools
    icon: package
    pyqt6:
      module: folder_packer_pro.app
      class: FolderPackerPro
      dependencies:
        - tkinter
        - cryptography

  - tool_name: folder_tool
    name: Folder Tool (Utility)
    description: Directory Management Utility
    category: Development Tools
    icon: folder
    pyqt6:
      module: Folders_Tool_r0
      class: FolderTool
      dependencies:
        - tkinter

  - tool_name: function_generator
    name: Function Generator
    description: Generate and visualize various waveforms (sine, square, triangle, etc.)
    category: Signal Processing
    icon: wave
    pyqt6:
      module: function_generator.python.function_generator.ui.pyqt6.main_window
      class: FunctionGeneratorWidget
      dependencies:
        - PyQt6
        - matplotlib
        - numpy
      settings_app: FunctionGenerator
      min_size: [1200, 700]
    web:
      port: 5174
      auto_open_browser: true

  - tool_name: humanoid_builder_gui
    name: Humanoid Character Builder
    description: Build parametric humanoid characters with anthropometric calculations
    category: Robotics
    icon: person
    pyqt6:
      module: humanoid_builder_gui.ui.pyqt6.main_window
      class: HumanoidBuilderWindow
      dependencies:
