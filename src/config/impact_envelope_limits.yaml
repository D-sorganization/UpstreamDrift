# Joint angular-velocity limits for the SHOW-C PhysiologicalEnvelope (#14557).
#
# Torque limits are NOT here: they come from the NSX-04 capacity table
# (#12553, src/config/loop_nullspace_registry.json).  Range of motion comes
# from the spec's coordinate_ranges_deg.  Only velocity limits are declared
# in this file; every entry carries a citation record and a verification
# status.
#
# STATUS: every value below is an UNVERIFIED population prior, set
# deliberately generous (well above reported golf peak segment speeds) so a
# velocity limit never masks a binding torque limit.  Replace a value only
# after the cited source has been read; then set verification_status to
# VERIFIED with the table/page location.  Unverified entries are surfaced as
# PhysiologicalEnvelope.assumed_velocity_slots, never silently.
version: 1
velocity_limits_deg_s:
  - coordinates: [HipInputX, HipInputY, HipInputZ]
    value: 1500
    citation:
      {
        id: null,
        note: "pelvis rotation peak in golf is O(500-700 deg/s); prior is ~2x margin",
      }
    verification_status: UNVERIFIED
  - coordinates: [SpineInputX, SpineInputY, TorsoInput]
    value: 2000
    citation:
      {
        id: null,
        note: "thorax rotation peak in golf is O(700-1000 deg/s); prior is ~2x margin",
      }
    verification_status: UNVERIFIED
  - coordinates:
      - lumbar_flexion
      - lumbar_lateral_bending
      - lumbar_axial_rotation
      - thoracic_flexion
      - thoracic_lateral_bending
      - thoracic_axial_rotation
    value: 2000
    citation:
      {
        id: null,
        note: "v2 regional trunk joints (L5/S1, T12/L1); same generous prior as the v1 spine (thorax rotation peak in golf is O(700-1000 deg/s), ~2x margin); not a sourced limit",
      }
    verification_status: UNVERIFIED
  - coordinates: [NeckInputX, NeckInputY, NeckInputZ]
    value: 1500
    citation: { id: null, note: "neck follows the torso; generous prior" }
    verification_status: UNVERIFIED
  - coordinates: [LScapInputX, LScapInputY, RScapInputX, RScapInputY]
    value: 1500
    citation:
      {
        id: null,
        note: "scapular motion is slower than glenohumeral; generous prior",
      }
    verification_status: UNVERIFIED
  - coordinates: [LSInputX, LSInputY, LSInputZ, RSInputX, RSInputY, RSInputZ]
    value: 3000
    citation: { id: null, note: "glenohumeral rotation; generous prior" }
    verification_status: UNVERIFIED
  - coordinates: [LEInput, REInput]
    value: 3000
    citation: { id: null, note: "elbow extension speed; generous prior" }
    verification_status: UNVERIFIED
  - coordinates: [LFInput, RFInput]
    value: 3000
    citation: { id: null, note: "forearm pronation/supination; generous prior" }
    verification_status: UNVERIFIED
  - coordinates: [LWInputX, LWInputY, RWInputX, RWInputY]
    value: 4000
    citation:
      {
        id: null,
        note: "wrist release peak in golf is O(1500-2500 deg/s); prior is ~1.6x margin",
      }
    verification_status: UNVERIFIED
  - coordinates:
      - hip_flexion_r
      - hip_adduction_r
      - hip_rotation_r
      - knee_angle_r
      - ankle_angle_r
      - subtalar_angle_r
      - mtp_angle_r
      - hip_flexion_l
      - hip_adduction_l
      - hip_rotation_l
      - knee_angle_l
      - ankle_angle_l
      - subtalar_angle_l
      - mtp_angle_l
    value: 1500
    citation:
      {
        id: null,
        note: "lower-limb joint speeds in the swing are well below this; generous prior",
      }
    verification_status: UNVERIFIED

# Shoulder (glenohumeral) range of motion, deg, in MODEL sign (D35/D39, #14557).
#
# The spec's coordinate_ranges_deg is a HARD IK bound, so a shoulder range does
# not go there; from_spec merges this section under hard and soft_limits_deg
# ranges.  One source and one verification_status PER SIDE, because a single
# coordinate is cited on one side only.  Sign map (coordinate_sign_map.py): the
# zero pose is the forward-raised arm (90 deg flexion); Y+ lowers the arm
# (Y = 90 - flexion, extension is Y > 90); left Z+ is external rotation and
# right Z+ is internal rotation; X is horizontal abduction (left +) or
# adduction (right +).  Shoulder coordinates are relative to the thorax.
#
# SOURCED (SOURCED_WITH_ASSUMED_MARGIN, full text read): flexion and external rotation, Gill 2020
# Tables 1 and 3, male "All participants" row, bound = mean + 1 SD (~84th
# percentile of a healthy community sample, so a normal swing is not rejected).
# The margin and the arm-at-side ER posture are assumptions, so these sides are
# not VERIFIED and a breach reads assumption-limited (D32); the source stays cited.
# Caveats: general-population adults (mean age 45.8 y, not athletes), single
# active inclinometer/visual measurement, ER measured at the side with the
# elbow bent (the model zero pose is arm-raised).  Abduction is not a single
# model axis (it is elevation in the frontal plane), so it is not used.
# ASSUMED (UNVERIFIED): extension, internal rotation, horizontal motion; no
# source read in full (Fleisig 2022 Appendix A download is not approved).
# A breach on an assumed side is reported assumption-limited (D32), never as
# probable miscalibration.
declared_rom_deg:
  - coordinate: LSInputX
    lower:
      value: -130.0
      citation:
        {
          id: null,
          note: "horizontal abduction/adduction prior; no source read",
        }
      verification_status: UNVERIFIED
    upper:
      value: 130.0
      citation:
        {
          id: null,
          note: "horizontal abduction/adduction prior; no source read",
        }
      verification_status: UNVERIFIED
  - coordinate: RSInputX
    lower:
      value: -130.0
      citation:
        {
          id: null,
          note: "horizontal abduction/adduction prior; no source read",
        }
      verification_status: UNVERIFIED
    upper:
      value: 130.0
      citation:
        {
          id: null,
          note: "horizontal abduction/adduction prior; no source read",
        }
      verification_status: UNVERIFIED
  - coordinate: LSInputY
    lower:
      value: -88.0
      citation:
        reference: "Gill TK, Shanahan EM, Tucker GR, Buchbinder R, Hill CL. Shoulder range of movement in the general population: age and gender stratified normative data using a community-based cohort. BMC Musculoskelet Disord 21:676 (2020)"
        doi: "10.1186/s12891-020-03665-9"
        note: "Table 1, male left flexion 159.9 (SD 18.1) deg; bound = mean + 1 SD = 178.0; Y = 90 - 178.0"
      verification_status: SOURCED_WITH_ASSUMED_MARGIN
    upper:
      value: 150.0
      citation:
        {
          id: null,
          note: "shoulder extension prior (Y = 90 + 60); no source read",
        }
      verification_status: UNVERIFIED
  - coordinate: RSInputY
    lower:
      value: -90.2
      citation:
        reference: "Gill TK, Shanahan EM, Tucker GR, Buchbinder R, Hill CL. Shoulder range of movement in the general population: age and gender stratified normative data using a community-based cohort. BMC Musculoskelet Disord 21:676 (2020)"
        doi: "10.1186/s12891-020-03665-9"
        note: "Table 1, male right flexion 161.5 (SD 18.7) deg; bound = mean + 1 SD = 180.2; Y = 90 - 180.2"
      verification_status: SOURCED_WITH_ASSUMED_MARGIN
    upper:
      value: 150.0
      citation:
        {
          id: null,
          note: "shoulder extension prior (Y = 90 + 60); no source read",
        }
      verification_status: UNVERIFIED
  - coordinate: LSInputZ
    lower:
      value: -90.0
      citation: { id: null, note: "internal rotation prior; no source read" }
