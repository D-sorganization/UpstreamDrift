# Joint angular-velocity limits for the SHOW-C PhysiologicalEnvelope (#14557).
#
# Torque limits are NOT here: they come from the NSX-04 capacity table
# (#12553, src/config/loop_nullspace_registry.json).  Range of motion comes
# from the spec's coordinate_ranges_deg.  Only velocity limits are declared
# in this file; every entry carries a citation record and a verification
# status.
#
# STATUS (SHOW-C1 #14557): entries marked SOURCED_WITH_ASSUMED_MARGIN take the
# highest full-text-verified group-mean peak for skilled male golfers (driver)
# and multiply by a stated 2x margin; they are NOT "VERIFIED" (the margin is an
# assumption), so they still surface as assumed_velocity_slots. Sources are
# listed in each citation (id, table/page, population, observed value).
# Remaining UNVERIFIED entries: every such value is an UNVERIFIED population prior, set
# deliberately generous (well above reported golf peak segment speeds) so a
# velocity limit never masks a binding torque limit.  Replace a value only
# after the cited source has been read; then set verification_status to
# VERIFIED with the table/page location.  Unverified entries are surfaced as
# PhysiologicalEnvelope.assumed_velocity_slots, never silently.
version: 1
velocity_limits_deg_s:
  - coordinates: [HipInputX, HipInputY]
    value: 1500
    citation: { id: null, note: "pelvis tilt axes: no source; generous prior" }
    verification_status: UNVERIFIED
  - coordinates: [HipInputZ]
    value: 1030
    citation:
      {
        id: "10.1371/journal.pone.0331051",
        location: "Liu et al. 2025, PLoS One 20(9):e0331051, Table 3 (second peak angular velocity, driver)",
        population: "10 low-handicap right-handed college males, driver, Qualisys 250 Hz, 6 Hz filter; group mean",
        observed_deg_s: 515,
        observed_sd_deg_s: 79,
        margin: 2.0,
        target_clubhead_mph: 125,
        study_clubhead_mph: 100.0,
        study_speed_basis: "club speed not reported; cohort is low-handicap (1.3) college males, so 100 mph is ASSUMED (Sweeney's 100.7 mph, rounded down; a lower study speed raises the limit)",
        two_x_term: 1030,
        scaled_term: 940.0,
        binding_term: two_x,
        note: "Pelvis axial rotation 515 +- 79 deg/s (Myers 2008 high group 434, Horan 2012 pros 464, Neal 2007 488 agree below it). Limit = max(2 x mean, (mean + 3 SD) x 125 / study club speed) per D38; both terms and the winner are recorded above (ASSUMED, no per-golfer maxima reported). Segment rate in the lab frame used as a joint-rate bound.",
      }
    verification_status: SOURCED_WITH_ASSUMED_MARGIN
  - coordinates: [SpineInputX, SpineInputY]
    value: 2000
    citation: { id: null, note: "spine bend axes: no source; generous prior" }
