# Launcher registry exclusions (issue #8863).
#
# Every package under src/tools/ must either be reachable from a launcher
# tile (its path referenced by src/config/models.yaml or
# launcher_manifest.json) or be listed here with a reason. This file is
# validated by tests/config/test_registry_exclusions.py, so a new tool
# package must explicitly choose one of the two — silent "unregistered
# tool" drift fails CI.
#
# Schema: exclusions: list of {package, reason, issue (optional)}.
# - package: directory name under src/tools/
# - reason: why this package deliberately has no launcher tile
# - issue: tracking issue if the exclusion is temporary

exclusions:
  - package: contraction
    reason: >-
      Headless research CLI (python -m src.tools.contraction) for
      contraction/Floquet analysis of trajectory data; no GUI surface,
      consumed by analysts from the terminal, not launcher users.
  - package: drift_control
    reason: >-
      Headless research CLI (python -m src.tools.drift_control) computing
      drift-to-control force ratios from NPZ trajectories; terminal-only
      analysis workflow with no dockable or windowed UI.
  - package: sg_optimizer
    reason: >-
      Phase 1 ships the headless CLI only; the PyQt6 tile is deliberately
      deferred to Phase 3 of the Strokes Gained Optimizer epic, at which
      point this exclusion is replaced by a models.yaml tile.
    issue: "#6272"
  - package: hmr2_sidecar
    reason: >-
      License-isolation subprocess sidecar for the CC-BY-NC 4D-Humans/HMR
      2.0 pipeline; invoked by the motion pipeline via HMR2_COMMAND, never
      launched directly by users.
  - package: matlab_utilities
    reason: >-
      Script grab-bag supporting the MATLAB/Simscape suite; the user-facing
      surface is the matlab_suite tile (virtual/matlab_suite), which
      dispatches to the Simscape chooser dialog.
  - package: offline_validation
    reason: >-
      Offline gradient-oracle validation helpers intentionally outside the
      runtime launch surface (requires a separately pinned nimblephysics
      environment); used by validation jobs, not end users.
  - package: video_analyzer
    reason: >-
      Library package (adapter + analysis API) backing the Tools-provided
      video_analyzer tile; the launchable app resolves inside the
      vendor/ud-tools gitlink (provider: tools), not this package.
